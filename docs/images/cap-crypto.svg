<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img"
     aria-label="加密接口：EasyCharles 在加密之前取到明文，其他抓包工具只能拿到密文">
  <title>加密接口也能看</title>
  <style>
    text { font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", Arial, sans-serif; }
    .node   { font-size: 13.5px; font-weight: 700; fill: #1f2937; }
    .nodesub{ font-size: 10.5px; fill: #6b7280; }
    .code   { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 10.5px; }
    .arlab  { font-size: 10px; fill: #6b7280; text-anchor: middle; }
    .good   { font-size: 11.5px; fill: #2b6cb0; }
    .bad    { font-size: 11px; fill: #b42318; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b42318"/>
    </marker>
  </defs>

  <rect width="1000" height="250" fill="#ffffff"/>

  <!-- 上标注：EasyCharles 抓在加密之前 -->
  <text class="good" x="110" y="32">✓ EasyCharles 在加密之前取 → 明文，不用自己写解密脚本</text>
  <line x1="200" y1="42" x2="200" y2="66" stroke="#2b6cb0" stroke-width="1.6" marker-end="url(#arG)"/>

  <!-- 明文 -->
  <rect x="110" y="70" width="200" height="86" rx="12" fill="#f7fafe" stroke="#2b6cb0"/>
  <text class="node" x="130" y="98">App 里的业务数据</text>
  <text class="code" x="130" y="122" fill="#2b6cb0">{ "amount": 100 }</text>
  <text class="nodesub" x="130" y="142">加密之前长这样</text>

  <!-- 箭头：加密 -->
  <line x1="314" y1="113" x2="376" y2="113" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ar)"/>
  <text class="arlab" x="345" y="103">加密</text>

  <!-- 密文 -->
  <rect x="380" y="70" width="240" height="86" rx="12" fill="#fffbfa" stroke="#f3d3cf"/>
  <text class="node" x="400" y="98">网络上跑的 body</text>
  <text class="code" x="400" y="122" fill="#b42318">U2FsdGVkX1+9kQ…</text>
  <text class="nodesub" x="400" y="142">加密之后是一串乱码</text>

  <!-- 箭头：解密 -->
  <line x1="624" y1="113" x2="686" y2="113" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ar)"/>
  <text class="arlab" x="655" y="103">解密</text>

  <!-- 服务器 -->
  <rect x="690" y="70" width="200" height="86" rx="12" fill="#f8fafc" stroke="#e4e7ec"/>
  <text class="node" x="710" y="98">服务器</text>
  <text class="code" x="710" y="122" fill="#374151">{ "amount": 100 }</text>
  <text class="nodesub" x="710" y="142">收到的是明文</text>

  <!-- 下标注：其他工具 -->
  <text class="bad" x="380" y="214">✗ 其他抓包工具只能拿到这一段：密文，得自己写解密</text>
  <line x1="450" y1="196" x2="450" y2="162" stroke="#b42318" stroke-width="1.6" marker-end="url(#arR)"/>

  <line x1="24" y1="232" x2="976" y2="232" stroke="#f1f5f9"/>
</svg>
