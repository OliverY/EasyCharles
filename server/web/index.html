              ? '每次请求随机返回一条。'
              : '序列指针按<b>设备</b>各自独立推进（互不影响）；改序<b>不会</b>重置已推进的位置，' +
                '需要归零请用顶栏「规则 → 重置序列指针」（全局，影响所有规则）。') +
        '</div>' +
        '<div class="resp-list" id="md-resp-list">' +
          rs.map((item, i) => respRowHTML(item, i, d)).join('') +
        '</div>' +
        '<div class="resp-edit">' +
          '<div class="grid3" style="margin-top:0">' +
            '<label>状态码</label><input type="text" id="md-resp-status" style="width:80px" placeholder="200"' +
              ' value="' + esc(String(cur.status == null ? '' : cur.status)) + '">' +
          '</div>' +
          '<div class="grid3">' +
            '<label>Content-Type</label><input type="text" id="md-resp-ct" placeholder="application/json"' +
              ' value="' + esc(cur.contentType || '') + '">' +
          '</div>' +
          '<div class="grid3">' +
            '<label>本条备注</label><input type="text" id="md-resp-name" placeholder="仅展示用，如 登录成功"' +
              ' value="' + esc(cur.name || '') + '">' +
          '</div>' +
          '<div class="sec-head" style="margin-top:14px">' +
            '<span class="t">返回值正文 · ' + circleNum(d.sel) + '</span>' +
            '<span class="sh-acts">' +
              (d.source ? '<button type="button" data-act="reset-resp">重置为真实值</button>' : '') +
              '<button type="button" data-act="format-body">格式化 JSON</button>' +
              '<button type="button" data-act="zoom-body">放大编辑</button>' +
            '</span>' +
          '</div>' +
          '<textarea class="editor-body mock-body-editor" id="md-body" spellcheck="false" placeholder="在这里编辑返回值…">' +
            esc(String(cur.body == null ? '' : cur.body)) +
          '</textarea>' +
        '</div>' +
      '</div>' +

      '<div class="sec">' +
        '<div class="grid3" style="margin-top:0">' +
          '<label>规则备注</label><input type="text" id="md-name" value="' + esc(d.name) + '" placeholder="仅展示用">' +
        '</div>' +
        '<div class="grid3">' +
          '<label>优先级</label><input type="text" id="md-priority" value="' + esc(d.priority) + '" style="width:80px" placeholder="10">' +
        '</div>' +
        '<div class="hint" style="margin-top:6px">数值越大越先匹配，命中多条时只取最高优先级的一条。' +
          '按入参精确匹配的规则，优先级要高过「只匹配路径」的规则，否则会被遮蔽。</div>' +
      '</div>' +

      '<div class="acts">' +
        '<button class="primary" data-act="save"' +
          (inRules ? ' title="这条规则已在服务端保存（点「Mock 此接口」时自动存了）；改了返回值或备注再点这里"' : '') +
          '>保存并生效</button>' +
        '<button class="danger" data-act="delete" title="' +
          (inRules ? '删除这条 mock 规则（立即生效）' : '丢弃这条还没保存的草稿') + '">' +
          (inRules ? '删除' : '丢弃草稿') + '</button>' +
        '<button data-act="curl">复制为 cURL</button>' +
      '</div>' +
    '</div>';
}

function formatDraftBody() {
  const d = state.mockDraft;
  const cur = curResp(d);
  if (!cur) return;
  const result = parseJsonValue(cur.body);
  if (!result.ok) { toast('不是合法 JSON，未格式化'); return; }
  cur.body = JSON.stringify(result.value, null, 2);
  renderMockEditor();
  const ed = $('md-body');
  if (ed) ed.focus();
}

/** 「重置为真实值」：把当前选中条目的状态码 / 类型 / 正文换回记录里的真实响应（本条备注保留） */
function resetDraftResponse() {
  const d = state.mockDraft;
  if (!d || !d.source) return;
  const rec = state.records.find((x) => x.id === d.source);
  if (!rec) { toast('原始记录已不在当前列表（可能已被清空或服务重启）'); return; }
  const cur = curResp(d);
  if (!cur) return;
  Object.assign(cur, responseFromRecord(rec, cur.name));
  renderMockEditor();
  toast('已重置为真实响应');
}

/** 「追加真实响应」：再补一条来自同一条记录的返回值（做「成功 + 失败」两条时省手敲） */
function appendRealResponse() {
  const d = state.mockDraft;
  if (!d || !d.source) return;
  const rec = state.records.find((x) => x.id === d.source);
  if (!rec) { toast('原始记录已不在当前列表（可能已被清空或服务重启）'); return; }
  const rs = respList(d);
  rs.push(responseFromRecord(rec, '真实响应 ' + (rs.length + 1)));
  d.sel = rs.length - 1;
  normalizePick(d);
  renderMockEditor();
  toast('已追加当前真实响应');
}

/**
 * 保存一条规则：走**单条接口**（新建 POST /rules、改这一条 PUT /rules/:id），不再整表 PUT。
 * C14 之后 PUT /rules 的语义是「替换我的**全部**私有规则」——两个窗口各开着不同项目时，
 * 后保存的那个会把另一个项目的规则整个删掉（ADR-028 那类覆盖事故的归属版）。
 */
async function saveDraft() {
  const d = state.mockDraft;
  if (!d) return false;
  // 空 match 会 mock 掉所有请求，必须拦住
  if (!String(d.path || '').trim() && !String(d.host || '').trim()) {
    toast('请至少填写域名或路径，否则会 mock 掉全部请求');
    return false;
  }
  // 归属闸（C14）：规则必须属于一个我的私有项目，否则**永不命中**、服务端也直接 400。
  // 先跟着当前视图补一次；实在没有就自动建一个「默认项目」，建不出来才提示手动新建
  if (!isWritableProject(projectById(state.projects, d.projectId))) d.projectId = writableProjectId();
  if (!isWritableProject(projectById(state.projects, d.projectId))) {
    const created = await ensureDefaultProject();
    if (created) d.projectId = created;
  }
  if (!isWritableProject(projectById(state.projects, d.projectId))) {
    toast('自动创建默认项目失败：请到「模板」模式手动新建后再保存');
    return false;
  }
  const sourceId = d.source;
  const keepSel = Math.max(0, Math.trunc(Number(d.sel) || 0));
  const rule = draftToRule(d);
  const isNew = !state.allRules.some((r) => r && r.id === rule.id);
  let res;
  if (isNew) {
    // 新建时 id **必须省略**（服务端生成：撞 id 时「改了 A 结果变的是 B」比一句 400 难查）。
    // 草稿上那个 r_ 只是本地占位，用来在列表里显示这条未保存项
    const payload = Object.assign({}, rule);
    delete payload.id;
    res = await apiFetch('/__ec/api/rules', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ rule: payload }),
    });
  } else {
    res = await apiFetch('/__ec/api/rules/' + encodeURIComponent(rule.id), {
      method: 'PUT', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ rule: rule }),
    });
  }
  if (!res.ok) {
    // 失败：**草稿一个字不动**（用户改的还在编辑区），只把服务端真值拉回来重画左侧
    toast('保存失败：' + (await apiErrText(res)));
    await refreshMockData();
    renderMockEditor();
    return false;
  }
  const data = await res.json().catch(() => ({}));
  const saved = data.rule || rule;
  if (saved.id !== d.id) {
    // 「忽略」参数是本机按规则 id 记的：换了 id 要搬过去，否则下次打开这些参数默默变「匹配」
    const ignored = loadIgnored(d.id);
    if (ignored.length) saveIgnored(saved.id, ignored);
    clearIgnored(d.id);
  }
  saveIgnored(saved.id, d.params.filter((p) => !p.on));
  state.mockDraft = null;
  await refreshMockData();
  state.mockDraft = ruleToDraft(saved);
  // 记录来源跨保存保留：保存后「重置为真实值 / 追加真实响应」仍然可用（否则一点保存按钮就消失了）
  state.mockDraft.source = sourceId;
  // 停在保存前正在编辑的那条上（否则每保存一次就跳回第 1 条，多条返回值时很烦）
  state.mockDraft.sel = keepSel;
  normalizePick(state.mockDraft);
  renderMockList(); renderMockEditor();
  const where = '已保存到「' + projectNameOf(state.projects, saved.groupId) + '」';
  toast(saved.enabled ? where + '，规则已生效' : where + '，规则未启用');
  return true;
}

/**
 * 命中方式（指定 / 按顺序+子模式 / 随机，以及列表左侧圆点）改动后**立即生效**，
 * 不再要求用户回到顶部点「保存并生效」——它和列表里的「开 / 关」一样，
 * 属于「改完就想看效果」的开关式操作。
 *
 * 两个刻意的限制：
 * 1. **只对已落库的规则自动保存**。新草稿连 match 都还没填（保存必然被拦），
 *    而且用户可能只是随手点一下看看控件；那一步仍然走显式的「保存并生效」。
 * 2. **不复用 `saveDraft()`**：后者保存后会按落库结果**重建整个草稿**
 *    （`state.mockDraft = ruleToDraft(...)`），连点几次时会把后一次点击的改动冲掉。
 *    这里只把 pick/pinIndex 的结果写回该条规则并落库，草稿其它部分原样保留。
 *
 * 串行化：连点「指定 → 按顺序 → 随机」会发多次 PUT，串成一条链保证**后发的那次最后落地**
 * （同一条规则的单条替换是整条覆盖，乱序到达就会被旧的那次盖掉）。
 */
let pickSaveChain = Promise.resolve();
function applyPickChange() {
  pickSaveChain = pickSaveChain.then(applyPickChangeNow).catch(() => {});
  return pickSaveChain;
}

async function applyPickChangeNow() {
  const d = state.mockDraft;
  if (!d) return;
  if (!state.allRules.some((r) => r && r.id === d.id)) return;   // 还没落库的草稿：走显式保存
  // 与 saveDraft 同一道闸：空 match 会 mock 掉所有请求（存量脏数据也要拦）
  if (!String(d.path || '').trim() && !String(d.host || '').trim()) {
    toast('命中方式未生效：请至少填写域名或路径');
    return;
  }
  const rule = draftToRule(d);
  // 单条 PUT：只动这一条，且**不带别的项目的规则**——整表 PUT 在 C14 是「替换我的全部私有规则」
  const res = await apiFetch('/__ec/api/rules/' + encodeURIComponent(rule.id), {
    method: 'PUT', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ rule: rule }),
  });
  if (!res.ok) {
    toast('命中方式未生效：' + (await apiErrText(res)));
    await refreshMockData();
    renderMockEditor();
    return;
  }
  await refreshMockData();
  renderMockList();
  toast(rule.enabled ? '命中方式已生效' : '命中方式已保存（规则未启用）');
}

async function deleteDraft() {
  const d = state.mockDraft;
  if (!d) return;
  // 还没保存过的草稿：本地丢弃即可，服务端没有这条（判断要看**全量**，不是当前项目那几条）
  if (!state.allRules.some((r) => r && r.id === d.id)) {
    state.mockDraft = null; renderMockList(); renderMockEditor(); return;
  }
  // 已存在的规则：走单条删除接口（与列表里的 × 同一条路径）
  await removeRule(d.id);
}

function copyCurl() {
  const d = state.mockDraft;
  if (!d) return;
  const cur = curResp(d);
  const body = cur ? String(cur.body || '') : '';
  const contentType = (cur && cur.contentType) || 'application/json';
  const qs = d.params.filter((p) => p.on && String(p.k || '').trim())
    .map((p) => encodeURIComponent(p.k) + '=' + encodeURIComponent(p.v)).join('&');
  const path = d.path || '/';
  const method = String(d.method || 'GET').toUpperCase();
  const target = 'https://' + (d.host || 'api.example.com') + path + (qs ? '?' + qs : '');
  const lines = [
    "curl -X " + method + " 'http://127.0.0.1:8899/__ec/p" + path + (qs ? '?' + qs : '') + "'",
    "  -H 'X-EC-Target: " + target + "'",
    "  -H 'X-EC-Device-Id: dev-001' -H 'X-EC-Session-Id: sess-001'",
  ];
  if (method !== 'GET' && method !== 'HEAD') {
    lines.push("  -H 'content-type: " + contentType + "'");
    lines.push("  -d '" + body.replace(/'/g, "'\\''") + "'");
  }
  copyText(lines.join(' \\\n'), () => toast('已复制 cURL'));
}

/**
 * 浏览模式 → Mock 模式：把记录的返回值带过去（id 缺省用当前选中项）。
 *
 * **新建时立即落库**：点「Mock 此接口」就等于建好一条启用中的规则（返回值 = 当前真实响应），
 * 不必再回 Mock 模式点一次「保存并生效」——那一步只是把用户刚做过的动作再确认一遍，
 * 而且很容易以为「点过 Mock 了就已经生效」，实际请求还在透传（静默失效，最难查）。
 * 已存在的规则只载入、不写盘（没有任何改动可保存）。
 *
 * 落库失败（没有可写项目 / 服务端 400 / 网络断）时草稿原样留在编辑器里，退回旧行为：
 * 用户改完手动点「保存并生效」，失败原因由 saveDraft() 如实提示，不会被吞掉。
 */
let mockFromRecordBusy = false;
async function mockFromRecord(id) {
  // 连点两下不能建出两条规则（第一条还在路上时 allRules 里没有它，去重判断会漏）
  if (mockFromRecordBusy) return;
  const rec = state.records.find((x) => x.id === (id || state.selected));
  if (!rec) return;
  const existing = findRuleForRecord(rec);
  if (existing) {
    state.mockDraft = ruleToDraft(existing);
    // 允许用「重置为真实值」把当前这条记录的响应拉进来
    state.mockDraft.source = rec.id;
    setMode('mock');
    toast('已有相同匹配的规则，已载入；可点「重置为真实值」换成当前响应');
    return;
  }
  state.mockDraft = draftFromRecord(rec);
  // 新草稿一出生就要有归属：跟着当前分组填上；一个分组都没有时 saveDraft 会自动建
  // 「默认项目」（归属闸），这里不阻塞用户编辑
  state.mockDraft.projectId = writableProjectId();
  setMode('mock');
  mockFromRecordBusy = true;
  try {
    // 成功时 saveDraft() 自己会 toast「已保存到「X」，规则已生效」
    await saveDraft();
  } catch (e) {
    toast('自动保存失败：' + (e && e.message ? e.message : '网络异常') + '；可在编辑器里手动保存');
  } finally {
    mockFromRecordBusy = false;
  }
}

function bindMockEditor() {
  const el = $('mock-editor');
  // 项目卡与共享面板的动作走 data-pa，和规则编辑器的 data-act 分成两套属性：
  // 同一个容器里两套按钮混用同名属性，「删除项目」就会掉进「删除这条规则」的分支里
  el.addEventListener('click', (ev) => {
    const n = ev.target.closest ? ev.target.closest('[data-pa]') : null;
    if (!n) return;
    const pa = n.dataset.pa;
    const id = n.dataset.pid;
    if (pa === 'ptoggle') { askToggleProject(id); }
    else if (pa === 'rename') {
      const p = projectById(state.projects, id);
      const name = p ? window.prompt('项目改名', p.name) : null;
      if (name !== null) void renameProject(id, name);
    }
    else if (pa === 'del-project') { askDeleteProject('private', id); }
    else if (pa === 'share') { void sharePrivate(id); }
    else if (pa === 'new') { promptNewProject(); }
  });
  el.addEventListener('input', (ev) => {
    const d = state.mockDraft;
    if (!d) return;
    const t = ev.target;
    const i = Number(t.dataset ? t.dataset.i : NaN);
    if (t.classList.contains('pp-k')) { if (d.params[i]) d.params[i].k = t.value; return; }
    if (t.classList.contains('pp-v')) { if (d.params[i]) d.params[i].v = t.value; return; }
    if (t.id === 'md-name') d.name = t.value;
    // 注意：匹配条件（method / host / path）在编辑器里是只读的一行摘要（matchLine），
    // 根本没有可编辑控件 —— 这里刻意没有分支：草稿的匹配条件只在 draftFromRecord() /
    // ruleToDraft() 里赋值，不存在第二条写入路径（ADR-026）。
    else if (t.id === 'md-priority') d.priority = t.value;
    else if (t.id === 'md-body') { const cur = curResp(d); if (cur) cur.body = t.value; }
    // 多返回值：编辑的是「当前选中」那一条；列表里的摘要等下次重绘时刷新
    else if (t.id === 'md-resp-status') { const cur = curResp(d); if (cur) cur.status = t.value; }
    else if (t.id === 'md-resp-ct') { const cur = curResp(d); if (cur) cur.contentType = t.value; }
    else if (t.id === 'md-resp-name') { const cur = curResp(d); if (cur) cur.name = t.value; }
  });
  el.addEventListener('change', (ev) => {
    const d = state.mockDraft;
    if (!d) return;
    const t = ev.target;
    if (t.id === 'md-enabled') {
      d.enabled = t.checked;
      return;
    }
    // 归属项目下拉已撤出 Mock 模式：草稿保存时自动归当前项目（saveDraft 的归属闸）
    // 命中方式：指定 / 按顺序 / 随机
    if (t.name === 'md-pick') {
      if (t.value === 'specific') d.pick = 'specific';
      else if (t.value === 'random') d.pick = 'random';
      // 点「按顺序」时保留上次选的顺序子模式；没有则用默认（循环返回）
      else d.pick = nextSeqPick(d.pick);
      renderMockEditor();       // 同步重绘：子模式下拉/选中态立刻跟上，不欠一拍
      void applyPickChange();
      return;
    }
    if (t.id === 'md-seqmode') {
      d.pick = nextSeqPick(t.value);
      renderMockEditor();
      void applyPickChange();
      return;
    }
    // 列表左侧圆点：指定每次都返回这一条（等价于「命中方式 = 指定」）
    if (t.name === 'md-pin') {
      d.pick = 'specific';
      d.pinIndex = Number(t.dataset.ri) || 0;
      d.sel = d.pinIndex;
      normalizePick(d);
      renderMockEditor();
      void applyPickChange();
    }
  });
  el.addEventListener('click', (ev) => {
    const d = state.mockDraft;
    if (!d) return;
    // 匹配/忽略 状态胶囊：原地切换，不整块重绘（避免丢滚动位置/输入焦点）
    const st = ev.target.closest('.pp-st');
    if (st) {
      const i = Number(st.dataset.i);
      if (d.params[i]) {
        d.params[i].on = !d.params[i].on;
        st.textContent = d.params[i].on ? '匹配' : '忽略';
        st.classList.toggle('on', d.params[i].on);
        const chipEl = st.closest('.pchip');
        if (chipEl) chipEl.classList.toggle('on', d.params[i].on);
        const n = $('md-param-count');
        if (n) n.textContent = d.params.filter((p) => p.on).length + ' / ' + d.params.length + ' 项参与';
      }
      return;
    }
    const btn = ev.target.closest('button[data-act]');
    if (!btn) {
      // 点返回值行（不含行内的 radio）→ 选中它并把它带进下方编辑区
      const row = ev.target.closest('.resp-item');
      if (row && !ev.target.closest('input')) {
        d.sel = Number(row.dataset.ri) || 0;
        normalizePick(d);
        renderMockEditor();
      }
      return;
    }
    const act = btn.dataset.act;
    const ri = Number(btn.dataset.ri);
    const rs = respList(d);
    if (act === 'add-param') { d.params.push({ k: '', v: '', on: true }); renderMockEditor(); }
    else if (act === 'params-all') { d.params.forEach((p) => { p.on = true; }); renderMockEditor(); }
    else if (act === 'params-none') { d.params.forEach((p) => { p.on = false; }); renderMockEditor(); }
    else if (act === 'zoom-body') openRespModal({ edit: true });
    else if (act === 'format-body') formatDraftBody();
    else if (act === 'reset-resp') resetDraftResponse();
    else if (act === 'add-resp') {
      rs.push(emptyResponse());
      d.sel = rs.length - 1;
      normalizePick(d);
      renderMockEditor();
    }
    else if (act === 'append-resp') appendRealResponse();
    else if (act === 'dup-resp') {
      if (!rs[ri]) return;
      // 副本插在原件后面（浅拷贝即可：条目里的字段都是标量 / 一层 headers）
      rs.splice(ri + 1, 0, { ...rs[ri], headers: { ...(isPlainObject(rs[ri].headers) ? rs[ri].headers : {}) } });
      d.sel = ri + 1;
      if (Number(d.pinIndex) > ri) d.pinIndex = Number(d.pinIndex) + 1;
      normalizePick(d);
      renderMockEditor();
    }
    else if (act === 'del-resp') {
      if (rs.length <= 1) { toast('至少保留一条返回值；不需要这条 mock 请直接关掉规则'); return; }
      if (!rs[ri]) return;
      rs.splice(ri, 1);
      // 删掉的那条之前的条目下标不变；指定与选中项跟着剩下的条目走
      if (Number(d.pinIndex) > ri) d.pinIndex = Number(d.pinIndex) - 1;
      else if (Number(d.pinIndex) === ri) d.pinIndex = Math.min(ri, rs.length - 1);
      if (d.sel > ri) d.sel = d.sel - 1;
      else if (d.sel === ri) d.sel = Math.min(ri, rs.length - 1);
      normalizePick(d);
      renderMockEditor();
    }
    else if (act === 'up-resp') { reorderResp(d, ri, ri - 1); renderMockEditor(); }
    else if (act === 'down-resp') { reorderResp(d, ri, ri + 1); renderMockEditor(); }
    else if (act === 'save') void saveDraft();
    else if (act === 'delete') void deleteDraft();
    else if (act === 'curl') copyCurl();
  });

  // ── 拖动排序（原生 HTML5 DnD，零依赖）──
  // 拖动期间**不能**重绘列表：被拖的节点一旦被 innerHTML 换掉，HTML5 DnD 会直接取消。
  // 所以 dragover 只做插入位高亮，真正换序在 drop 时一次完成。
  let dragFrom = -1;
  let dropAt = null;   // { to, after }
  const clearDropMarks = () => {
    el.querySelectorAll('.resp-item').forEach((n) => n.classList.remove('drop-before', 'drop-after'));
  };
  el.addEventListener('dragstart', (ev) => {
    const row = ev.target.closest ? ev.target.closest('.resp-item') : null;
    if (!row) return;
    dragFrom = Number(row.dataset.ri);
    row.classList.add('dragging');
    if (ev.dataTransfer) {
      ev.dataTransfer.effectAllowed = 'move';
      // Firefox 必须 setData 才会真正开始拖动；某些浏览器对自定义类型有限制，失败不影响排序
      try { ev.dataTransfer.setData('text/plain', String(dragFrom)); } catch (e) { /* 忽略 */ }
    }
  });
  el.addEventListener('dragover', (ev) => {
    if (dragFrom < 0) return;
    const row = ev.target.closest ? ev.target.closest('.resp-item') : null;
    if (!row) return;
    ev.preventDefault();
    if (ev.dataTransfer) ev.dataTransfer.dropEffect = 'move';
    const rect = row.getBoundingClientRect ? row.getBoundingClientRect() : null;
    const after = !!(rect && ev.clientY > rect.top + rect.height / 2);
    dropAt = { to: Number(row.dataset.ri), after };
    clearDropMarks();
    row.classList.add(after ? 'drop-after' : 'drop-before');
  });
  el.addEventListener('drop', (ev) => {
    if (dragFrom < 0) return;
    ev.preventDefault();
    const d = state.mockDraft;
    if (d && dropAt) {
      const rs = respList(d);
      const j = dropAt.to;
      // 「插到第 j 条之前 / 之后」换算成 reorderResp 需要的「移除后下标」
      const to = dropAt.after ? (dragFrom < j ? j : j + 1) : (dragFrom < j ? j - 1 : j);
      reorderResp(d, dragFrom, Math.min(Math.max(to, 0), rs.length - 1));
      renderMockEditor();
    }
    dragFrom = -1; dropAt = null;
  });
  el.addEventListener('dragend', () => {
    dragFrom = -1; dropAt = null;
    clearDropMarks();
    el.querySelectorAll('.resp-item.dragging').forEach((n) => n.classList.remove('dragging'));
  });
}

// ── 现场快照（详情页一键生成免登录只读链接，ADR-017）──
// 前台只保留「生成并复制」这一个动作：不提供快照列表 / 失效 / 清空的管理界面。
// 链接的收回交给服务端 TTL（--snapshot-ttl，默认 7 天），或用管理面接口处理。
async function shareSnapshot() {
  const rec = state.records.find((x) => x.id === state.selected);
  if (!rec) return;
  const btn = $('detail').querySelector('button[data-snap]');
  if (btn) { btn.disabled = true; btn.textContent = '生成中…'; }
  let data = null;
  try {
    const res = await apiFetch('/__ec/api/snapshots', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ recordId: rec.id, title: (rec.request.method || '') + ' ' + (rec.request.path || '') }),
    });
    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      toast('创建快照失败：' + (d.message || res.status));
      return;
    }
    data = await res.json();
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '分享快照'; }
  }
  if (!data) return;
  const url = (Array.isArray(data.urls) && data.urls[0]) || '';
  if (!url) { toast('快照已创建'); return; }
  showSnapResult(url);
  // 回环地址只有本机能打开：直接说出来，避免「分享出去但对方打不开」的静默失效
  const loopback = /^https?:\/\/(127\.0\.0\.1|localhost)(:|\/|$)/i.test(url);
  copyText(url, () => toast(loopback
    ? '链接已复制，但它是回环地址（127.0.0.1）——局域网里打不开，需以 --lan 启动'
    : '快照链接已复制，打开无需登录'));
}

/** 把刚生成的链接贴在详情页里（可再复制一次，或手动选中） */
function showSnapResult(url) {
  const box = $('detail').querySelector('.snap-result');
  if (!box) return;
  box.innerHTML =
    '<span class="k">快照链接（免登录）</span>' +
    '<code class="v">' + esc(url) + '</code>' +
    '<button data-copy="snap">复制</button>';
  box.dataset.url = url;
  box.style.display = 'flex';
}

// ── 时间格式化（详情页 / 项目历史共用）──
// 管理面板（fmtDur/fmtBytes/fmtMs/renderAdmin 等）已拆到独立页 /admin
function fmtTime(ms) {
  const n = Number(ms);
  if (!Number.isFinite(n) || n <= 0) return '—';
  try { return new Date(n).toLocaleString(); } catch (e) { return '—'; }
}

// ── 返回值放大查看：JSON 树 + 收起 ──
// 「层级」= 树深度（根为第 1 层）。两种收起方式：
//   ① 点某个节点的 ▾/▸ → 只收这一枝
//   ② ⌥(Alt) + 点 ▾/▸ → 收起该节点所在的整个层级
// 顶部两个按钮：`复制`（永远复制完整展开的 JSON）+ 一个总开关（还有收起的就「展开全部」，否则「收起全部」）。
// 渲染出来的是**标准 JSON**：键带引号、非末项带逗号、容器闭合括号各占一行、缩进是真实空格，
// 所以「全展开后选中一段复制」拿到的是干净 JSON（caret 用 CSS 伪元素画，不进选区）。
const RESP_TREE_MAX_NODES = 20000;

// respTree = { raw, nodes, collapsed:Set, rawMode, rawReason, copyAll }
//   collapsed 用 nodes 下标（先序序号）做键，不用 path —— path 由 key 拼成，key 里带 / 会重名
//   copyAll   = 「复制」按钮的 payload：完整展开的 JSON（与收起状态无关），不是 JSON 时为原文
let respTree = null;

function scalarKind(v) {
  if (v === null) return 'null';
  if (Array.isArray(v)) return 'array';
  const t = typeof v;
  return t === 'object' ? 'object' : t;
}

/** 弹框专用：严格识别所有 JSON 值（包括 null / 字符串 / 数字），与 tryJson 的对象/数组语义分开 */
function parseJsonValue(text) {
  try { return { ok: true, value: JSON.parse(String(text)) }; }
  catch (e) { return { ok: false, value: null }; }
}

/** 把 JSON 展成扁平行（DFS 先序）；收起状态用 nodes 下标做键（path 只给人看，key 里带 / 会重名） */
function buildTreeNodes(root) {
  const nodes = [];
  (function walk(val, key, depth, path, last, keyed) {
    const arr = Array.isArray(val);
    const obj = val !== null && typeof val === 'object' && !arr;
    const expandable = arr || obj;
    const entries = expandable
      ? (arr ? val.map((x, i) => [String(i), x]) : Object.entries(val))
      : null;
    nodes.push({
      i: nodes.length, key, keyed, last, depth, path, expandable, value: val, kind: scalarKind(val),
      childCount: entries ? entries.length : 0,
    });
    // keyed：父级是对象才渲染 key（数组元素在 JSON 里没有下标，见 keyed 注释）
    if (entries) entries.forEach(([k, c], idx) => walk(c, k, depth + 1, path + '/' + k, idx === entries.length - 1, !arr));
  })(root, null, 0, '$', true, false);
  return nodes;
}

/** 能收起/展开的节点：有子元素的对象或数组（空的 {} / [] 没有可收的东西） */
function isCollapsible(n) {
  return !!(n && n.expandable && n.childCount > 0);
}

/** 字符串按 JSON 规则转义（反斜杠、双引号、控制字符），这样复制出来是合法 JSON */
function jsonEscape(s) {
  return String(s).replace(/[\\"\u0000-\u001f]/g, (c) =>
    c === '\\' ? '\\\\' : c === '"' ? '\\"' : c === '\n' ? '\\n' : c === '\r' ? '\\r' : c === '\t' ? '\\t'
      : '\\u' + c.charCodeAt(0).toString(16).padStart(4, '0'));
}

/** 编辑态给值/键挂上 data-edit（点击进入编辑）；attrs 为 null 表示只读 */
function editAttrsFor(n, kind) {
  if (!respTree || !respTree.editable || respTree.rawMode) return null;
  const what = kind === 'k' ? '键名' : '值';
  return 'data-edit="' + kind + '" data-i="' + n.i + '" title="点击修改' + what + '（Enter 确认，Esc 取消）"';
}

function scalarHTML(v, attrs) {
  const a = attrs ? ' ' + attrs : '';
  if (v === null) return '<span class="tnull"' + a + '>null</span>';
  if (typeof v === 'string') return '<span class="ts"' + a + '>"' + esc(jsonEscape(v)) + '"</span>';
  if (typeof v === 'number') return '<span class="tn"' + a + '>' + esc(v) + '</span>';
  if (typeof v === 'boolean') return '<span class="tbool"' + a + '>' + (v ? 'true' : 'false') + '</span>';
  return '<span class="tnull"' + a + '>' + esc(String(v)) + '</span>';
}

/** 当前可见的节点（祖先被收起则整枝跳过；DFS 先序，遇到收起就把 hiddenBelow 压到该层） */
function visibleNodes() {
  const st = respTree;
  if (!st) return [];
  const out = [];
  let hiddenBelow = Infinity;
  for (const n of st.nodes) {
    if (n.depth > hiddenBelow) continue;
    hiddenBelow = Infinity;   // 已走出上一处被收起的子树
    out.push(n);
    if (isCollapsible(n) && st.collapsed.has(n.i)) hiddenBelow = n.depth;
  }
  return out;
}

/**
 * 当前可见的「渲染行」= 内容行 + 容器闭合行（`}` / `]` 各占一行）。
 * 渲染和缩略图都走这一份，否则缩略图按节点数算比例、实际行数更多，亮框会越往下越偏。
 */
function visibleRows() {
  const st = respTree;
  if (!st) return [];
  const rows = [];
  const open = [];   // 还没闭合的容器：{ depth, kind, last }
  for (const n of visibleNodes()) {
    while (open.length && open[open.length - 1].depth >= n.depth) {
      const c = open.pop();
      rows.push({ depth: c.depth, close: c });
    }
    rows.push({ depth: n.depth, node: n });
    if (isCollapsible(n) && !st.collapsed.has(n.i)) {
      open.push({ depth: n.depth, kind: n.kind, last: n.last });
    }
  }
  while (open.length) {
    const c = open.pop();
    rows.push({ depth: c.depth, close: c });
  }
  return rows;
}

/** 缩进用真空格（配合 .trow 的 white-space:pre），选中复制出来就是标准 JSON 的缩进 */
function jsonRowHTML(depth, caret, body) {
  return '<div class="trow" data-depth="' + depth + '">' +
    '<span class="tind">' + '  '.repeat(depth) + '</span>' + caret + body +
  '</div>';
}

function caretHTMLFor(n, collapsed) {
  if (!isCollapsible(n)) return '<span class="tcaret leaf"></span>';
  // ▾/▸ 用 CSS ::before 生成（伪元素不进选区/剪贴板），span 里不放任何字符
  return '<span class="tcaret' + (collapsed ? ' closed' : '') + '" data-i="' + n.i + '" data-depth="' + n.depth + '"' +
    ' data-path="' + esc(n.path) + '" title="点击收起/展开这一枝；⌥(Alt)+点击 收起同层级"></span>';
}

/** 键要带引号；数组元素不渲染下标（JSON 里数组本来就没有 key）；编辑态键可点击改名 */
function keyHTML(n) {
  if (!n.keyed) return '';
  const attrs = editAttrsFor(n, 'k');
  return '<span class="tk"' + (attrs ? ' ' + attrs : '') + '>"' + esc(jsonEscape(n.key)) + '"</span><span class="tp">: </span>';
}

function commaHTML(n) { return n.last ? '' : '<span class="tp">,</span>'; }

function treeRowsHTML() {
  const st = respTree;
  if (!st) return '';
  let html = '';
  for (const r of visibleRows()) {
    if (r.close) {
      html += jsonRowHTML(r.depth, '<span class="tcaret leaf"></span>',
        '<span class="tb">' + (r.close.kind === 'array' ? ']' : '}') + '</span>' + commaHTML(r.close));
      continue;
    }
    const n = r.node;
    const collapsed = isCollapsible(n) && st.collapsed.has(n.i);
    let val;
    if (n.expandable && n.childCount === 0) {
      val = '<span class="tb">' + (n.kind === 'array' ? '[]' : '{}') + '</span>' + commaHTML(n);
    } else if (n.expandable) {
      val = '<span class="tb">' + (n.kind === 'array' ? '[' : '{') + '</span>' +
        (collapsed
          ? '<span class="tmore"> … ' + n.childCount + ' 项 </span>' +
            '<span class="tb">' + (n.kind === 'array' ? ']' : '}') + '</span>' + commaHTML(n)
          : '');
    } else {
      val = scalarHTML(n.value, editAttrsFor(n, 'v')) + commaHTML(n);
    }
    html += jsonRowHTML(n.depth, caretHTMLFor(n, collapsed), keyHTML(n) + val);
  }
  return html;
}

// ── 缩略图（minimap）：整棵树压成一条竖条，亮框标出当前可见范围 ──
const RESP_MM_MIN_RATIO = 1.5;   // 内容不到视口的 1.5 倍就不显示（没必要）

function mmMetrics() {
  const tree = $('resp-modal-body');
  const mm = $('resp-minimap');
  return {
    tree, mm,
    viewH: tree.clientHeight || 0,
    contentH: tree.scrollHeight || 0,
    mmW: mm.clientWidth || 0,
    mmH: mm.clientHeight || 0,
  };
}

/** 重画缩略图本体：每一像素行取该行覆盖到的「最深深度」，越深横条越长 */
function drawMinimap() {
  const st = respTree;
  const m = mmMetrics();
  const longEnough = m.viewH > 0 && m.contentH > m.viewH * RESP_MM_MIN_RATIO;
  if (!st || st.rawMode || !longEnough) { m.mm.classList.add('hidden'); return; }
  m.mm.classList.remove('hidden');

  const cv = $('resp-mm-canvas');
  const ctx = cv.getContext ? cv.getContext('2d') : null;
  if (!ctx) return;
  const w = m.mm.clientWidth || 0, h = m.mm.clientHeight || 0;
  if (!w || !h) return;

  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  cv.style.width = w + 'px';
  cv.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  // 用「渲染行」而不是「节点数」：闭合括号各占一行，用节点数算会让亮框越往下越偏
  const rows = visibleRows();
  const total = rows.length;
  if (!total) return;
  let maxDepth = 0;
  for (const r of rows) if (r.depth > maxDepth) maxDepth = r.depth;

  const buckets = new Array(h).fill(-1);
  for (let r = 0; r < total; r++) {
    const y = Math.min(h - 1, Math.floor(((r + 0.5) / total) * h));
    if (rows[r].depth > buckets[y]) buckets[y] = rows[r].depth;
  }

  const pad = 2, inner = Math.max(1, w - pad * 2);
  ctx.fillStyle = 'rgba(15, 110, 86, .55)';
  for (let y = 0; y < h; y++) {
    const d = buckets[y];
    if (d < 0) continue;
    ctx.fillRect(pad, y, maxDepth ? Math.max(2, inner * ((d + 1) / (maxDepth + 1))) : inner, 1);
  }
  updateMinimapView();
}

/** 只挪「当前可见范围」那个亮框（滚动时每帧调，成本要低） */
function updateMinimapView() {
  const m = mmMetrics();
  if (m.mm.classList.contains('hidden') || !m.mmH || !m.contentH) return;
  const v = $('resp-mm-view');
  const vh = Math.min(m.mmH, Math.max(10, (m.viewH / m.contentH) * m.mmH));
  const top = Math.min(m.mmH - vh, Math.max(0, (m.tree.scrollTop / m.contentH) * m.mmH));
  v.style.top = top + 'px';
  v.style.height = vh + 'px';
}

/** 点/拖缩略图 → 跳到对应位置（把目标点放在视口正中） */
function mmJump(clientY) {
  const m = mmMetrics();
  if (m.mm.classList.contains('hidden') || !m.mmH || !m.contentH) return;
  if (typeof m.mm.getBoundingClientRect !== 'function') return;
  const rect = m.mm.getBoundingClientRect();
  if (!rect || !rect.height) return;
  const ratio = Math.min(1, Math.max(0, (clientY - rect.top) / rect.height));
  m.tree.scrollTop = Math.max(0, ratio * m.contentH - m.viewH / 2);
  updateMinimapView();
}

/** 由一段原文构建弹框状态（浏览「放大查看」与 Mock「放大编辑」共用） */
function buildRespState(raw, editable, whyRaw) {
  const text = typeof raw === 'string' ? raw : '';
  const parsed = parseJsonValue(text);
  const nodes = parsed.ok ? buildTreeNodes(parsed.value) : [];
  const tooBig = nodes.length > RESP_TREE_MAX_NODES;
  let rawReason = '';
  if (!parsed.ok) {
    rawReason = whyRaw || (editable ? '不是合法 JSON，按原文编辑' : '不是合法 JSON，按原文展示');
  } else if (tooBig) {
    rawReason = '节点太多（> ' + RESP_TREE_MAX_NODES + '），按原文' + (editable ? '编辑' : '展示');
  }
  return {
    raw: text, nodes: tooBig ? [] : nodes, collapsed: new Set(),
    rawMode: !parsed.ok || tooBig, rawReason, editable: !!editable, tab: 'view',
    root: parsed.ok ? parsed.value : null,
    parsed: parsed.ok,
    // 编辑态有两种视图：层级（树，可直接改值/键）与文本（textarea）；默认层级，非 JSON 退回文本
    view: editable && (!parsed.ok || tooBig) ? 'text' : 'tree',
    // 复制按钮给的是「完整、展开、格式化」的 JSON，跟当前收起状态无关；不是 JSON 就复制原文
    copyAll: parsed.ok ? JSON.stringify(parsed.value, null, 2) : text,
  };
}

/** 弹框当前该显示哪份原文：编辑模式读草稿里**选中那条**返回值（实时），浏览模式读打开时冻结的那份 */
function respRawText() {
  if (!respTree) return '';
  if (respTree.editable) return state.mockDraft ? curBody(state.mockDraft) : '';
  return respTree.raw;
}

/** 弹框标题：编辑态多条返回值时必须标明「在改第几条」（不然容易改错条目） */
function respModalTitle() {
  const d = state.mockDraft;
  if (!d) return '编辑返回值';
  const n = respList(d).length;
  return n > 1 ? '编辑返回值 · 第 ' + (d.sel + 1) + ' 条 / 共 ' + n + ' 条' : '编辑返回值';
}

function renderRespModal() {
  const st = respTree;
  if (!st) return;
  const treeWrap = $('resp-tree-wrap');
  const ed = $('resp-modal-editor');
  const btn = $('rt-toggle');
  const vtree = $('rt-vtree'), vtext = $('rt-vtext');

  if (st.editable) {
    const isTree = st.view === 'tree' && !st.rawMode;
    // 视图切换只有编辑态有；非 JSON（rawMode）没有树，只留「文本」
    vtree.style.display = st.rawMode ? 'none' : '';
    vtext.style.display = '';
    vtree.classList.toggle('on', isTree);
    vtext.classList.toggle('on', !isTree);
    $('rt-format').style.display = isTree ? 'none' : '';
    $('rt-copy').style.display = '';
    btn.style.display = isTree ? '' : 'none';
    $('resp-modal-title').textContent = respModalTitle();
    if (isTree) {
      treeWrap.classList.remove('hidden');
      ed.classList.add('hidden');
      $('resp-modal-body').innerHTML = treeRowsHTML();
      $('resp-modal-hint').innerHTML =
        '点 ▾/▸ 收起/展开；点<b>值</b>或<b>键</b>可直接修改（数组下标不可改），改完自动转回 JSON 文本。' +
        '⌘/Ctrl+S 保存并生效，成功后关闭。';
    } else {
      treeWrap.classList.add('hidden');
      ed.classList.remove('hidden');
      const text = respRawText();
      // 只在内容真的变了才写回 value —— 否则每敲一个字都重设 value，光标会跳到末尾
      if (ed.value !== text) ed.value = text;
      ed.focus();
      $('resp-modal-hint').textContent = st.rawMode
        ? (st.rawReason || '')
        : '直接编辑返回值；⌘/Ctrl+S 保存并生效，成功后关闭此窗口。';
    }
    drawMinimap();
    return;
  }

  vtree.style.display = 'none';
  vtext.style.display = 'none';
  $('rt-format').style.display = 'none';
  $('rt-copy').style.display = '';
  ed.classList.add('hidden');
  treeWrap.classList.remove('hidden');
  if (st.rawMode) {
    btn.style.display = 'none';
    $('resp-modal-hint').textContent = st.rawReason;
    $('resp-modal-body').innerHTML = '<pre class="body traw">' + esc(st.raw.slice(0, 200000)) + '</pre>';
  } else {
    btn.style.display = '';
    btn.textContent = st.collapsed.size ? '展开全部' : '收起全部';
    $('resp-modal-hint').innerHTML =
      '点 ▾/▸ 收起/展开单个；<b>⌥(Alt) + 点 ▾/▸</b> 收起该层级（再点展开）';
    $('resp-modal-body').innerHTML = treeRowsHTML();
  }
  // rawMode 时由它负责把缩略图藏掉（否则会留着上一条的旧刻度）
  drawMinimap();
}

/** 打开弹框。opts.edit = true 进入编辑模式，来源是 Mock 编辑器草稿的 body */
function openRespModal(opts) {
  opts = opts || {};
  if (opts.edit) {
    const d = state.mockDraft;
    if (!d) return;
    respTree = buildRespState(curBody(d), true);
  } else {
    const r = state.records.find((x) => x.id === state.selected);
    if (!r) return;
    const whyRaw = r.response.bodyEncoding === 'base64' ? '二进制（base64）内容，按原文展示'
      : r.response.bodyTruncated ? '返回值被截断 / 采样，不是完整 JSON，按原文展示' : '';
    // 详情区切到「密文」时，放大查看也要看密文，否则用户会以为切换没生效
    const bodyText = respShowRaw && typeof r.response.rawBody === 'string' ? r.response.rawBody : (r.response.body || '');
    respTree = buildRespState(bodyText, false, whyRaw);
    $('resp-modal-title').textContent = r.request.method + ' ' + ifaceLabel(r) + (respShowRaw ? ' · 密文原文' : ' · 返回值');
  }
  $('resp-modal').classList.remove('hidden');
  renderRespModal();
}

function closeRespModal() {
  const wasEdit = !!(respTree && respTree.editable);
  $('resp-modal').classList.add('hidden');
  respTree = null;
  // 编辑态改的是草稿 body —— 关掉后把 Mock 编辑器里那块文本框同步成最新内容
  if (wasEdit) renderMockEditor();
}

/** 编辑态：把当前原文格式化成 2 空格缩进的 JSON（不是 JSON 就提示，不动原文） */
function formatRespEdit() {
  const st = respTree;
  if (!st || !st.editable || !state.mockDraft) return;
  const result = parseJsonValue(curBody(state.mockDraft));
  if (!result.ok) { toast('不是合法 JSON，未格式化'); return; }
  setCurBody(state.mockDraft, JSON.stringify(result.value, null, 2));
  // 树已经是有效 JSON 时，格式化只是重新缩进 —— 同步 root/nodes，切回层级视图才不会看到旧内容
  if (st.parsed) {
    st.root = result.value;
    st.nodes = buildTreeNodes(st.root);
    st.raw = curBody(state.mockDraft);
    st.copyAll = curBody(state.mockDraft);
  }
  const ed = $('resp-modal-editor');
  if (ed) ed.value = curBody(state.mockDraft);
  toast('已格式化');
}

/** 收起/展开单个节点（按 nodes 下标） */
function toggleTreeNode(i) {
  const st = respTree;
  if (!st) return;
  if (st.collapsed.has(i)) st.collapsed.delete(i); else st.collapsed.add(i);
  renderRespModal();
}

/** 收起/展开某一层级：该层还有展开的就全收，已全收就全展开 */
function toggleTreeLevel(depth) {
  const st = respTree;
  if (!st) return;
  const at = st.nodes.filter((n) => isCollapsible(n) && n.depth === depth);
  if (!at.length) return;
  const allCollapsed = at.every((n) => st.collapsed.has(n.i));
  at.forEach((n) => { if (allCollapsed) st.collapsed.delete(n.i); else st.collapsed.add(n.i); });
  renderRespModal();
}

/** 总开关：还有收起着的就全展开，否则全收起 */
function toggleAllTree() {
  const st = respTree;
  if (!st || st.rawMode) return;
  if (st.collapsed.size) st.collapsed.clear();
  else st.nodes.forEach((n) => { if (isCollapsible(n)) st.collapsed.add(n.i); });
  renderRespModal();
}

// ── 层级编辑：树里直接改值/键，改完同步回 JSON 文本 ──
// 与 buildTreeNodes 完全同序的先序遍历，按 nodes 下标定位节点在 root 里的位置
function locateNode(root, target) {
  let idx = 0, found = null;
  (function walk(val, key, keyed, parent) {
    if (found) return;
    if (idx === target) { found = { value: val, key, keyed, parent }; return; }
    idx++;
    if (val !== null && typeof val === 'object') {
      if (Array.isArray(val)) val.forEach((c) => walk(c, null, false, val));
      else Object.entries(val).forEach(([k, c]) => walk(c, k, true, val));
    }
  })(root, null, false, null);
  return found;
}

/** 输入框里的文本 → JSON 标量：true/false/null/数字按类型收，其余一律按字符串 */
function jsonScalarFromText(raw) {
  const s = String(raw);
  if (s === 'true') return true;
  if (s === 'false') return false;
  if (s === 'null') return null;
  const t = s.trim();
  if (t !== '' && /^-?\d+(\.\d+)?([eE][+-]?\d+)?$/.test(t) && Number.isFinite(Number(t))) return Number(t);
  return s;
}

/** 把第 i 个节点的值改成 raw 解析出的标量；返回是否成功 */
function applyTreeValueEdit(i, raw) {
  const st = respTree;
  if (!st || !st.parsed) return false;
  const loc = locateNode(st.root, i);
  if (!loc) return false;
  const v = jsonScalarFromText(raw);
  if (loc.parent === null) { st.root = v; return true; }   // 根本身就是标量
  if (Array.isArray(loc.parent)) loc.parent[Number(loc.key)] = v;
  else loc.parent[loc.key] = v;
  return true;
}

/** 把第 i 个节点的键改成 nk；重建父对象以保持键顺序，重名/空名拒绝 */
function applyTreeKeyRename(i, nk) {
  const st = respTree;
  if (!st || !st.parsed) return false;
  const loc = locateNode(st.root, i);
  if (!loc || !loc.keyed || loc.parent === null || Array.isArray(loc.parent)) return false;
  const name = String(nk).trim();
  if (!name) return false;
  if (name === loc.key) return true;
  if (Object.prototype.hasOwnProperty.call(loc.parent, name)) return false;
  if (!Object.prototype.hasOwnProperty.call(loc.parent, loc.key)) return false;
  const rebuilt = {};
  for (const [k, v] of Object.entries(loc.parent)) rebuilt[k === loc.key ? name : k] = v;
  Object.keys(loc.parent).forEach((k) => { delete loc.parent[k]; });
  Object.assign(loc.parent, rebuilt);
  return true;
}

/** 树改完 → 重新序列化成 2 空格 JSON，同步到草稿 body / raw / copyAll，并按新值重建节点 */
function syncTreeToDraft() {
  const st = respTree;
  if (!st || !st.editable || !st.parsed || !state.mockDraft) return;
  st.nodes = buildTreeNodes(st.root);   // 结构没变（只改了标量/键名），先序序号不变，收起状态仍然有效
  const text = JSON.stringify(st.root, null, 2);
  st.raw = text;
  st.copyAll = text;
  setCurBody(state.mockDraft, text);
}

/** 点击值/键：原地换成输入框（Enter/失焦提交，Esc 取消） */
function beginTreeEdit(span, kind, i) {
  const st = respTree;
  if (!st || !st.editable || st.rawMode) return;
  const n = st.nodes[i];
  if (!n) return;
  if (kind === 'k' && !n.keyed) return;
  const input = document.createElement('input');
  input.className = 'jted';
  input.value = kind === 'k' ? String(n.key) : (n.value === null ? 'null' : String(n.value));
  input.dataset.editKind = kind;
  input.dataset.i = String(i);
  span.replaceWith(input);
  input.focus();
  if (typeof input.select === 'function') input.select();
  input.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter') { ev.preventDefault(); commitTreeEdit(input); }
    else if (ev.key === 'Escape') { ev.stopPropagation(); renderRespModal(); }
  });
  input.addEventListener('blur', () => commitTreeEdit(input));
}

function commitTreeEdit(input) {
  const st = respTree;
  if (!st || !st.editable) return;
  if (input.dataset.done) return;   // Enter 提交后移除节点可能再触发一次 blur，别重复应用
  input.dataset.done = '1';
  const kind = input.dataset.editKind;
  const i = Number(input.dataset.i);
  if (!st.nodes[i]) { renderRespModal(); return; }
  let ok = true;
  if (kind === 'k') ok = applyTreeKeyRename(i, input.value);
  else ok = applyTreeValueEdit(i, input.value);
  if (!ok) { toast(kind === 'k' ? '键名为空或与兄弟键重复，未修改' : '修改未生效'); }
  syncTreeToDraft();
  renderRespModal();
}

/** 编辑态切换 层级/文本 视图 */
function switchRespView(v) {
  const st = respTree;
  if (!st || !st.editable) return;
  st.view = v === 'text' ? 'text' : 'tree';
  renderRespModal();
}

// 双击手柄恢复默认宽度。
const SIDEBAR_MIN = 320, SIDEBAR_MAX = 900;

function sidebarKey(name) { return 'ec_sidebar_w_' + name; }

function setSidebarWidth(aside, w) {
  const clamped = Math.max(SIDEBAR_MIN, Math.min(SIDEBAR_MAX, Math.round(w)));
  aside.style.width = clamped + 'px';
  aside.style.minWidth = clamped + 'px';
  return clamped;
}

function applySidebarWidths() {
  document.querySelectorAll('.sidebar[data-sidebar]').forEach((aside) => {
    let saved = NaN;
    try { saved = parseInt(localStorage.getItem(sidebarKey(aside.dataset.sidebar)) || '', 10); } catch (e) {}
    if (Number.isFinite(saved)) setSidebarWidth(aside, saved);
  });
}

function initSidebarResizers() {
  document.querySelectorAll('.sidebar-resizer').forEach((handle) => {
    const aside = handle.parentElement;
    if (!aside) return;
    handle.onmousedown = (e) => {
      e.preventDefault();
      const startX = e.clientX;
      const startW = aside.getBoundingClientRect().width;
      handle.classList.add('dragging');
      document.body.classList.add('col-resizing');
      const onMove = (ev) => setSidebarWidth(aside, startW + (ev.clientX - startX));
      const onUp = () => {
        handle.classList.remove('dragging');
        document.body.classList.remove('col-resizing');
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        try { localStorage.setItem(sidebarKey(aside.dataset.sidebar), String(parseInt(aside.style.width, 10))); } catch (e2) {}
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    };
    handle.ondblclick = () => {
      aside.style.width = '';
      aside.style.minWidth = '';
      try { localStorage.removeItem(sidebarKey(aside.dataset.sidebar)); } catch (e3) {}
    };
  });
}

applySidebarWidths();
initSidebarResizers();

// ── CLI 浏览器登录接力（ADR-029）──────────────────────────────
// CLI 在本机 127.0.0.1 起一次性监听，把带 nonce 的本页地址开进浏览器；
// 人在这里登录（或复用已有会话），点「允许」后页面把会话 POST 回那个回环端口。
// 两条刻意的约束：
//   ① 服务端**一个端点都不加**（AGENTS.md §3）：管理面登录还是只有手机号 + 口令，
//      不存在「拿 nonce 换会话」的口子；会话只在「本页 → 本机回环」之间流动，
//      不进 URL（地址里只有 nonce，而且走 #hash，连服务端访问记录都不进）。
//   ② 必须有人点一次「允许」：少了这一步，任何一个本地进程诱导你打开
//      `<本页地址>#cli-login?port=<它的端口>` 就能静默拿走你的会话 token。
//
// 纯逻辑区段（被 tools/console-mock-check.mjs 切出来单测，不碰 DOM）
function parseCliLogin(rawHash) {
  const h = String(rawHash == null ? '' : rawHash).replace(/^#/, '');
  if (h.indexOf('cli-login?') !== 0) return null;
  const q = new URLSearchParams(h.slice('cli-login?'.length));
  const keys = [];
  q.forEach((_v, k) => keys.push(k));
  // 多余参数一律不认：这条 URL 的语义是「同意把会话交出去」，不接受没定义过的旋钮
  if (keys.length !== 2 || !q.has('port') || !q.has('state')) return null;
  const port = Number(q.get('port'));
  const state = String(q.get('state') || '');
  if (!Number.isInteger(port) || port < 1024 || port > 65535) return null;
  if (!/^[0-9a-f]{16,64}$/i.test(state)) return null;
  return { port: port, state: state };
}

function cliCallbackEndpoint(req) {
  // 主机名写死 127.0.0.1：只可能是本机的 CLI，永远不可能是「另一个地址上的服务」
  return 'http://127.0.0.1:' + req.port + '/ec-cli-callback';
}

/** 没有会话就没什么可交接的：返回 null，由调用方保持登录态不变 */
function cliLoginPayload(req, session, user) {
  if (!req || typeof session !== 'string' || !session) return null;
  const u = user && typeof user === 'object' ? user : {};
  return {
    state: req.state,
    session: session,
    phone: typeof u.phone === 'string' ? u.phone : null,
    role: typeof u.role === 'string' ? u.role : null,
  };
}

/** 确认框里那几行「你到底在同意什么」：纯文本，交给 DOM 层渲染 */
function cliConsentRows(req, user, origin) {
  return [
    ['本机 CLI 要连的服务', origin],
    ['将交出去的会话属于', (user && user.phone) ? user.phone : '（未知，登录后才知道）'],
    ['角色', (user && user.role) ? user.role : 'user'],
    ['回传地址', cliCallbackEndpoint(req)],
  ];
}

/**
 * 「拒绝」也要回一条，否则 CLI 会干等到超时才知道自己被拒了。
 * 只有 state 与 denied 两个字段——**绝不带 session**，这点由 console-mock-check 守着。
 */
function cliDenyPayload(req) {
  if (!req) return null;
  return { state: req.state, denied: true };
}
// ── CLI 登录接力：纯逻辑结束 ──

// nonce 只活在内存里；处理完立刻从地址栏抹掉（它是一次性的，留在地址栏/历史里没有意义）
let cliLoginReq = parseCliLogin(location.hash);

function clearCliLoginHash() {
  try {
    if (location.hash && location.hash.indexOf('#cli-login') === 0) {
      history.replaceState(null, '', location.pathname + location.search);
    }
  } catch (e) { /* 沙箱里的 history 不可用就算了，不影响功能 */ }
}

function cliConsentDom() {
  let box = document.getElementById('cli-consent');
  if (box) return box;
  box = document.createElement('div');
  box.className = 'cli-consent hidden';
  box.id = 'cli-consent';
  box.innerHTML =
    '<div class="cli-consent-box">' +
    '<h2>本地 CLI 请求使用你的会话</h2>' +
    '<p class="sub">同意后 CLI 就能读写这个服务上的 Mock 规则。<b>只有你认识这个操作时才点允许。</b></p>' +
    '<dl id="cli-consent-rows"></dl>' +
    '<div class="cli-consent-tools">' +
    '<button id="cli-consent-deny">拒绝</button>' +
    '<button class="primary" id="cli-consent-allow">允许</button>' +
    '</div>' +
    '<div class="cli-consent-msg" id="cli-consent-msg"></div>' +
    '</div>';
  document.body.appendChild(box);
  $('cli-consent-allow').addEventListener('click', () => submitCliLogin(true));
  $('cli-consent-deny').addEventListener('click', () => submitCliLogin(false));
  return box;
}

function showCliConsent() {
  if (!cliLoginReq) return;
  cliConsentDom();
  const rows = cliConsentRows(cliLoginReq, state.user, location.origin);
  $('cli-consent-rows').innerHTML = rows.map((r) =>
    '<dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd>').join('');
  $('cli-consent-msg').textContent = '';
  $('cli-consent-allow').disabled = false;
  cliConsentDom().classList.remove('hidden');
}

async function submitCliLogin(allowed) {
  const req = cliLoginReq;
  if (!req) return;
  const msg = $('cli-consent-msg');
  if (!allowed) {
    const body = JSON.stringify(cliDenyPayload(req));
    cliLoginReq = null;
    msg.textContent = '已拒绝，CLI 那边收到了。需要时重新跑一次 mock login --browser。';
    // 决定已经做了，两个按钮都不该再点：留着会让人以为还能「改主意点允许」，
    // 而 cliLoginReq 已经清空，再点是一次没有任何效果的空操作
    $('cli-consent-allow').disabled = true;
    $('cli-consent-deny').disabled = true;
    clearCliLoginHash();
    // 通知是「尽力而为」：CLI 可能已经超时退出，那时这条 POST 连不上也不该在页面上留个错误
    fetch(cliCallbackEndpoint(req), {
      method: 'POST',
      headers: { 'content-type': 'text/plain;charset=UTF-8' },
      body: body,
    }).catch(function () {});
    return;
  }
  const payload = cliLoginPayload(req, state.session, state.user);
  if (!payload) { msg.textContent = '当前没有可用会话，先在上面登录。'; return; }
  $('cli-consent-allow').disabled = true;
  msg.textContent = '正在回传…';
  try {
    // content-type 用 text/plain：这是 CORS「简单请求」里的类型，不会先走预检
    const res = await fetch(cliCallbackEndpoint(req), {
      method: 'POST',
      headers: { 'content-type': 'text/plain;charset=UTF-8' },
      body: JSON.stringify(payload),
    });
    const j = await res.json().catch(() => ({}));
    if (res.ok && j && j.ok) {
      cliLoginReq = null;
      // 会话已经交出去了，确认框就不要再挡着控制台；结果用 toast 说一句
      $('cli-consent').classList.add('hidden');
      toast('已把会话交给本机 CLI');
    } else {
      msg.textContent = (j && j.message) ? j.message : ('CLI 拒绝了这次回传（HTTP ' + res.status + '）');
      $('cli-consent-allow').disabled = false;
    }
  } catch (e) {
    // 连不上回环端口最常见的原因：CLI 已经超时退出，或浏览器不在这台机器上
    msg.textContent = '连不上本机 CLI（' + (e && e.message ? e.message : e) + '）——' +
      '多半是 CLI 已经超时退出，或这个浏览器不在跑 CLI 的那台机器上。' +
      '后者请改用 printf 口令 | mock login --password-stdin。';
    $('cli-consent-allow').disabled = false;
  }
  clearCliLoginHash();
}

function maybeOfferCliLogin() {
  if (cliLoginReq && state.session && state.user) showCliConsent();
}

// ── 启动 ──
bindConfirmModal();
state.session = localStorage.getItem('ec_session');
boot();
</script>
</body>
</html>
