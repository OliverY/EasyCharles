    toast('操作失败：' + (e && e.message ? e.message : '请检查连接后重试'));
  } finally {
    state.busy = false;
    renderMockEditor(); renderTpl();
  }
}

function newRuleId() { return 'r_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

// ── 项目归属（C14 / ADR-033）的纯逻辑 ──
// 全部写成「输入数组 → 输出」的形式：控制台没有测试框架，这几条靠
// tools/console-mock-check.mjs 直接切片断言（归属判错 = 静默失效，必须有机械闸）。

/** 会话看得见的项目（服务端已按归属过滤过；这里只按档位分栏） */
function privateProjects(projects) {
  return (Array.isArray(projects) ? projects : []).filter((p) => p && p.scope === 'private');
}
function sharedProjects(projects) {
  return (Array.isArray(projects) ? projects : []).filter((p) => p && p.scope === 'shared');
}
function projectById(projects, id) {
  if (!id) return null;
  const list = Array.isArray(projects) ? projects : [];
  return list.find((p) => p && p.id === id) || null;
}
/**
 * 唯一可写的档位：**自己的私有项目**。
 * shared 走 copy → 编辑 → share；他人私有项目服务端不下发，所以这里拿到的一律是 null。
 * 缺 scope 的脏值按 shared 处理（与读路径同一口径：宁可不让它进私有作用域）。
 */
function isWritableProject(p) { return !!p && p.scope === 'private'; }

/** 某个视图下的规则：ALL_PROJECTS = 全部私有规则，否则只取该项目那几条 */
function rulesOfProject(allRules, projectId) {
  const list = Array.isArray(allRules) ? allRules : [];
  if (!projectId || projectId === ALL_PROJECTS) return list;
  return list.filter((r) => r && typeof r === 'object' && r.groupId === projectId);
}

/** 规则行 / 编辑器上的「归属项目」文案（协议 §5.4：翻转不产生静默失效的前提之一） */
function projectNameOf(projects, id) {
  const p = projectById(projects, id);
  if (p) return p.name + (p.scope === 'shared' ? '（共享 · 不命中）' : '');
  return id ? '项目 ' + id + '（不可见或已删除）' : '未归属（不命中）';
}

/** 一次写操作一个 operationId；失败重发必须复用同一个（服务端靠它幂等，协议 §5.5） */
function newOperationId(kind) {
  return 'c_' + String(kind || 'op') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
function reuseOperationId(cache, key, kind) {
  if (!cache || typeof cache !== 'object' || !key) return newOperationId(kind);
  const hit = cache[key];
  if (typeof hit === 'string' && hit) return hit;
  const fresh = newOperationId(kind);
  cache[key] = fresh;
  return fresh;
}

/**
 * 分享前的增删预览：用**服务端的口径**算（私有条目 ↔ lineage ↔ 原共享 id），
 * 不是靠界面上的名字猜。三个数就是确认框里的「新增 / 删除 / 保留」。
 */
function shareDiff(privateRules, lineage, oldSharedRules) {
  const priv = Array.isArray(privateRules) ? privateRules : [];
  const map = Array.isArray(lineage) ? lineage.filter((e) => e && typeof e === 'object') : [];
  const byPrivateId = {};
  for (const e of map) {
    if (typeof e.privateRuleId === 'string') byPrivateId[e.privateRuleId] = e.sharedRuleId;
  }
  const oldIds = (Array.isArray(oldSharedRules) ? oldSharedRules : [])
    .map((r) => (r && typeof r === 'object' ? String(r.id) : String(r)))
    .filter((x) => x && x !== 'undefined');
  const keptIds = [];
  let added = 0;
  for (const r of priv) {
    const sid = r && byPrivateId[String(r.id)];
    if (typeof sid === 'string' && sid && oldIds.indexOf(String(sid)) >= 0) keptIds.push(String(sid));
    else added++;
  }
  const removed = oldIds.filter((id) => keptIds.indexOf(id) < 0).length;
  return { added: added, removed: removed, kept: keptIds.length, willTotal: priv.length, hadTotal: oldIds.length };
}

/** 圈码标号（0 基）：列表里一眼看出「第几条」，超过 20 条退化成 #n */
function circleNum(i) {
  const m = '①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳';
  return i >= 0 && i < m.length ? m[i] : '#' + (i + 1);
}

/** 顺序模式（除「随机」外）的 pick 取值 —— 与协议 action.seqMode 一一对应 */
const SEQ_PICKS = ['in-order', 'loop', 'once-then-passthrough'];

/**
 * 用户**新选**「按顺序」时的默认子模式。
 * 用 loop 而不是协议缺省值 in-order：多条返回值最常见的用法就是「循环返回」，
 * 「走完停在最后一条」反而几乎总要人再点一次下拉。
 *
 * ⚠️ 它只在**用户手动切换命中方式**的那一刻生效。`ruleToDraft()` 读存量规则时，
 * `mode: 'sequence'` 却缺 `seqMode` 必须**仍按服务端的 in-order 显示**——否则会出现
 * 「界面显示循环、服务端实际停在最后一条」的静默不一致（协议 §5.4 / architecture §5.2）。
 */
const DEFAULT_SEQ_PICK = 'loop';

/**
 * 切到「按顺序」时该用哪个子模式：已经是顺序子模式就保留，否则用默认（循环返回）。
 * 纯函数，抽出来是为了让 tools/console-mock-check.mjs 能直接断言这条默认值
 * （DOM 事件监听器没法在纯逻辑用例里跑）。
 */
function nextSeqPick(cur) {
  return SEQ_PICKS.includes(cur) ? cur : DEFAULT_SEQ_PICK;
}

/** 一条返回值的草稿结构（status 可能是用户正在输入的字符串，保存时才 Number()） */
function emptyResponse(over) {
  return {
    status: 200,
    contentType: 'application/json',
    headers: {},
    name: '',
    // 默认给一段格式化好的 JSON 骨架，省得新建物还要手敲第一对大括号
    body: '{\n  "code": 0,\n  "msg": "ok"\n}',
    ...(over || {}),
  };
}

function emptyDraft() {
  return {
    id: newRuleId(), name: '', enabled: true, priority: 10,
    method: 'GET', host: '', path: '',
    // 归属项目（C14）：新建草稿必须先有个 private 项目才谈得上保存。
    // 没有它就没有 groupId，而**无 groupId 的规则在 C14 下永不命中**（协议 §5.4），
    // 服务端也会直接 400 —— 所以这里留 null，由 saveDraft() 在发请求前拦住。
    projectId: null,
    // 没有「匹配范围」开关：默认就是「域名 + 路径 + 入参」。
    // 不校验入参 = 所有参数都切到「忽略」，保存时自然不写 match.params（协议层本来就这么定义）
    params: [],
    // 多返回值（协议 §5.4）：responses 是唯一真值来源，pick 决定取哪一条
    responses: [emptyResponse()],
    pick: 'specific',      // specific | in-order | loop | once-then-passthrough | random
    pinIndex: 0,
    sel: 0,                // 编辑器里当前选中编辑的条目（控制台本地状态，不进规则）
    source: null,
  };
}

/** 草稿的返回值列表（永不为空：列表被删空时补回一条，避免编辑器无内容可编辑） */
function respList(d) {
  if (!d) return [];
  if (!Array.isArray(d.responses) || !d.responses.length) d.responses = [emptyResponse()];
  return d.responses;
}

/** 草稿里「当前选中」的条目；下标越界一律夹回来 */
function curResp(d) {
  const rs = respList(d);
  if (!rs.length) return null;
  const n = Number(d.sel);
  d.sel = Math.min(Math.max(Number.isFinite(n) ? Math.trunc(n) : 0, 0), rs.length - 1);
  return rs[d.sel];
}

/** 当前选中条目的正文（放大编辑弹框读写都走它，避免各处再摸 body 字段） */
function curBody(d) {
  const cur = curResp(d);
  return cur ? String(cur.body == null ? '' : cur.body) : '';
}
function setCurBody(d, text) {
  const cur = curResp(d);
  if (cur) cur.body = text;
}

/** 增删 / 换序后把 sel 与 pinIndex 夹回合法范围 */
function normalizePick(d) {
  const rs = respList(d);
  if (!rs.length) return;
  d.sel = Math.min(Math.max(Math.trunc(Number(d.sel) || 0), 0), rs.length - 1);
  const p = Number(d.pinIndex);
  d.pinIndex = Math.min(Math.max(Number.isFinite(p) ? Math.trunc(p) : 0, 0), rs.length - 1);
}

/**
 * 把第 from 条移到第 to 条（拖动排序与 ↑↓ 共用）。
 * `to` 是**移除之后**数组里的目标下标（与 Array.splice 的顺序一致）。
 * 选中项与「指定」跟着条目走，不跟着下标跑偏——否则拖完会静默编辑到另一条上。
 */
function reorderResp(d, from, to) {
  const rs = respList(d);
  if (from === to || from < 0 || to < 0 || from >= rs.length) return;
  if (to >= rs.length) to = rs.length - 1;
  if (from === to) return;
  const selIdx = d.sel;
  const pinIdx = Number(d.pinIndex);
  const [item] = rs.splice(from, 1);
  rs.splice(to, 0, item);
  const remap = (i) => {
    if (i === from) return to;
    if (from < to && i > from && i <= to) return i - 1;
    if (to < from && i >= to && i < from) return i + 1;
    return i;
  };
  d.sel = remap(Number.isFinite(Number(selIdx)) ? Math.trunc(Number(selIdx)) : 0);
  d.pinIndex = remap(Number.isFinite(pinIdx) ? Math.trunc(pinIdx) : 0);
  normalizePick(d);
}

/** 由一条记录的真实响应构建返回值条目（新建规则 / 重置为真实值 / 追加真实响应共用） */
function responseFromRecord(rec, name) {
  const resp = isPlainObject(rec.response) ? rec.response : {};
  const hdrs = isPlainObject(resp.headers) ? resp.headers : {};
  return emptyResponse({
    status: Number.isFinite(Number(resp.status)) ? Number(resp.status) : 200,
    contentType: hdrs['content-type'] || 'application/json',
    headers: { ...hdrs },
    name: name || '',
    body: normalizeDraftBody(typeof resp.body === 'string' ? resp.body : ''),
  });
}

/** 草稿的返回值默认存成 2 空格缩进的 JSON（合法就格式化；不合法保持原文不动） */
function normalizeDraftBody(body) {
  const text = typeof body === 'string' ? body : '';
  const parsed = parseJsonValue(text);
  return parsed.ok ? JSON.stringify(parsed.value, null, 2) : text;
}

// ── 「忽略」的入参：控制台本地知识，记在 localStorage，不进规则 / 协议（ADR-016 / ADR-021）──
// match.params 只存「参与匹配」的参数；被忽略的参数按 ruleId → [{k,v}] 记在本地，
// 这样保存并重开规则时它们仍会展示（只是「忽略」状态），而不是凭空消失。
function ignoredKey(id) { return 'ec_ignored_' + id; }
function loadIgnored(id) {
  try {
    const arr = JSON.parse(localStorage.getItem(ignoredKey(id)) || '[]');
    return Array.isArray(arr)
      ? arr.filter((x) => x && typeof x === 'object' && typeof x.k === 'string' && x.k)
      : [];
  } catch (e) { return []; }
}
function saveIgnored(id, list) {
  try {
    const norm = (Array.isArray(list) ? list : [])
      .map((x) => ({ k: String(x && x.k != null ? x.k : '').trim(), v: x && x.v != null ? String(x.v) : '' }))
      .filter((x) => x.k);
    if (norm.length) localStorage.setItem(ignoredKey(id), JSON.stringify(norm));
    else localStorage.removeItem(ignoredKey(id));
  } catch (e) { /* localStorage 不可用（隐私模式 / 配额满）则静默跳过，仅影响便利性 */ }
}
function clearIgnored(id) { try { localStorage.removeItem(ignoredKey(id)); } catch (e) {} }

/** 规则里的一条 mock 响应 → 草稿条目（headers 整体带走，避免保存时静默丢掉别的响应头） */
function respItemFromMock(resp) {
  const r = isPlainObject(resp) ? resp : {};
  const hdrs = isPlainObject(r.headers) ? r.headers : {};
  return {
    status: Number.isFinite(Number(r.status)) ? Number(r.status) : 200,
    contentType: hdrs['content-type'] || 'application/json',
    headers: { ...hdrs },
    name: typeof r.name === 'string' ? r.name : '',
    body: normalizeDraftBody(typeof r.body === 'string' ? r.body : ''),
    // 读进来那份**原样**留着，保存时用它打底（cond 等未知字段才不会丢，ADR-027）
    _raw: clonePlain(r),
  };
}

/** 草稿条目 → 规则里的 mock 响应（headers 保留内容，content-type 以编辑框为准） */
function respItemToMock(item) {
  const headers = isPlainObject(item.headers) ? { ...item.headers } : {};
  const ct = String(item.contentType == null ? '' : item.contentType).trim();
  if (ct) headers['content-type'] = ct; else delete headers['content-type'];
  // 以原条目打底再覆盖：`cond`、未来的每条目扩展字段都跟着走
  const mock = clonePlain(item._raw);
  mock.status = Number(item.status) || 200;
  mock.headers = headers;
  mock.body = item.body == null ? '' : String(item.body);
  const name = String(item.name == null ? '' : item.name).trim();
  if (name) mock.name = name; else delete mock.name;
  return mock;
}

function ruleToDraft(r) {
  const m = isPlainObject(r.match) ? r.match : {};
  const p = isPlainObject(m.params) ? m.params : {};
  const keys = Object.keys(p);
  const act = isPlainObject(r.action) ? r.action : {};
  // 多返回值（协议 §5.4）：responses 优先；没有才回落到旧形态的单条 response
  const raws = Array.isArray(act.responses) ? act.responses.filter(isPlainObject) : [];
  let responses, pick, pinIndex;
  if (raws.length) {
    responses = raws.map(respItemFromMock);
    if (act.mode === 'sequence') {
      // 顺序 / 随机：pick 直接复用 seqMode（缺省 = 依次返回）
      const sm = act.seqMode;
      pick = sm === 'random' || SEQ_PICKS.includes(sm) ? sm : 'in-order';
      pinIndex = 0;
    } else {
      // specific，或「有 responses 却缺 mode」的旧脏数据 → 指定某一条（越界夹回）
      pick = 'specific';
      // 只认真正的数字：服务端 clampIndex 也是这个口径（字符串 / NaN 一律当 0），
      // 这里宽松的话，编辑器会显示第 ② 条而服务端实际返回第 ① 条——静默不一致
      const raw = act.pinIndex;
      const n = typeof raw === 'number' && Number.isFinite(raw) ? Math.trunc(raw) : 0;
      pinIndex = Math.min(Math.max(n, 0), raws.length - 1);
    }
  } else {
    responses = [respItemFromMock(act.response)];
    pick = 'specific';
    pinIndex = 0;
  }
  return {
    id: r.id,
    name: r.name || '',
    enabled: r.enabled !== false,
    priority: Number.isFinite(Number(r.priority)) ? Number(r.priority) : 0,
    // 归属：读进来是什么就是什么（协议 §5.4 的「翻转不静默」要靠界面把这一项显示出来）
    projectId: typeof r.groupId === 'string' && r.groupId ? r.groupId : null,
    method: m.method || '', host: m.host || '', path: m.path || '',
    // 参与匹配的参数（on）全部载入，再补上本地记住的「忽略」参数（on:false）；
    // 已在 match.params 里的 key 不重复（用户后来又把它切回「匹配」的情况）
    params: keys.map((k) => ({ k, v: String(p[k]), on: true }))
      .concat(loadIgnored(r.id)
        .filter((x) => !Object.prototype.hasOwnProperty.call(p, x.k))
        .map((x) => ({ k: x.k, v: x.v, on: false }))),
    responses, pick, pinIndex, sel: 0,
    source: null,
    // 打底用的原样副本（保存时只覆盖编辑器管的那些键，其余无损带走，ADR-027）。
    // 只在内存草稿里，不进规则 JSON。
    _raw: clonePlain(r), _rawMatch: clonePlain(m), _rawAction: clonePlain(act),
  };
}

/** 由一条真实记录生成草稿：匹配条件与返回值都「带过来」 */
function draftFromRecord(rec) {
  const req = isPlainObject(rec.request) ? rec.request : {};
  const d = emptyDraft();
  d.method = req.method || 'GET';
  d.host = req.host || '';       // 记录里的 host 天然带端口，避开「不带端口匹配不上」的坑
  d.path = req.path || '';
  d.responses = [responseFromRecord(rec)];
  d.name = d.method + ' ' + d.path;
  d.source = rec.id;
  // 入参：业务参数默认参与匹配，公共参数默认不参与（每次都在变，勾上必然匹配不上）
  const ps = requestParams(rec);
  d.params = ps.biz.map((p) => ({ k: p.k, v: p.v, on: true }))
    .concat(ps.common.map((p) => ({ k: p.k, v: p.v, on: false })));
  return d;
}

function draftToRule(d) {
  // ⚠️ 保存必须**无损**（ADR-027）：以读进来那份原样打底，再覆盖编辑器管的那些键。
  // 编辑器不认识的东西（mock CLI 写的 `responses[].cond`、未来的 `groupId`、`latencyHint`…）
  // 若跟着「重建对象」一起被抹掉，用户只是想改个 body，却把别人写进去的配置清空了——
  // 这是静默失效，控制台与 CLI 两边都看不出发生过。
  const rule = clonePlain(d._raw);
  const match = clonePlain(d._rawMatch);
  if (d.method) match.method = String(d.method).toUpperCase(); else delete match.method;
  if (d.host) match.host = String(d.host); else delete match.host;
  if (d.path) match.path = String(d.path); else delete match.path;
  // 默认就是「域名 + 路径 + 入参」：切到「忽略」的参数不写进去。
  // 一个都没勾 → 不写 match.params，协议层等价于「只匹配域名 + 路径」（ADR-016）
  const params = {};
  for (const p of d.params) {
    if (!p.on) continue;
    const k = String(p.k || '').trim();
    if (!k) continue;
    params[k] = p.v == null ? '' : String(p.v);
  }
  if (Object.keys(params).length) match.params = params; else delete match.params;
  const list = respList(d);
  const action = clonePlain(d._rawAction);
  action.type = 'mock';
  // 控制台没有延迟编辑项：读进来有就保留（CLI 可以 --delay-ms 2000），没有才写 0
  const rawDelay = Number(action.delayMs);
  action.delayMs = Number.isFinite(rawDelay) && rawDelay > 0 ? rawDelay : 0;
  if (d.pick === 'specific' && list.length === 1) {
    // 单条 + 指定 = 旧形态：存量规则保存后 JSON 一字不变，也不需要 responses 数组
    action.mode = 'static';
    action.response = respItemToMock(list[0]);
    // 换形态时**必须删掉另一形态的字段**：留着旧的 responses 数组，服务端会优先读它
    // （协议 §5.4 的判定顺序），用户改完保存却发现返回的还是老的那条
    delete action.responses;
    delete action.pinIndex;
    delete action.seqMode;
  } else if (d.pick === 'specific') {
    action.mode = 'specific';
    action.responses = list.map(respItemToMock);
    action.pinIndex = Math.min(Math.max(Math.trunc(Number(d.pinIndex) || 0), 0), list.length - 1);
    delete action.response;
    delete action.seqMode;
  } else {
    action.mode = 'sequence';
    // random 也是 sequence 的一种（协议 seqMode），不能因为不在 SEQ_PICKS 里就退回依次返回
    action.seqMode = d.pick === 'random' || SEQ_PICKS.includes(d.pick) ? d.pick : 'in-order';
    action.responses = list.map(respItemToMock);
    delete action.response;
    delete action.pinIndex;
  }
  rule.id = d.id;
  rule.enabled = !!d.enabled;
  rule.priority = Number(d.priority) || 0;
  // 归属（C14）：草稿上有就写它；没有则跟着 _raw 原样走（无损打底，ADR-027）。
  // 两边都没有时**不补空串**：空 groupId 服务端是 400，让 saveDraft() 在发请求前拦住更清楚
  if (typeof d.projectId === 'string' && d.projectId) rule.groupId = d.projectId;
  rule.match = match;
  rule.action = action;
  // 名字给空了就是不命名：留一个 name: '' 会让列表显示成空行，也让 CLI 的 diff 误报「改名」
  const name = String(d.name == null ? '' : d.name).trim();
  if (name) rule.name = name; else delete rule.name;
  return rule;
}

/** 列表第二行：域名 · 入参匹配情况（不再有「匹配范围」二选一，直接说清实际存了什么） */
function scopeLabel(m) {
  const n = isPlainObject(m.params) ? Object.keys(m.params).length : 0;
  return n ? '入参匹配 ' + n + ' 项' : '不校验入参';
}

/** 列表第二行补一句返回值条数与命中方式（多条时才显示，避免单项规则噪音） */
function respLabel(r) {
  const act = isPlainObject(r.action) ? r.action : {};
  const n = Array.isArray(act.responses) ? act.responses.filter(isPlainObject).length : (isPlainObject(act.response) ? 1 : 0);
  if (n <= 1) return '';
  let how;
  if (act.mode === 'sequence') {
    how = { 'in-order': '依次', loop: '循环', 'once-then-passthrough': '依次后放行', random: '随机' }[act.seqMode] || '依次';
  } else {
    const p = Number(act.pinIndex);
    how = '指定第 ' + circleNum(Math.max(Number.isFinite(p) ? Math.trunc(p) : 0, 0)) + ' 条';
  }
  return ' · ' + n + ' 条返回值（' + how + '）';
}

/**
 * 模板模式（C14）：与「浏览 / Mock」平级的项目管理入口。
 * 只列项目 item 本身（名字 / 规则数 / 状态），不列接口；
 * 私有 item 点击进 Mock 工作台（自动归到该项目），共享 item 在本模式内只读预览。
 */
function renderTpl() {
  const tabs = $('tpl-tabs');
  const list = $('tpl-list');
  if (!tabs || !list) return;
  tabs.querySelectorAll('.tpl-tab').forEach((b) => b.classList.toggle('active', b.dataset.ttab === state.tplTab));
  const mine = privateProjects(state.projects);
  const shared = sharedProjects(state.projects);

  // 共享详情视图：从共享 tab 点进来的只读预览（内容 + 历史 + copy / rollback / archive）
  if (state.sharedId && state.tplTab === 'shared') {
    list.innerHTML = sharedPanelHTML();
    list.querySelectorAll('[data-ta]').forEach((n) => {
      n.onclick = (ev) => {
        if (ev && ev.stopPropagation) ev.stopPropagation();
        const act = n.dataset.ta;
        const id = n.dataset.pid;
        const vid = n.dataset.vid;
        if (act === 'copy') { void copyShared(id); return; }
        if (act === 'archive') { void toggleArchive(id); return; }
        if (act === 'preview') { void previewVersion(id, vid); return; }
        if (act === 'rollback') { void rollbackTo(id, vid); return; }
        if (act === 'del-shared') { askDeleteProject('shared', id); return; }
        if (act === 'restore') { void restoreSharedProject(id); return; }
        if (act === 'close-shared') {
          state.sharedId = null; state.versions = []; state.versionDetail = null; state.sharedRules = [];
          renderTpl();
        }
      };
    });
    return;
  }
  if (state.sharedId) { state.sharedId = null; state.versions = []; state.versionDetail = null; state.sharedRules = []; }

  if (state.tplTab === 'shared') {
    const rows = shared.map((p) => {
      const pending = typeof p.purgeAt === 'number';
      return '<div class="tpl-item' + (pending ? ' pending' : '') + '" data-ta="open-shared" data-pid="' + esc(p.id) + '"' +
        ' title="' + esc(p.id) + ' · 创建于 ' + fmtTime(p.createdAt) +
          (pending ? ' · 待删除，' + esc(fmtTime(p.purgeAt)) + ' 自动真删' : '') + '">' +
        '<div class="ttl">' +
          '<span class="nm">' + esc(p.name) + '</span>' +
          (pending ? '<span class="ro warn">待删除</span>' : (p.archived ? '<span class="ro">已归档</span>' : '')) +
        '</div>' +
        '<div class="foot">' +
          '<span class="meta">' + (Number(p.ruleCount) || 0) + ' 条' +
            (pending ? ' · 剩 ' + daysLeft(p.purgeAt) + ' 天' : '') + '</span>' +
          (pending
            ? '<button class="mini-btn" data-ta="restore" data-pid="' + esc(p.id) + '"' +
                ' title="取消待删除：规则与历史版本从未被改动">恢复</button>'
            : '<button class="mini-btn danger" data-ta="del-shared" data-pid="' + esc(p.id) + '"' +
                ' title="软删除：先进入待删除倒计时，期间任何人都能恢复；到期才真删">删除</button>') +
        '</div>' +
      '</div>';
    }).join('');
    list.innerHTML =
      '<div class="tpl-head"><span class="grow">共享项目 · 本实例所有人可读</span></div>' +
      (rows ? '<div class="tpl-grid">' + rows + '</div>'
        : '<div class="tpl-note">还没有共享项目。把私有项目分享出去（Mock 模式项目卡上的「分享」）后会出现在这里。</div>') +
      '<div class="tpl-note">共享项目是<b>只读模板</b>：不会直接命中，改名也随分享覆盖时才生效。要用先复制到私有项目，改完再分享回去。' +
        '<br>删除是<b>软删除</b>：先进入待删除倒计时，规则与历史原样保留，期间可随时「恢复」；到期无人恢复才真删。</div>';
  } else {
    const cards = mine.map((p) => {
      const off = p.enabled === false;
      return '<div class="tpl-item" data-ta="open" data-pid="' + esc(p.id) + '"' +
        ' title="' + esc(p.id) + ' · 创建于 ' + fmtTime(p.createdAt) + '">' +
        '<div class="ttl">' +
          '<span class="nm' + (off ? ' off' : '') + '">' + esc(p.name) + '</span>' +
          (off ? '<span class="ro">已停用</span>' : '') +
        '</div>' +
        '<div class="foot">' +
          '<span class="meta">' + (Number(p.ruleCount) || 0) + ' 条</span>' +
          '<button class="mini-btn" data-ta="rename" data-pid="' + esc(p.id) + '" title="重命名私有项目">重命名</button>' +
          // 停用/启用与删除都在卡上：项目列表是唯一能一眼看全所有项目的地方，
          // 不该为了关一个项目再点进 Mock 工作台。两个动作都要过二次确认
          '<button class="mini-btn" data-ta="toggle" data-pid="' + esc(p.id) + '"' +
            ' title="' + (off ? '启用整组：规则恢复按各自的开关命中' : '停用整组：规则保留，但一条都不命中') + '">' +
            (off ? '启用' : '停用') + '</button>' +
          '<button class="mini-btn danger" data-ta="del-private" data-pid="' + esc(p.id) + '"' +
            ' title="删除项目：立刻删除并连带删除项目内规则，没有回收站">删除</button>' +
        '</div>' +
      '</div>';
    }).join('');
    // 新建入口固定是网格的最后一项，只用「+」表示（文字说明走 title / aria-label）
    const newTile = '<button class="tpl-item tpl-new" data-ta="new" type="button"' +
      ' title="新建一个私有项目（规则必须先归属一个项目）" aria-label="新建私有项目">+</button>';
    list.innerHTML =
      '<div class="tpl-head"><span class="grow">私有项目 · 只有这台设备的登录空间可读写</span></div>' +
      '<div class="tpl-grid">' + cards + newTile + '</div>' +
      (mine.length ? '' : '<div class="tpl-note">还没有私有项目。规则必须归属某个私有项目才会命中——点网格里的「+」新建。</div>') +
      '<div class="tpl-note">点项目进入它的规则列表；重命名只改名字，不影响项目 id、归属和已保存的规则。' +
        '停用只影响命中（规则本身的开关不改），删除会连带删掉项目内规则且没有回收站——两个动作都先弹确认框。</div>';
  }

  list.querySelectorAll('[data-ta]').forEach((n) => {
    n.onclick = (ev) => {
      if (ev && ev.stopPropagation) ev.stopPropagation();
      const act = n.dataset.ta;
      const id = n.dataset.pid;
      if (act === 'open') { selectProject(id); setMode('mock'); return; }
      if (act === 'open-shared') { void openSharedPanel(id); return; }
      if (act === 'new') { void promptNewProject(); return; }
      if (act === 'del-shared') { askDeleteProject('shared', id); return; }
      if (act === 'del-private') { askDeleteProject('private', id); return; }
      if (act === 'toggle') { askToggleProject(id); return; }
      if (act === 'restore') { void restoreSharedProject(id); return; }
      if (act === 'rename') {
        const p = projectById(state.projects, id);
        if (!p) return;
        const name = window.prompt('重命名私有项目', p.name);
        if (name !== null) void renameProject(id, name);
      }
    };
  });
  tabs.querySelectorAll('.tpl-tab').forEach((b) => {
    b.onclick = () => {
      // 切 tab = 离开当前详情：合上共享预览，避免「点了私有 tab 还停在共享详情」的错位；
      // 顺手关掉可能还开着的确认框，别让上一个视图的确认悬在新视图上
      state.sharedId = null; state.versions = []; state.versionDetail = null; state.sharedRules = [];
      closeConfirm();
      state.tplTab = b.dataset.ttab === 'shared' ? 'shared' : 'private';
      try { localStorage.setItem('ec_tpl_tab', state.tplTab); } catch (e) {}
      renderTpl();
    };
  });
}

function selectProject(id) {
  state.projectId = id;
  // 从模板模式点进私有项目时合上共享详情，两边的选中态不串
  state.sharedId = null;
  state.sharedRules = [];
  state.versions = [];
  state.versionDetail = null;
  closeConfirm();
  try { localStorage.setItem('ec_project', id || ''); } catch (e) {}
  syncScopedRules();
  // 换项目不清草稿：那是用户敲进去的东西。草稿自带 projectId，切过去后编辑器顶部
  // 仍如实显示它要写进哪个项目，保存照常有效
  renderMockList(); renderMockEditor();
}

function promptNewProject() {
  const name = window.prompt('新建私有项目：给它起个名字（例如「登录联调」）', '');
  if (name === null) return;
  void createProject(name);
}

/**
 * Mock 模式顶部的项目横滑栏：把**全部**私有项目摊成一行卡片。
 *
 * 「模块」在数据模型里就是项目（C14 / ADR-033：规则必须挂在私有项目上，
 * 共享项目是只读模板、不直接命中），所以「切项目」=「切模块」。
 *
 * 每张卡三个热区：
 * - 上行「项目名 + 条数」→ 切到该项目（选中卡浅绿底 + 双层描边）
 * - 下行「整组开关」→ 二次确认后走 `/groups/:id/enabled`，一键关/开整组。
 *   关组**不改写**组内规则的 enabled（ADR-030），所以重开即恢复原状。
 * - 下行「删」→ 二次确认后删除项目；私有项目立刻级联删规则，没有回收站
 *   （共享项目是软删除 + 倒计时恢复，但共享项目不在这条栏里，走模板模式）
 *
 * 计数用 `state.allRules` 而不是当前视图的 `state.rules`——否则切到某个项目后，
 * 其它卡上的条数会全变成 0，看起来像「那些项目空了」。
 */
function renderMockProjBar() {
  const el = $('mock-projbar');
  if (!el) return;
  // 脏数据兜底（AGENTS.md §4）：这两份都可能被写坏，`null.length` 会直接把整条栏搞没
  const allRules = Array.isArray(state.allRules) ? state.allRules : [];
  const mine = privateProjects(state.projects);
  const cur = state.projectId;
  const atAll = !cur || cur === ALL_PROJECTS;
  const cards = [
    '<div class="mproj-chip' + (atAll ? ' on' : '') + '" data-mp="' + esc(ALL_PROJECTS) + '">' +
      '<button class="mproj-pick" type="button" aria-pressed="' + (atAll ? 'true' : 'false') + '"' +
        ' title="不按项目过滤：列出全部私有项目的规则">' +
        '<span class="nm">全部</span><span class="n">' + allRules.length + '</span></button>' +
      // 聚合视图没有「整组」可言，不放假开关；这里放项目数，顺便和别的卡等高
      '<span class="mproj-meta">' + mine.length + ' 个项目</span>' +
    '</div>',
  ];
  mine.forEach((p) => {
    const n = rulesOfProject(allRules, p.id).length;
    const off = p.enabled === false;
    const sel = cur === p.id;
    cards.push('<div class="mproj-chip' + (sel ? ' on' : '') + (off ? ' off' : '') + '"' +
      ' data-mp="' + esc(p.id) + '">' +
      '<button class="mproj-pick" type="button" aria-pressed="' + (sel ? 'true' : 'false') + '"' +
        ' title="' + esc(p.name + ' · ' + n + ' 条' + (sel ? '（当前项目）' : '（点一下切到这个项目）')) + '">' +
        '<span class="nm">' + esc(p.name) + '</span>' +
        '<span class="n">' + n + '</span></button>' +
      '<div class="mproj-row2">' +
        '<button class="mproj-sw" type="button" role="switch" data-mpsw="' + esc(p.id) + '"' +
          ' aria-checked="' + (!off) + '"' +
          ' title="' + esc(off
            ? '整组停用中：项目内 ' + n + ' 条一条都不命中。点一下打开整组（规则各自的开关不改）'
            : '点一下关闭整组：项目内 ' + n + ' 条全部不命中（规则各自的开关不改，重开即恢复）') + '">' +
          '<span class="trk" aria-hidden="true"></span>' +
          '<span class="swl">' + (off ? '已停用' : '生效中') + '</span></button>' +
        // 删除挂在这张卡上：不必先点进项目再找编辑器里的「删除项目」。
        // 私有项目没有回收站，点开仍要过二次确认（askDeleteProject）
        '<button class="mproj-del" type="button" data-mpdel="' + esc(p.id) + '"' +
          ' title="删除项目：立刻删除，并连带删除项目内 ' + n + ' 条规则（私有项目没有回收站）"' +
          ' aria-label="删除项目 ' + esc(p.name) + '">删</button>' +
      '</div>' +
    '</div>');
  });
  // 一个项目都没有时这条栏也得在：`+` 是「先去建一个」的入口，否则空状态只剩一句提示
  cards.push('<button class="mproj-add" type="button" data-mp="__new__" title="新建私有项目">' +
    '<span class="plus" aria-hidden="true">+</span><span>新建</span></button>');
  el.innerHTML = cards.join('');

  el.querySelectorAll('[data-mp]').forEach((b) => {
    // 卡片本身也挂着 data-mp：点卡片空白处同样切项目；点开关时由它自己 stopPropagation
    b.onclick = () => {
      if (b.dataset.mp === '__new__') { promptNewProject(); return; }
      selectProject(b.dataset.mp);
    };
  });
  // 整组开关 / 删除：都先弹二次确认，确认后才发请求；
  // 两个按钮都要 stopPropagation，否则会连带触发卡片的「切项目」
  el.querySelectorAll('[data-mpsw]').forEach((b) => {
    b.onclick = (ev) => {
      if (ev && ev.stopPropagation) ev.stopPropagation();
      askToggleProject(b.dataset.mpsw);
    };
  });
  el.querySelectorAll('[data-mpdel]').forEach((b) => {
    b.onclick = (ev) => {
      if (ev && ev.stopPropagation) ev.stopPropagation();
      askDeleteProject('private', b.dataset.mpdel);
    };
  });

  // 选中项滚进可视区。不用 scrollIntoView：它会连带滚动祖先容器，
  // 从别的模式切回 Mock 时整页会跳一下；这里只算自己这一条需要的 scrollLeft。
  // 只滚「差的那一点」（不居中）：窄侧栏里居中会把左右两张卡同时切掉半截，
  // 看起来像整条栏被裁坏了，也丢掉了「上一个是哪个项目」这个上下文。
  const on = el.querySelector('.mproj-chip.on');
  if (on && el.clientWidth) {
    const left = on.offsetLeft;
    const right = left + on.offsetWidth;
    if (left < el.scrollLeft) el.scrollLeft = left - 10;
    else if (right > el.scrollLeft + el.clientWidth) el.scrollLeft = right - el.clientWidth + 10;
  }

  // 桌面鼠标只有竖向滚轮：不接管的话这条栏只能靠拖滚动条才能看到后面的项目。
  // 触控板的横向滑动（deltaX 主导）交给浏览器原生处理，避免抢掉。
  el.onwheel = (ev) => {
    if (el.scrollWidth <= el.clientWidth) return;
    if (Math.abs(ev.deltaY) <= Math.abs(ev.deltaX)) return;
    el.scrollLeft += ev.deltaY;
    ev.preventDefault();
  };
}

function renderMockList() {
  const el = $('mock-list');
  if (!el) return;
  // 必须放在下面那个 `if (!total) return` 之前：一个项目 0 条规则是最常见的状态，
  // 放后面的话栏会跟着空状态一起消失，正好在最需要切项目的时候没了。
  renderMockProjBar();
  // 草稿 = 还没写进服务端的那条。正常路径下「Mock 此接口」会**自动落库**，
  // 只有自动保存失败（没可写项目 / 服务端 400 / 断网）才留下草稿——照样列出来，
  // 否则切到 Mock 模式后左边列表是空的，让人以为根本没建成功。
  const draft = state.mockDraft && !state.allRules.some((r) => r && r.id === state.mockDraft.id)
    ? state.mockDraft : null;
  const total = state.rules.length + (draft ? 1 : 0);
  const view = state.projectId === ALL_PROJECTS ? '全部私有项目' : projectNameOf(state.projects, state.projectId);
  // 当前项目整组停用时，条数旁边必须直说：规则自己还开着、列表里也还在，
  // 但一条都不会命中——不写这一句，看到「3 条」会以为在生效
  const curProj = projectById(state.projects, state.projectId);
  const viewOff = curProj && curProj.enabled === false ? '（整组停用，不命中）' : '';
  $('mock-count').textContent = (total ? '· ' + total + ' 条 · ' : '· ') + view + viewOff;
  if (!total) {
    el.innerHTML = '<div class="empty">还没有 mock 接口' +
      '<div class="hint" style="margin-top:6px">浏览模式在记录上点「Mock」，<br>返回值会直接带过来</div></div>';
    return;
  }
  // 草稿项不带开/关/×：它对服务端还不存在，别让按钮去打不存在的规则；丢弃草稿走编辑器里的按钮
  const draftItem = !draft ? '' :
    '<div class="mock-item active" data-id="' + esc(draft.id) + '"' +
      ' title="未保存的草稿（自动保存没成功）：改完点「保存并生效」重试">' +
      '<div class="l1">' +
        '<span class="m">' + esc(draft.method || 'ANY') + '</span>' +
        '<span class="p">' + esc(draft.path || '(未填路径)') + '</span>' +
        '<span class="draft-tag">未保存</span>' +
      '</div>' +
      '<div class="l2">' + esc(draft.host || '(任意域名)') + ' · 待保存到「' +
        esc(projectNameOf(state.projects, draft.projectId)) + '」</div>' +
    '</div>';
  el.innerHTML = draftItem + state.rules.map((r) => {
    const m = isPlainObject(r.match) ? r.match : {};
    const on = r.enabled !== false;
    const active = state.mockDraft && state.mockDraft.id === r.id;
    // 归属一行常驻（C14 / 协议 §5.4）：命中还看「项目是私有 + 项目开着 + 项目属于这台设备的
    // 用户」，只显示「规则已启用」会让人以为它正在生效——这正是这次翻转最容易被误读的地方
    const proj = projectById(state.projects, r.groupId);
    const projOff = proj && proj.enabled === false;
    const projLabel = projectNameOf(state.projects, r.groupId);
    return '<div class="mock-item' + (active ? ' active' : '') + '" data-id="' + esc(r.id) + '"' +
      ' title="' + esc((m.method || 'ANY') + ' ' + (m.path || '(任意路径)')) + '">' +
      '<div class="l1">' +
        '<span class="m">' + esc(m.method || 'ANY') + '</span>' +
        '<span class="p">' + esc(m.path || '(任意路径)') + '</span>' +
        // 开/关与删除直接在列表项上做：不必先点进编辑器（走单条接口，ADR-019）
        '<button class="tg' + (on ? ' on' : '') + '" data-toggle="' + esc(r.id) + '"' +
          ' title="' + (on ? '点击停用：规则保留，但不再命中' : '点击启用该规则') + '">' +
          (on ? '开' : '关') + '</button>' +
        '<button class="rm" data-rm="' + esc(r.id) + '" title="删除该 mock 接口">×</button>' +
      '</div>' +
      '<div class="l2">' + esc(m.host || '(任意域名)') + ' · ' + scopeLabel(m) + respLabel(r) + '</div>' +
      '<div class="l2 proj">' + (projOff ? '⊘ 项目：' : '· 项目：') + esc(projLabel) +
        (projOff ? '（项目已停用 → 不命中）' : '') + '</div>' +
    '</div>';
  }).join('');
  el.querySelectorAll('.mock-item').forEach((n) => {
    n.onclick = () => {
      // 草稿项（服务端还没有）点一下只是回到编辑器；已保存的走 selectMock
      if (state.rules.some((r) => r.id === n.dataset.id)) selectMock(n.dataset.id);
      else renderMockEditor();
    };
  });
  el.querySelectorAll('button[data-toggle]').forEach((n) => {
    n.onclick = (ev) => { ev.stopPropagation(); void toggleRule(n.dataset.toggle); };
  });
  el.querySelectorAll('button[data-rm]').forEach((n) => {
    n.onclick = (ev) => { ev.stopPropagation(); void removeRule(n.dataset.rm); };
  });
}

// 列表里直接开/关一条规则：走 POST /rules/:id/enabled，只动这一条。
// 服务端是唯一真值来源 —— 成功后整份拉回来重画，不在本地猜状态。
async function toggleRule(id) {
  const r = state.allRules.find((x) => x && x.id === id);
  if (!r) return;
  const next = r.enabled === false;   // 当前是关 → 打开
  const res = await apiFetch('/__ec/api/rules/' + encodeURIComponent(id) + '/enabled', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ enabled: next }),
  });
  if (!res.ok) {
    toast('切换失败：' + (await apiErrText(res)));
    return;
  }
  await loadRules();
  // 编辑器正开着这条：同步勾选框，否则界面上「列表说开、编辑器说关」
  if (state.mockDraft && state.mockDraft.id === id) { state.mockDraft.enabled = next; renderMockEditor(); }
  // 命中还要看项目开关（协议 §5.4 的那条 AND）：只说「已启用」会让人以为已经在生效
  const proj = projectById(state.projects, r.groupId);
  const offNote = next && proj && proj.enabled === false ? '，但所在项目「' + proj.name + '」已停用，暂不命中' : '';
  toast((next ? '已启用该 mock 接口' : '已停用该 mock 接口（规则保留）') + offNote);
}

// 列表里直接删除一条规则：走 DELETE /rules/:id
async function removeRule(id) {
  const r = state.allRules.find((x) => x && x.id === id);
  if (!r) return;
  const res = await apiFetch('/__ec/api/rules/' + encodeURIComponent(id), { method: 'DELETE' });
  if (!res.ok) {
    toast('删除失败：' + (await apiErrText(res)));
    return;
  }
  // 规则少了一条，各项目计数也要跟着变 → 连项目表一起重拉
  await refreshMockData();
  clearIgnored(id); // 规则没了，本地记的「忽略」参数一并清掉
  if (state.mockDraft && state.mockDraft.id === id) { state.mockDraft = null; renderMockEditor(); }
  toast('已删除');
}

function selectMock(id) {
  const r = state.allRules.find((x) => x && x.id === id);
  if (!r) return;
  state.mockDraft = ruleToDraft(r);
  renderMockList(); renderMockEditor();
}

/** 列表项里的返回值摘要：压成单行，超长交给 CSS 截断 */
function bodyPreview(body) {
  const s = String(body == null ? '' : body).replace(/\s+/g, ' ').trim();
  return s.length > 120 ? s.slice(0, 120) + '…' : s;
}

/** 返回值列表里的一行：拖动手柄 + 指定圆点 + 状态码 / 类型 / 备注 / 正文预览 + 行内操作 */
function respRowHTML(item, i, d) {
  const pinned = d.pick === 'specific' && Number(d.pinIndex) === i;
  return '<div class="resp-item' + (i === d.sel ? ' active' : '') + '" data-ri="' + i + '" draggable="true"' +
      ' title="点一下选中并编辑；按住左侧 ⠿ 拖动排序">' +
    '<span class="drag" title="按住拖动排序">⠿</span>' +
    '<input type="radio" name="md-pin" data-ri="' + i + '"' + (pinned ? ' checked' : '') +
      ' title="指定每次都返回这一条">' +
    '<span class="idx">' + circleNum(i) + '</span>' +
    '<span class="st">' + esc(String(item.status == null ? '' : item.status)) + '</span>' +
    '<span class="ct">' + esc(item.contentType || '') + '</span>' +
    '<span class="nm">' + esc(item.name || '') + '</span>' +
    '<span class="pv">' + esc(bodyPreview(item.body)) + '</span>' +
    '<span class="racts">' +
      '<button type="button" data-act="up-resp" data-ri="' + i + '" title="上移">↑</button>' +
      '<button type="button" data-act="down-resp" data-ri="' + i + '" title="下移">↓</button>' +
      '<button type="button" data-act="dup-resp" data-ri="' + i + '" title="复制这一条">复制</button>' +
      '<button type="button" class="rm" data-act="del-resp" data-ri="' + i + '" title="删除这一条">×</button>' +
    '</span>' +
  '</div>';
}

/**
 * 匹配条件摘要（method · host · path）：**只读一行**。
 *
 * 这三项是「这条接口」的身份，草稿由记录带过来（`draftFromRecord()`），存回规则时也只是
 * 原样写进 `match`。允许在编辑器里改，就会出现「规则匹配的接口和它 mock 的那条记录不是同一个」
 * ——浏览页的「Mock 此接口」按 method + host + path 找已有规则（`findRuleForRecord()`），
 * 改了路径它照样查不到，于是同一接口可以 mock 出好几条互相遮蔽的规则（还都是静默的）。
 * 要通配 / 正则等高级匹配，走「规则（JSON）」抽屉 —— 那是刻意的唯一手写入口。
 *
 * ADR-026 锁的是「不可编辑」，不是「必须长成输入框」：原先三个 `readonly` 输入框实际没人去填，
 * 只占掉三行、还一直在暗示「这里可以改」。压成一行只读文本后信息一条不少——`host` 仍然显式可见
 * （ADR-016 记的「host 必须带端口」那个坑照旧看得见），值也照样可以选中复制。
 *
 * 空值显示「任意方法 / 任意域名 / 任意路径」：存量规则允许不带 method / host（通配），
 * `draftToRule()` 依旧「为空就不写该字段」，协议语义不变。
 */
function matchLine(d) {
  const val = (v) => (v == null ? '' : String(v)).trim();
  const part = (v, empty) => (v ? esc(v) : '<span class="none">' + empty + '</span>');
  return '<div class="match-line" title="匹配条件由记录带过来、不可修改；' +
      '需要 glob / re: 通配请在右上角「规则」里编辑 JSON">' +
    part(val(d.method), '任意方法') + '<span class="sep">·</span>' +
    part(val(d.host), '任意域名') + '<span class="sep">·</span>' +
    part(val(d.path), '任意路径') +
    '</div>';
}

/** 项目归属文案：私有 = 我的；共享 = 发布人（服务端已脱敏，迁移来的可能是 null → 如实说未知） */
function projectOwnerLabel(p) {
  if (!p) return '归属未知';
  if (p.scope === 'shared') {
    if (!p.createdBy) return '发布人未知（迁移来的历史项目）';
    const me = state.user && state.user.phone;
    // 服务端只在我的手机号上回明文，别人的一律打码 —— 所以「等于我的号」就是我自己分享的，
    // 说「可能是他人空间」会让人怀疑自己的项目，反过来也不能对着打码的号猜是谁
    if (me && p.createdBy === me) return '发布人：你（本空间分享出去的，改它请用私有副本再「分享」覆盖）';
    return '发布人 ' + p.createdBy + '（他人空间 · 你只能复制，改不到它）';
  }
  return '我的私有项目';
}

/** 只读规则表（共享项目 / 历史版本共用）：把每条接口的身份与返回条数摊开 */
function readOnlyRuleTable(rules) {
  const list = Array.isArray(rules) ? rules : [];
  if (!list.length) return '<div class="hint">（这个项目里没有规则）</div>';
  return '<table class="tbl"><tbody>' + list.map((r) => {
    if (!r || typeof r !== 'object') return '<tr><td class="hint">（脏条目，已忽略）</td></tr>';
    const m = isPlainObject(r.match) ? r.match : {};
    const act = isPlainObject(r.action) ? r.action : {};
    const n = Array.isArray(act.responses) ? act.responses.length : (isPlainObject(act.response) ? 1 : 0);
    return '<tr>' +
      '<td>' + esc(String(m.method || 'ANY')) + '</td>' +
      '<td>' + esc(String(m.host || '(任意域名)')) + '</td>' +
      '<td>' + esc(String(m.path || '(任意路径)')) + '</td>' +
      '<td class="hint">' + (r.enabled === false ? '关' : '开') + ' · 优先级 ' + esc(String(r.priority == null ? 0 : r.priority)) +
        ' · ' + n + ' 条返回值</td>' +
      '<td class="hint">' + esc(String(r.name || '')) + '</td>' +
      '</tr>';
  }).join('') + '</tbody></table>';
}

/** 版本历史的一行：类型 / 服务端时间 / 脱敏操作人 / 条数 + 预览与回退 */
function historyRowHTML(p, v) {
  const opLabel = { publish: '首次发布', share: '覆盖分享', rollback: '回退' }[v.operation] || String(v.operation || '未知');
  const cur = p && p.currentVersionId === v.id;
  return '<div class="hist-item">' +
    '<span class="op">' + esc(opLabel) + '</span>' +
    '<span class="meta">' + esc(fmtTime(v.createdAt)) + ' · ' + esc(v.actorPhone || '操作人未知') +
      ' · ' + (Number(v.ruleCount) || 0) + ' 条' + (cur ? ' · <b>当前内容</b>' : '') +
      (v.rollbackOf ? ' · 回退自 ' + esc(String(v.rollbackOf)) : '') + '</span>' +
    '<button class="mini-btn" data-ta="preview" data-pid="' + esc(p ? p.id : '') + '" data-vid="' + esc(v.id) + '">预览</button>' +
    (cur ? '' : '<button class="mini-btn" data-ta="rollback" data-pid="' + esc(p ? p.id : '') + '" data-vid="' + esc(v.id) + '"' +
      ' title="把共享项目整批替换成这一版，并追加一条 rollback 历史（旧记录不删）">回退到这里</button>') +
    '</div>';
}

/**
 * 共享项目面板的动作区。

 * 删除走统一的二次确认弹框（`askDeleteProject('shared', id)`），不再在本区域里切成确认态；

    (pending

      : '<button data-ta="archive" data-pid="' + esc(p.id) + '">' + (p.archived ? '取消归档' : '归档') + '</button>' +

}

/** 私有项目卡：现在写的是哪个项目、它会不会命中、能对它做什么 */

  const mine = privateProjects(state.projects);

    const target = writableProjectId();
    return '<div class="card scope-card"><div class="sc-main">' +
      '<div class="sc-title">全部私有规则</div>' +

    '</div></div>';
}

/**

 * `PUT /rules/:id` 明确拒绝换项目（400 EC_SCOPE_MISMATCH）。

    '<label>归属项目</label><span class="hint">' + esc(projectNameOf(state.projects, d.projectId)) +

}

function renderMockEditor() {
  const el = $('mock-editor');
  if (!el) return;
  const head = projectCardHTML();
  const d = state.mockDraft;
  if (!d) {
    el.innerHTML = head + '<div class="empty">选择左侧一条 mock 接口编辑；还没有的话，在浏览模式的记录上点「Mock」</div>';
    return;
  }

  const idx = d.params.map((p, i) => ({ p, i }));
  const bizChips = idx.filter((x) => !isCommonParam(x.p.k));
  const commonChips = idx.filter((x) => isCommonParam(x.p.k));
  const onCount = d.params.filter((p) => p.on).length;
  // 每个参数 = 一块「匹配/忽略 键 = 值」，全部排在一行（放不下自动换行）
  // 状态用可点的小胶囊切换，不再提供删除 —— 不要的参数切到「忽略」即可（保存时会跳过）
  const chip = (x) =>
    '<span class="pchip' + (x.p.on ? ' on' : '') + '">' +
      '<span class="pp-st' + (x.p.on ? ' on' : '') + '" data-i="' + x.i + '"' +
        ' title="点击切换：匹配 = 参与入参校验；忽略 = 只展示不校验">' + (x.p.on ? '匹配' : '忽略') + '</span>' +
      '<input type="text" class="pp-k" data-i="' + x.i + '" value="' + esc(x.p.k) + '" placeholder="参数名">' +
      '<span class="eq">=</span>' +
      '<input type="text" class="pp-v" data-i="' + x.i + '" value="' + esc(x.p.v) + '" placeholder="任意值">' +
    '</span>';
  const chipRow = (chips, emptyText, withAdd) =>
    '<div class="params-row">' +
      (chips.length ? chips.map(chip).join('') : (emptyText ? '<span class="hint">' + emptyText + '</span>' : '')) +
      (withAdd ? '<span class="pchip add" data-act="add-param">+ 添加参数</span>' : '') +
    '</div>';

  const inRules = state.rules.some((r) => r.id === d.id);
  // 多返回值：列表 + 当前选中条目的编辑区（sel / pinIndex 由 curResp 夹回合法范围）
  const rs = respList(d);
  const cur = curResp(d);
  const pinIndex = Math.min(Math.max(Math.trunc(Number(d.pinIndex) || 0), 0), rs.length - 1);

  el.innerHTML = head +
    '<div class="card">' +
      '<div class="status-line">' +
        '<span class="tag">' + esc(d.method || 'ANY') + '</span>' +
        '<span class="url" style="font-size:14px">' + esc(d.path || '(未填路径)') + '</span>' +
        '<label class="hint" style="margin-left:auto;display:flex;align-items:center;gap:6px;cursor:pointer">' +
          '<input type="checkbox" id="md-enabled"' + (d.enabled ? ' checked' : '') + '> 启用' +
        '</label>' +
      '</div>' +
      '<div class="note">命中该规则的请求会直接返回下方返回值，<b>不再转发到真实服务器</b>；' +
        '规则对本<b>项目</b>里已绑定这台设备的用户生效（协议 §5.4）。</div>' +
      (inRules ? ownerRowHTML(d) : '') +

      '<div class="sec">' +
        '<div class="sec-head"><span class="t">匹配条件</span><span class="n">来自记录 · 只读</span></div>' +
        matchLine(d) +
        '<div class="hint" style="margin-top:6px">这三项是这条接口的身份，由记录带过来、' +
          '<b>不可修改</b>：改了就不再是同一个接口，列表里会多出两条对不上的规则。' +
          '需要 glob / <code>re:</code> 通配等高级匹配，请在右上角「规则」里编辑 JSON。</div>' +
      '</div>' +

      '<div class="sec">' +
        '<div class="sec-head"><span class="t">入参匹配</span>' +
          '<span class="sh-acts">' +
            '<button type="button" data-act="params-all" title="所有参数都设为「匹配」">全匹配</button>' +
            '<button type="button" data-act="params-none" title="所有参数都设为「忽略」（等价于只按域名 + 路径匹配）">全不匹配</button>' +
          '</span>' +
          '<span class="n" id="md-param-count">' + onCount + ' / ' + d.params.length + ' 项参与</span></div>' +
        '<div class="hint" style="margin-bottom:6px">默认<b>域名 + 路径 + 入参</b>都匹配；' +
          '不需要的参数切到「忽略」即可（不写进规则，但会在本机记住、下次打开仍展示）。</div>' +
        chipRow(bizChips, '（无业务参数）', true) +
        (commonChips.length

            '<div class="fold-inner">' + chipRow(commonChips, '', false) +
