<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EasyCharles 控制台</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --border: #e4e7ec;
    --text: #1f2937;
    --muted: #6b7280;
    --accent: #2b6cb0;
    --accent-soft: #e8f1fb;
    --ok: #3b6d11;
    --warn: #854f0b;
    --err: #a32d2d;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 13px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text); background: var(--bg);
    display: flex; flex-direction: column;
  }
  /* 三栏网格：顶部中间永远居中（1fr auto 1fr） */
  .topbar {
    display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    align-items: center; gap: 14px;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .tb-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .tb-right { display: flex; align-items: center; justify-content: flex-end; gap: 10px; min-width: 0; }
  .brand { font-size: 15px; font-weight: 600; white-space: nowrap; }
  .ver { font-size: 11px; color: var(--muted); font-weight: 400; }
  .conn {
    font-size: 12px; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .stats { font-size: 12px; color: var(--muted); white-space: nowrap; }
  /* 设备下拉（顶部中间） */
  .device-picker { position: relative; width: 300px; max-width: 100%; }
  .dp-trigger {
    width: 100%; display: flex; align-items: center; gap: 8px;
    padding: 5px 10px; font-size: 12px; text-align: left;
  }
  .dp-trigger .dp-label {
    flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .dp-trigger .caret { flex: none; color: var(--muted); font-size: 10px; }
  .dp-trigger.open { border-color: var(--accent); color: var(--accent); }
  .dp-trigger.open .caret { color: var(--accent); }
  .dp-panel {
    position: absolute; top: calc(100% + 6px); left: 50%; transform: translateX(-50%);
    width: 380px; max-width: 90vw; max-height: 60vh; overflow: auto; z-index: 60;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 12px 32px rgba(0,0,0,.12); padding: 6px;
  }
  .dp-panel.hidden { display: none; }
  .dp-item {
    display: flex; align-items: center; gap: 8px; padding: 6px 8px;
    border-radius: 6px; cursor: pointer; font-size: 12px;
  }
  .dp-item:hover { background: var(--bg); }
  .dp-item.active { background: var(--accent-soft); }
  .dp-item.unavailable { cursor: not-allowed; opacity: .65; }
  .dp-item .name { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dp-item .sub { color: var(--muted); flex: none; }
  .dp-item button { padding: 3px 10px; font-size: 11px; }
  .dp-sep { height: 1px; background: var(--border); margin: 5px 4px; }
  .dp-empty { color: var(--muted); font-size: 12px; padding: 12px; text-align: center; }
  /* 顶栏按钮不参与收缩，避免窄窗口下文字折行把顶栏撑高 */
  .topbar button { flex: none; white-space: nowrap; }
  @media (max-width: 960px) {
    .conn { display: none; }
    #who { display: none; }
    .device-picker { width: 220px; }
  }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; }
  .dot.on { background: var(--accent); }
  .dot.off { background: #d1d5db; }
  button {
    font: inherit; padding: 5px 12px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); border-radius: 6px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.primary:hover { opacity: .9; color: #fff; }
  button.danger { color: var(--err); border-color: var(--err); }
  button.danger:hover { background: var(--err); border-color: var(--err); color: #fff; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  main { flex: 1; display: flex; min-height: 0; }
  .sidebar {
    position: relative;
    width: 420px; min-width: 320px; display: flex; flex-direction: column;
    background: var(--panel); border-right: 1px solid var(--border);
  }
  /* 拖拽手柄：列表路径太长时把侧栏拉宽，宽度存 localStorage */
  .sidebar-resizer {
    position: absolute; top: 0; right: -4px; width: 8px; height: 100%;
    cursor: col-resize; z-index: 30;
  }
  .sidebar-resizer::after {
    content: ''; position: absolute; top: 0; left: 3px; width: 2px; height: 100%;
    background: transparent; transition: background .12s;
  }
  .sidebar-resizer:hover::after, .sidebar-resizer.dragging::after { background: var(--accent); }
  body.col-resizing { cursor: col-resize; user-select: none; }
  .tag { font-size: 10px; padding: 1px 5px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); flex: none; }
  .tag.other { background: #f1efe8; color: #5f5e5a; }
  /* 加解密（ADR-039）：绿色只用于「这条记录已经是明文」，与 mock/流式的灰蓝区分开 */
  .tag.crypto { background: #e7f5ec; color: #2f6b3f; }
  .crypto-note {
    margin: 0 0 10px; padding: 7px 9px; border-radius: 6px;
    background: #fdf6e7; border: 1px solid #f0e2c4; color: var(--warn); font-size: 12px;
  }
  .filters {
    padding: 8px 10px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px;
  }
  .filters input[type=text] { flex: 1; min-width: 0; width: auto; }
  .filters button { flex: none; padding: 5px 10px; }
  /* ── Mock 模式顶部的项目横滑栏 ──
     为什么是横滑而不是下拉：项目通常 3~8 个，横排一眼看全、点一下就切；
     下拉要点两下，而且在 320px 的窄侧栏里，原生 select 的列表会被窗口边缘裁掉。
     为什么放最上面：它是「我现在在哪个模块里」的总开关，比接口列表更上位。

     每张卡两行：上行「项目名 + 条数」点了切视图，下行「整组开关」一键关/开整组。
     开关必须和「切项目」分成两个热区——合成一个的话，想关整组就会顺手切走视图，
     正在编辑的规则跟着换项目，是最烦的那种误操作。 */
  .mproj {
    flex: none; display: flex; align-items: stretch; gap: 8px;
    padding: 8px 10px; border-bottom: 1px solid var(--border);
    position: relative;                 /* 让选中卡的 offsetLeft 相对这条栏算 */
    overflow-x: auto; overflow-y: hidden;
    overscroll-behavior-x: contain;     /* 滑到头不把整页一起带跑 */
    scrollbar-width: thin; scrollbar-color: #dcd7cb transparent;
  }
  .mproj::-webkit-scrollbar { height: 4px; }
  .mproj::-webkit-scrollbar-thumb { background: #dcd7cb; border-radius: 2px; }
  .mproj::-webkit-scrollbar-track { background: transparent; }
  .mproj-chip {
    flex: none; display: flex; flex-direction: column; justify-content: space-between; gap: 4px;
    min-width: 112px; max-width: 154px; padding: 7px 9px 6px;
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--panel); color: var(--text);
    font: inherit; font-size: 12px; line-height: 1.35;
    cursor: pointer; user-select: none;   /* 横滑时别把项目名拖成蓝色选中态 */
  }
  .mproj-chip:hover { border-color: #c3cec9; }
  /* 选中：浅绿底 + 双层描边（实心 accent 会把卡里的开关吞掉，也压得整条栏喘不过气） */
  .mproj-chip.on {
    background: var(--accent-soft); border-color: var(--accent);
    box-shadow: inset 0 0 0 1px var(--accent);
  }
  .mproj-pick {
    display: flex; align-items: baseline; gap: 4px; min-width: 0; width: 100%;
    padding: 0; border: 0; border-radius: 0; background: transparent; color: inherit;
    font: inherit; text-align: left; cursor: pointer;
  }
  /* 项目名可能很长：卡本身不能被撑爆，否则一屏只放得下一个 */
  .mproj-pick .nm {
    flex: 1; min-width: 0; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .mproj-pick .n { flex: none; font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .mproj-chip.on .mproj-pick .nm { color: var(--accent); }
  .mproj-chip.on .mproj-pick .n { color: var(--accent); opacity: .75; }
  /* 整组开关 + 删除：第二行两个热区，开关占满剩余宽度。
     关组不改写规则自身的 enabled（ADR-030），重开即恢复 */
  .mproj-row2 { display: flex; align-items: center; gap: 2px; }
  .mproj-sw {
    display: flex; align-items: center; gap: 5px; flex: 1; min-width: 0;
    padding: 2px 0; border: 0; border-radius: 0; background: transparent; color: var(--muted);
    font: inherit; font-size: 10px; line-height: 1.4; text-align: left; cursor: pointer;
  }
  .mproj-sw:hover { color: var(--text); }
  .mproj-sw .trk {
    flex: none; position: relative; width: 24px; height: 14px; border-radius: 999px;
    background: #d5dae0; transition: background .14s;
  }
  .mproj-sw .trk::after {
    content: ''; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px;
    border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(15,23,42,.28);
    transition: transform .14s;
  }
  .mproj-sw[aria-checked="true"] .trk { background: var(--accent); }
  .mproj-sw[aria-checked="true"] .trk::after { transform: translateX(10px); }
  .mproj-sw .swl { white-space: nowrap; }
  /* 卡片上的删除：不做成常驻的红按钮，避免整条栏看起来全是危险操作；
     hover 才变红，点开仍然是二次确认弹框 */
  .mproj-del {
    flex: none; width: 20px; height: 18px; padding: 0; margin-left: auto;
    border: 0; border-radius: 4px; background: transparent; color: var(--muted);
    font: inherit; font-size: 10px; line-height: 1; cursor: pointer;
  }
  .mproj-del:hover { color: var(--err); background: #fdecec; border-color: transparent; }
  /* 项目停用：开关已经明确表达状态，卡片只做减法。虚线圈留给末尾的「+ 新建」，
     否则「停用的项目」和「新建入口」长得一样，都是虚线圈 */
  .mproj-chip.off { background: #faf9f6; }
  .mproj-chip.off .mproj-pick .nm { color: var(--muted); font-weight: 500; }
  .mproj-chip.off.on { background: #eff3f0; }
  /* 「全部」不是项目、没有整组开关：第二行放项目个数，跟别的卡等高 */
  .mproj-meta { color: var(--muted); font-size: 10px; line-height: 14px; white-space: nowrap; }
  .mproj-add {
    flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    min-width: 48px; padding: 6px 9px;
    border: 1px dashed #c9cec9; border-radius: 10px;
    background: transparent; color: var(--muted); font: inherit; font-size: 11px;
    line-height: 1.3; cursor: pointer;
  }
  .mproj-add:hover { border-color: var(--accent); color: var(--accent); }
  .mproj-add .plus { font-size: 16px; line-height: 1; font-weight: 600; }
  input[type=text], input[type=password] {
    width: 100%; font: inherit; padding: 6px 10px; border: 1px solid var(--border);
    border-radius: 6px; background: var(--panel); color: var(--text);
  }
  input[type=text]:focus, input[type=password]:focus { outline: none; border-color: var(--accent); }
  .list { flex: 1; overflow: auto; }
  .row {
    display: flex; align-items: flex-start; gap: 8px; padding: 7px 10px;
    border-bottom: 1px solid #f1f2f4; cursor: pointer; font-size: 12px;
  }
  .row:hover { background: var(--bg); }
  .row.active { background: var(--accent-soft); }
  .row .m { width: 46px; font-weight: 600; color: var(--muted); flex: none; }
  .row .st { width: 34px; flex: none; font-weight: 600; }
  /* 路径最多两行：短路径仍单行，长路径换行而不是直接截断（配合 title 显示完整 URL） */
  .row .p {
    flex: 1; min-width: 0; word-break: break-all;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
  }
  .row .ms { color: var(--muted); flex: none; font-size: 11px; }
  .st.s2 { color: var(--ok); } .st.s4 { color: var(--warn); } .st.s5 { color: var(--err); }
  .tag.stream { background: #f1efe8; color: #5f5e5a; }
  .detail { flex: 1; overflow: auto; padding: 16px 20px; }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
  h2 { font-size: 14px; font-weight: 600; margin: 0 0 10px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
  .url { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; word-break: break-all; }
  table.kv { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.kv td { padding: 3px 6px; vertical-align: top; border-bottom: 1px solid #f1f2f4; }
  table.kv td:first-child { width: 200px; color: var(--muted); font-family: ui-monospace, Menlo, monospace; }
  pre.body {
    margin: 8px 0 0; padding: 12px; background: #fbfbfc; border: 1px solid var(--border);
    border-radius: 8px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px; white-space: pre-wrap; word-break: break-all; max-height: 420px; overflow: auto;
  }
  .meta { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  /* ── 详情：返回值置顶，参数分「业务 / 通用」，Headers 垫底 ── */
  .status-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .status-line .code { font-size: 20px; line-height: 1.2; font-weight: 700; }
  /* ── 详情顶部摘要：接口 / 传参 / 返回，各一行；完整版在下面（重复是有意的）── */
  .summary { margin-top: 12px; border-top: 1px dashed var(--border); padding-top: 10px; }
  .summary .srow { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 7px; font-size: 12px; }
  .summary .srow:last-child { margin-bottom: 0; }
  .summary .srow > .k { flex: none; width: 34px; color: var(--muted); font-size: 11px; padding-top: 2px; }
  .summary .srow > .v { flex: 1; min-width: 0; word-break: break-all; }
  .summary .srow > .v.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .pill {
    font-size: 11px; padding: 1px 7px; border-radius: 999px;
    background: var(--bg); color: var(--muted); border: 1px solid var(--border);
  }
  .sec { margin-top: 14px; }
  .sec-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .sec-head .t { font-size: 12px; font-weight: 600; color: var(--muted); }
  .sec-head .n { font-size: 11px; color: var(--muted); }
  .sec-head button { margin-left: auto; padding: 2px 9px; font-size: 11px; }
  /* 小节右侧的一组按钮（如返回值：放大查看 / 复制）——整组一起靠右 */
  .sec-head .sh-acts { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .sec-head .sh-acts button { margin-left: 0; }
  /* 折叠区：通用参数 / 原始 Body / Headers */
  details.fold { margin-top: 12px; border-top: 1px dashed var(--border); padding-top: 9px; }
  details.fold > summary {
    cursor: pointer; font-size: 12px; font-weight: 600; color: var(--muted);
    list-style: none; user-select: none;
  }
  details.fold > summary::-webkit-details-marker { display: none; }
  details.fold > summary::before { content: '▸ '; }
  details.fold[open] > summary::before { content: '▾ '; }
  details.fold > summary:hover { color: var(--accent); }
  details.fold .fold-inner { margin-top: 9px; }
  table.kv .src {
    font-size: 10px; color: var(--muted); border: 1px solid var(--border);
    border-radius: 4px; padding: 0 3px; margin-left: 4px;
  }
  /* 返回值 JSON 语法高亮 */
  pre.body .j-key { color: #2b6cb0; }
  pre.body .j-str { color: #9a5b00; }
  pre.body .j-num { color: #1d4ed8; }
  pre.body .j-bool { color: #a32d2d; }
  pre.body .j-null { color: var(--muted); }
  /* textarea 的基础样式仍被返回值弹窗（.modal-editor）与 Mock 编辑器（.mock-body-editor）复用；
     手写规则 JSON 的抽屉删掉后这条不能跟着删（ADR-036） */
  textarea {
    flex: 1; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
    border: 1px solid var(--border); border-radius: 8px; padding: 10px; resize: none;
  }
  /* ── 分享快照的结果（详情页内联一行；前台不做快照列表管理）── */
  .snap-result {
    display: flex; align-items: center; gap: 8px; margin-top: 8px; padding: 7px 9px;
    border: 1px dashed var(--accent); border-radius: 8px; background: var(--accent-soft); font-size: 12px;
  }
  .snap-result .k { flex: none; color: var(--muted); }
  .snap-result .v { flex: 1; word-break: break-all;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  /* 登录页 */
  #login-view {
    flex: 1; display: flex; align-items: center; justify-content: center;
  }
  .login-card {
    width: 340px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 28px 24px; box-shadow: 0 8px 30px rgba(0,0,0,.05);
  }
  .login-card h1 { font-size: 17px; margin: 0 0 4px; }
  .login-card .desc { color: var(--muted); font-size: 12px; margin: 0 0 18px; }
  .login-card label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
  .login-card .err { color: var(--err); font-size: 12px; margin: 10px 0 0; min-height: 16px; }
  .login-card button { width: 100%; margin-top: 16px; padding: 8px; }
  .login-card .pw-hint { font-size: 11px; color: var(--muted); margin-top: 12px; }
  /* ── 模式切换（浏览 / Mock）── */
  .modeswitch { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; flex: none; }
  .ms-btn { border: none; border-radius: 0; padding: 4px 14px; font-size: 12px; background: var(--panel); color: var(--muted); }
  .ms-btn:hover { color: var(--accent); border-color: transparent; }
  .ms-btn.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  /* ── Mock 模式 ── */
  /* min-width:0 + 省略号：工具栏右侧多了「重置指针」按钮后，长项目名不再把头部顶宽 */
  .mock-head {
    flex: 1; min-width: 0; font-size: 12px; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .mock-item { padding: 8px 10px; border-bottom: 1px solid #f1f2f4; cursor: pointer; }
  .mock-item:hover { background: var(--bg); }
  .mock-item.active { background: var(--accent-soft); }
  .mock-item .l1 { display: flex; align-items: flex-start; gap: 8px; font-size: 12px; }
  .mock-item .m { width: 42px; font-weight: 600; color: var(--muted); flex: none; font-size: 11px; }
  .mock-item .p {
    flex: 1; min-width: 0; word-break: break-all;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
  }
  .mock-item .l2 { margin: 3px 0 0 50px; font-size: 11px; color: var(--muted); }
  /* 列表项上的开/关与删除：整行点击 = 选中，所以这两个按钮必须 stopPropagation。
     类名刻意用 .tg / .rm 这种短名，避免撞上全局规则（如 .tag / .empty）。
     两者都做得比正文大一档：列表里直接开/关、删除，不用先点进编辑器（ADR-019）。 */
  /* 开/关：开启时实心绿（一眼看出哪些规则正在生效），关闭时灰底 */
  .mock-item .tg {
    flex: none; min-width: 38px; text-align: center; cursor: pointer;
    font-size: 12px; font-weight: 600; line-height: 1.4; padding: 3px 8px; border-radius: 6px;
    background: var(--accent); color: #fff; border-color: var(--accent);
  }
  .mock-item .tg:hover { filter: brightness(1.08); color: #fff; border-color: var(--accent); }
  .mock-item .tg:not(.on) { background: #f1efe8; color: #5f5e5a; border-color: #dcd7cb; }
  .mock-item .tg:not(.on):hover { border-color: var(--accent); color: var(--accent); }
  /* 「未保存」草稿标记：暖色，和已落库的规则区分开 */
  .mock-item .draft-tag {
    flex: none; font-size: 10px; line-height: 1.5; padding: 1px 6px; border-radius: 4px;
    background: #fbf1e2; border: 1px solid #ecd9bb; color: var(--warn); font-weight: 600;
  }
  /* 删除：比开/关更大更红（浅红底 + 深红描边），找不到或误点都是事故 */
  .mock-item .rm {
    flex: none; display: inline-flex; align-items: center; justify-content: center;
    min-width: 34px; height: 27px; padding: 0; border-radius: 6px; cursor: pointer;
    font-size: 17px; line-height: 1; font-weight: 700;
    background: #fdecea; border: 1px solid #e0a49d; color: var(--err);
  }
  .mock-item .rm:hover { background: var(--err); border-color: var(--err); color: #fff; }
  /* ── 项目导航（C14 / ADR-033）已撤出 Mock 模式：Mock 是纯私有工作台，
     项目（含共享模板）的管理与预览统一在「模板」模式。── */
  .mini-btn { flex: none; font-size: 11px; padding: 2px 8px; border-radius: 5px; }

  /* ── 模板模式（C14）：私有 / 共享两 tab，只列项目 item ── */
  .tpl-wrap { flex: 1; overflow: auto; display: flex; justify-content: center; padding: 28px 16px; }
  .tpl-panel { width: 100%; max-width: 860px; }
  .tpl-tabs { display: flex; border-bottom: 1px solid var(--border); }
  .tpl-tab { border: none; background: none; padding: 8px 18px; font-size: 13px; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; }
  .tpl-tab:hover { color: var(--accent); }
  .tpl-tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  .tpl-head { display: flex; align-items: center; gap: 8px; margin: 14px 0 0; font-size: 12px; color: var(--muted); }
  .tpl-head .grow { flex: 1; }
  /* 项目按网格排布：卡片等宽、列数自适应；新建入口是网格里的最后一项（一个大号「+」） */
  .tpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; margin-top: 12px; }
  .tpl-item {
    display: flex; flex-direction: column; gap: 8px; padding: 12px 13px; min-height: 86px;
    border: 1px solid var(--border); border-radius: 10px; background: var(--panel);
    cursor: pointer; text-align: left; font: inherit; color: inherit;
  }
  .tpl-item:hover { border-color: var(--accent); box-shadow: 0 2px 10px rgba(15, 110, 86, .08); }
  .tpl-item .ttl { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .tpl-item .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 600; }
  .tpl-item .nm.off { color: var(--muted); text-decoration: line-through; font-weight: 500; }
  .tpl-item .foot { display: flex; align-items: center; gap: 6px; margin-top: auto; flex-wrap: wrap; row-gap: 6px; }
  .tpl-item .foot .meta { flex: 1; font-size: 11px; color: var(--muted); }
  .tpl-item .ro { flex: none; font-size: 10px; padding: 1px 5px; border-radius: 4px; background: #f1efe8; color: var(--muted); border: 1px solid #dcd7cb; }
  /* 待删除：和「已归档」必须一眼分开——一个是长期保留，一个有倒计时 */
  .tpl-item .ro.warn, .ro.warn { background: #fdecea; border-color: #e0a49d; color: var(--err); }
  .tpl-item.pending { border-style: dashed; }
  /* 删除确认态：整张卡换底色，避免「已经点了删除」和「只是打开了这张卡」长得一样 */
  .confirm-card { border-color: #e0a49d; background: #fdf7f6; }
  .tpl-new { align-items: center; justify-content: center; border-style: dashed; background: transparent; color: var(--muted); font-size: 28px; font-weight: 300; line-height: 1; }
  .tpl-new:hover { border-style: solid; border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .tpl-note { margin-top: 12px; font-size: 11px; color: var(--muted); line-height: 1.6; }
  .mock-item .l2.proj { opacity: .85; }
  /* 项目卡（编辑器上方的作用域条）：写哪 / 读哪必须一眼分清 */
  .scope-card { display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
  .scope-card .sc-main { flex: 1; min-width: 200px; }
  .scope-card .sc-title { font-size: 14px; font-weight: 600; }
  .scope-card .sc-sub { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .scope-card .sc-acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .hist-item { border-bottom: 1px solid #f1f2f4; padding: 7px 2px; font-size: 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .hist-item .op { font-weight: 600; }
  .hist-item .meta { color: var(--muted); font-size: 11px; }
  /* ── 多返回值：命中方式 + 可拖动排序的返回值列表 ── */
  .pick-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: 12px; margin: 2px 0 6px; }
  .pick-row label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
  .pick-row select { padding: 2px 6px; font-size: 12px; }
  .resp-list { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .resp-item {
    display: flex; align-items: center; gap: 8px; padding: 6px 8px; background: var(--panel);
    border-bottom: 1px solid #f1f2f4; font-size: 12px; cursor: pointer; user-select: none;
  }
  .resp-item:last-child { border-bottom: none; }
  .resp-item:hover { background: var(--bg); }
  .resp-item.active { background: var(--accent-soft); }
  .resp-item.dragging { opacity: .45; }
  .resp-item.drop-before { box-shadow: inset 0 2px 0 var(--accent); }
  .resp-item.drop-after { box-shadow: inset 0 -2px 0 var(--accent); }
  .resp-item .drag { flex: none; color: var(--muted); cursor: grab; letter-spacing: -2px; }
  .resp-item .idx { flex: none; width: 20px; text-align: center; font-weight: 600; color: var(--muted); }
  .resp-item .st { flex: none; font-weight: 600; }
  .resp-item .ct, .resp-item .nm {
    flex: none; max-width: 150px; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; font-size: 11px; color: var(--muted);
  }
  .resp-item .nm { color: var(--accent); }
  .resp-item .pv {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 11px; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .resp-item .racts { flex: none; display: flex; align-items: center; gap: 4px; opacity: .55; }
  .resp-item:hover .racts, .resp-item.active .racts { opacity: 1; }
  .resp-item .racts button { padding: 3px 9px; font-size: 12px; }
  .resp-item .racts .rm {
    padding: 3px 11px; font-size: 14px; line-height: 1.2; font-weight: 700;
    background: #fdecea; border-color: #e0a49d; color: var(--err);
  }
  .resp-item .racts .rm:hover { background: var(--err); border-color: var(--err); color: #fff; }
  .resp-edit { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--border); }
  .resp-edit .sec-head { margin-top: 12px; }
  .acts { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
  /* 删除/丢弃草稿：比同排的保存、复制更大更红，是这一排里最醒目的动作 */
  .acts button.danger { padding: 6px 18px; font-size: 14px; font-weight: 600; }
  .grid3 { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 6px 10px; align-items: center; font-size: 12px; margin-top: 10px; }
  .grid3 label { font-size: 11px; color: var(--muted); font-family: ui-monospace, Menlo, monospace; }
  /* 匹配条件（method / host / path，ADR-026）：只读，压成一行显示。
     刻意不做成输入框——它不是给人填的，做成框只会让人去点、去改；值仍可选中复制。 */
  .match-line {
    display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 9px; word-break: break-all; user-select: text;
  }
  .match-line .sep { color: var(--muted); }
  .match-line .none { color: var(--muted); }
  /* 入参：全部排在一行里（不够宽自动换行），每个是「勾选 键 = 值」的小块 */
  .params-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .pchip {
    display: inline-flex; align-items: center; gap: 3px; flex: none;
    border: 1px solid var(--border); border-radius: 6px; padding: 2px 6px; background: var(--panel);
  }
  .pchip.on { border-color: var(--accent); background: var(--accent-soft); }
  .pchip input[type=text] {
    border: none; background: transparent; padding: 2px 1px; font-size: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; border-radius: 0;
    color: var(--text);
  }
  .pchip input[type=text]:focus { border: none; outline: none; }
  .pchip .pp-k { width: 84px; font-weight: 600; }
  .pchip .pp-v { width: 120px; }
  .pchip .eq { color: var(--muted); font-size: 11px; }
  /* 匹配/忽略状态：可点的小胶囊，绿色=参与匹配，灰=忽略 */
  .pchip .pp-st {
    font-size: 11px; line-height: 1; padding: 3px 7px; border-radius: 999px;
    cursor: pointer; user-select: none; white-space: nowrap;
    background: var(--border); color: var(--muted);
  }
  .pchip .pp-st.on { background: var(--accent); color: #fff; }
  .pchip .pp-st:hover { filter: brightness(1.08); }
  .pchip.add { border-style: dashed; color: var(--muted); cursor: pointer; font-size: 11px; }
  .pchip.add:hover { border-color: var(--accent); color: var(--accent); }
  .hint { font-size: 11px; color: var(--muted); }
  .note {
    font-size: 12px; padding: 7px 10px; border-radius: 8px; margin-bottom: 12px;
    background: #fdf6e3; color: #854f0b; border: 1px solid #f2e2b8;
  }
  textarea.editor-body {
    width: 100%; min-height: 200px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px; line-height: 1.55; border: 1px solid var(--border); border-radius: 8px;
    padding: 10px; resize: vertical; color: var(--text); background: var(--panel);
  }
  .inline-inputs { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 12px; }
  .inline-inputs input[type=text] { width: auto; flex: none; }
  textarea.mock-body-editor { height: 360px; min-height: 260px; max-height: 60vh; resize: vertical; }

  /* ── CLI 登录接力确认框（ADR-029）──
     这是「把会话交给本机 CLI」的唯一出口：没有这个确认框，任何一个本地进程
     诱导用户打开带端口的链接就能静默拿走会话 token，所以它不能省、也不能默认同意。 */
  .cli-consent {
    position: fixed; inset: 0; z-index: 90; display: flex; align-items: center; justify-content: center;
    background: rgba(15, 23, 42, .45); padding: 24px;
  }
  .cli-consent.hidden { display: none; }
  .cli-consent-box {
    width: min(480px, 100%); background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; box-shadow: 0 18px 48px rgba(15, 23, 42, .28); padding: 16px;
  }
  .cli-consent-box h2 { font-size: 14px; margin: 0 0 4px; }
  .cli-consent-box .sub { font-size: 12px; color: var(--muted); margin: 0 0 12px; }
  .cli-consent-box dl { margin: 0 0 12px; font-size: 12px; }
  .cli-consent-box dt { color: var(--muted); }
  .cli-consent-box dd { margin: 0 0 6px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
  .cli-consent-tools { display: flex; gap: 8px; justify-content: flex-end; }
  .cli-consent-msg { font-size: 12px; color: var(--muted); margin-top: 10px; min-height: 16px; }

  /* ── 返回值放大查看（树形查看器）── */
  .modal {
    position: fixed; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center;
    background: rgba(15, 23, 42, .45); padding: 24px;
  }
  .modal.hidden { display: none; }
  .modal-box {
    width: min(1100px, 100%); height: min(760px, 100%); display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
    box-shadow: 0 18px 48px rgba(15, 23, 42, .28);
  }
  .modal-head {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 14px; border-bottom: 1px solid var(--border);
  }
  .modal-title {
    flex: 1; min-width: 0; font-size: 13px; font-weight: 600; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .modal-tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .modal-tools button { padding: 2px 9px; font-size: 11px; }
  .modal-tools button.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .modal-close {
    flex: none; border: none; background: transparent; color: var(--muted);
    font-size: 20px; line-height: 1; padding: 0 4px; cursor: pointer;
  }
  .modal-close:hover { color: var(--err); }
  .modal-hint { padding: 6px 14px; font-size: 11px; color: var(--muted); border-bottom: 1px solid #f1f2f4; }
  /* 编辑态：弹框里直接改返回值原文（换行/缩进原样保留） */
  .modal-editor {
    flex: 1; min-height: 0; width: 100%; border: none; border-radius: 0; resize: none;
    padding: 12px 14px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px; line-height: 1.6; color: var(--text); background: var(--panel); outline: none;
  }
  .modal-editor.hidden { display: none; }
  .jtree-wrap { flex: 1; min-height: 0; display: flex; }
  .jtree-wrap.hidden { display: none; }
  .jtree {
    flex: 1; min-width: 0; overflow: auto; padding: 10px 14px 24px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; line-height: 18px;
  }
  /* ── 缩略图：整棵树压成一条竖条，框出当前可见范围（超长时才出现）── */
  .jminimap {
    flex: none; position: relative; width: 16px; margin: 0 8px 0 0; overflow: hidden;
    border-radius: 4px; background: var(--bg); cursor: pointer; user-select: none;
  }
  .jminimap.hidden { display: none; }
  .jminimap canvas { display: block; width: 100%; height: 100%; }
  .jminimap .jm-view {
    position: absolute; left: 0; right: 0; top: 0; height: 20px; pointer-events: none;
    background: rgba(15, 110, 86, .16); border: 1px solid rgba(15, 110, 86, .55); border-radius: 3px;
  }
  /* white-space:pre + 真实空格缩进 —— 选中复制出来就是标准 JSON 的缩进。
     ⚠️ 这里必须用 display:block 而不是 flex：flex 会把每个 span 变成块级盒，
     浏览器复制时会在每个 span 之间插换行（`"code"\n: \n0`），虽然还能 parse 但粘贴出来是烂的。
     caret 用 inline-block 保持行内，才不会产生换行。 */
  .jtree .trow { display: block; white-space: pre; border-radius: 4px; }
  .jtree .trow:hover { background: var(--bg); }
  .jtree .tind { display: inline; }
  /* caret 的字符用伪元素生成：伪元素不进选区、不进剪贴板，所以「选中一段复制」拿到的仍是干净 JSON。
     inline-block 是为了撑出固定 14px 的竖槽，同时保持行内（block 会产生换行） */
  .jtree .tcaret {
    display: inline-block; width: 14px; text-align: center;
    color: var(--muted); cursor: pointer; user-select: none;
  }
  .jtree .tcaret::before { content: '▾'; }
  .jtree .tcaret.closed::before { content: '▸'; }
  .jtree .tcaret:hover { color: var(--accent); }
  /* 注意：这里不能用 .empty —— 会撞上全局的 `.empty { padding: 40px }`（空状态占位） */
  .jtree .tcaret.leaf { cursor: default; }
  .jtree .tcaret.leaf::before { content: ''; }
  .jtree .tcaret.leaf:hover { color: var(--muted); }
  .jtree .tk { color: #2b6cb0; }
  .jtree .tp, .jtree .tb { color: var(--muted); }
  .jtree .tmore { color: var(--muted); font-size: 11px; }
  .jtree .ts { color: #9a5b00; }
  .jtree .tn { color: #1d4ed8; }
  .jtree .tbool { color: #a32d2d; }
  .jtree .tnull { color: var(--muted); }
  .jtree .traw { white-space: pre-wrap; word-break: break-all; }
  /* 层级编辑：值/键可点击改成输入框；悬停虚线下划线提示可编辑 */
  .jtree [data-edit] { cursor: text; border-bottom: 1px dashed transparent; }
  .jtree [data-edit]:hover { border-bottom-color: var(--accent); }
  .jtree .jted {
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    border: 1px solid var(--accent); border-radius: 3px; padding: 0 3px;
    background: var(--panel); color: var(--text); min-width: 48px; width: 70%; max-width: 320px;
  }
  #toast {
    position: fixed; left: 50%; top: 56px; transform: translateX(-50%);
    background: #1f2937; color: #fff; font-size: 12px; padding: 8px 16px; border-radius: 8px;
    z-index: 90; opacity: 0; pointer-events: none; transition: opacity .18s;
  }
  #toast.show { opacity: .94; }
  /* ── 项目动作的二次确认弹框（开关 / 删除共用）──
     为什么不用 window.confirm（ADR-037 的老理由仍然成立）：局域网远程操作时它常被浏览器
     策略拦掉，拦掉就等于「点了没反应」；也渲染不了「连带删几条规则」这种需要加粗的行。 */
  .ec-modal {
    position: fixed; inset: 0; z-index: 120; display: flex; align-items: center; justify-content: center;
    padding: 16px; background: rgba(15,23,42,.36);
  }
  .ec-modal.hidden { display: none; }
  .ec-modal-box {
    width: 430px; max-width: 100%; background: var(--panel); border-radius: 12px;
    padding: 18px 20px 16px; box-shadow: 0 18px 48px rgba(15,23,42,.24);
  }
  .ec-modal-title { font-size: 15px; font-weight: 600; line-height: 1.5; }
  .ec-modal-body { margin-top: 8px; font-size: 13px; line-height: 1.75; color: var(--muted); }
  .ec-modal-body b { color: var(--text); font-weight: 600; }
  .ec-modal-body .danger { color: var(--err); }
  .ec-modal-body p { margin: 0 0 6px; }
  .ec-modal-body p:last-child { margin-bottom: 0; }
  .ec-modal-acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
</style>
</head>
<body>

<header class="topbar" id="app-top" style="display:none">
  <div class="tb-left">
    <div class="brand">EasyCharles <span class="ver" id="ver"></span></div>
    <div class="modeswitch" id="mode-switch">
      <button class="ms-btn active" data-mode="browse" type="button">浏览</button>
      <button class="ms-btn" data-mode="mock" type="button">Mock</button>
      <button class="ms-btn" data-mode="tpl" type="button">模板</button>
    </div>
    <div class="conn" id="conn"></div>
  </div>
  <div class="device-picker" id="device-picker">
    <button class="dp-trigger" id="dp-trigger" type="button" title="选择设备；点击未绑定设备即可绑定">
      <span class="dot off" id="dp-dot"></span>
      <span class="dp-label" id="dp-label">全部设备</span>
      <span class="caret">▾</span>
    </button>
    <div class="dp-panel hidden" id="dp-panel"></div>
  </div>
  <div class="tb-right">
    <div class="stats"><span class="dot off" id="wsd"></span><span id="stats"></span></div>
    <span class="stats" id="who"></span>
    <button id="btn-about" title="架构原理与客户端接入">关于</button>
    <button id="btn-logout">退出</button>
  </div>
</header>

<div id="login-view">
  <div class="login-card">
    <h1>EasyCharles 控制台</h1>
    <p class="desc">登录后进入你的用户空间，绑定设备查看记录</p>
    <label for="in-phone">手机号（首次登录自动注册）</label>
    <input type="text" id="in-phone" placeholder="例如 13800138000" autocomplete="off">
    <label for="in-pw">登录口令</label>
    <input type="password" id="in-pw" placeholder="登录口令">
    <div class="err" id="login-err"></div>
    <button class="primary" id="btn-login">登录 / 注册</button>
    <div class="pw-hint">默认口令 123456，服务端可用 --password 修改</div>

<script>
const $ = (id) => document.getElementById(id);
// 「全部私有项目」这个视图 id 不是真项目 id：g_ 前缀由服务端生成，不可能撞上
const ALL_PROJECTS = '__all_private__';
const state = {
  session: null, user: null, records: [], devices: [], filterDevice: null, query: '',
  selected: null, ws: null, info: null,
  // 模式与 mock（规则）——「浏览 / Mock」是纯前端视图状态，不进协议；
  // mock 是否生效只由每条规则的 enabled 决定（ADR-016）
  mode: 'browse', rules: [], mockDraft: null,
  tplTab: 'private',   // 模板模式当前 tab：'private' | 'shared'（纯前端视图状态）
  // ── 项目（C14 / ADR-033）──
  projects: [],        // GET /groups 的 GroupView[]：含 private（只我自己的）与 shared（全部）
  allRules: [],        // GET /rules 的全部私有规则：跨项目查「这条接口有没有规则」要靠它
  projectId: null,     // 当前工作项目（ALL_PROJECTS 或某个 private id）——写入口只认它
  sharedId: null,      // 正在预览的共享项目 id（只读面板），不影响 projectId
  sharedRules: [],     // 该共享项目的规则（只读展示用；写只能经 copy → 编辑 → share）
  versions: [],        // 共享项目历史（GET /groups/:id/versions）
  versionDetail: null, // 历史版本预览（含该版规则，只读）
  busy: false,         // 项目级写操作（copy/share/rollback）进行中，防连点重复提交
};

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// ── 会话与 API ──
function apiFetch(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({}, opts.headers || {},
    state.session ? { 'X-EC-Session': state.session } : {});
  return fetch(path, opts).then((res) => {
    if (res.status === 401 && state.session) {
      // 会话失效 → 回登录页
      state.session = null; state.user = null;
      localStorage.removeItem('ec_session');
      showLogin();
    }
    return res;
  });
}

function showLogin() {
  $('login-view').style.display = 'flex';
  $('app-main').style.display = 'none';
  $('mock-main').style.display = 'none';
  $('app-top').style.display = 'none';
  dpOpen = false; $('dp-panel').classList.add('hidden');
  if (state.ws) { try { state.ws.close(); } catch (e) {} state.ws = null; }
  // 项目与规则是整个会话的上下文：不清掉就会在下一个登录用户（可能是另一台机器上的另一个空间）
  // 的界面上短暂显示上一个空间的项目名与规则内容
  Object.assign(state, {
    projects: [], allRules: [], rules: [], mockDraft: null,
    projectId: null, sharedId: null, sharedRules: [], versions: [], versionDetail: null, busy: false,
  });
  closeConfirm();
  try { localStorage.removeItem('ec_project'); } catch (e) {}
}

function showApp() {
  $('login-view').style.display = 'none';
  $('app-main').style.display = 'flex';
  $('app-top').style.display = 'grid';
  $('who').textContent = '空间：' + (state.user ? state.user.phone : '');
}

async function doLogin() {
  const phone = $('in-phone').value.trim();
  const password = $('in-pw').value;
  $('login-err').textContent = '';
  if (!phone) { $('login-err').textContent = '请输入手机号'; return; }
  const res = await fetch('/__ec/api/login', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ phone, password }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { $('login-err').textContent = data.message || '登录失败（HTTP ' + res.status + '）'; return; }
  state.session = data.session;
  state.user = data.user;
  localStorage.setItem('ec_session', data.session);
  boot();
}

async function boot() {
  if (!state.session) { showLogin(); return; }
  // 恢复会话；新登录默认不绑定也不筛选设备
  const me = await apiFetch('/__ec/api/me');
  if (!me.ok) { showLogin(); return; }
  state.user = (await me.json()).user;
  showApp();
  // 有 CLI 在等会话（地址里带 #cli-login）→ 现在就问用户要不要给（ADR-029）
  maybeOfferCliLogin();
  state.filterDevice = null;
  renderPicker();
  loadInfo(); loadDevices(); loadAll(); connectWs(); renderList(); renderDetail(); updateStats();
  // Mock 侧要先拉项目表：规则列表按项目切片、写入口要 groupId，两样都靠它（C14）
  void loadProjects().then(() => loadRules());
  // 恢复上次的模式与模板 tab（纯前端视图状态）
  const savedTab = localStorage.getItem('ec_tpl_tab');
  if (savedTab === 'shared' || savedTab === 'private') state.tplTab = savedTab;
  setMode(localStorage.getItem('ec_mode') || 'browse');
}

// ── 设备下拉（顶部中间）──
let dpOpen = false;

function deviceLabel(d) {
  const brand = d.brand || d.manufacturer || '';
  // 非 SDK 客户端（兼容层）只有 displayName/deviceName，回退避免列表显示空名
  const model = d.marketName || d.model || d.displayName || d.deviceName || '';
  const os = d.os ? d.os + (d.osVersion ? ' ' + d.osVersion : '') : '';
  const user = d.userName || d.userId || '';
  const label = [brand, model].filter(Boolean).join(' ') + (os ? ' · ' + os : '') + (user ? ' · ' + user : '');
  return label || d.deviceId || '未知设备';
}

function myPhone() { return state.user ? state.user.phone : null; }

function currentDevice() {
  return state.filterDevice ? state.devices.find((d) => d.deviceId === state.filterDevice) || null : null;
}

function setPickerOpen(open) { dpOpen = open; renderPicker(); }

function renderPicker() {
  const dev = currentDevice();
  $('dp-dot').className = 'dot ' + (dev ? (dev.online ? 'on' : 'off') : 'off');
  $('dp-label').textContent = dev ? deviceLabel(dev) : '全部设备';
  $('dp-trigger').classList.toggle('open', dpOpen);
  const panel = $('dp-panel');
  panel.classList.toggle('hidden', !dpOpen);
  if (!dpOpen) { panel.innerHTML = ''; return; }

  const phone = myPhone();
  const rows = state.devices.map((d) => {
    const mine = d.owner === phone;
    const free = d.owner === null || d.owner === undefined;
    const tag = mine ? '<span class="tag">我的</span>'
      : free ? '<span class="tag">未绑定</span>'
      : '<span class="tag other">已绑定 ' + esc(d.owner) + '</span>';
    const btn = mine ? '<button class="danger" data-act="unbind">解绑</button>'
      : '';
    const hint = free ? '<span class="sub">点击选择并绑定</span>' : '';
    return '<div class="dp-item' + (state.filterDevice === d.deviceId ? ' active' : '') +
      (!mine && !free ? ' unavailable' : '') + '" data-did="' + esc(d.deviceId) + '">' +
      '<span class="dot ' + (d.online ? 'on' : 'off') + '"></span>' +
      '<span class="name">' + esc(deviceLabel(d)) + '</span>' +
      tag + hint + btn + '</div>';
  }).join('');

  panel.innerHTML =
    '<div class="dp-item' + (state.filterDevice ? '' : ' active') + '" data-all="1">' +
      '<span class="dot off"></span><span class="name">全部设备</span>' +
      '<span class="sub">不筛选</span></div>' +
    '<div class="dp-sep"></div>' +
    (state.devices.length ? rows
      : '<div class="dp-empty">等待设备连接…（App 开 Mock 后出现）</div>');

  panel.querySelectorAll('.dp-item').forEach((n) => {
    n.onclick = (ev) => {
      ev.stopPropagation(); // 面板内点击由本处理器决定开合，避免被"点击外部关闭"误判
      // ① 全部设备：清除筛选
      if (n.dataset.all) { state.filterDevice = null; setPickerOpen(false); renderList(); return; }
      const did = n.dataset.did;
      const btn = ev.target.closest('button');
      // ② 解绑：保持面板打开，原地刷新
      if (btn) {
        const act = btn.dataset.act;
        void (async () => {
          await apiFetch('/__ec/api/devices/' + encodeURIComponent(did) + '/' + act, { method: 'POST' });
          await refreshUserAndDevices();
        })();
        return;
      }
      const device = state.devices.find((d) => d.deviceId === did);
      if (!device) return;
      if (device.owner !== phone && device.owner !== null && device.owner !== undefined) {
        toast('该设备已绑定到其他空间');
        return;
      }
      void (async () => {
        if (device.owner !== phone) {
          const res = await apiFetch('/__ec/api/devices/' + encodeURIComponent(did) + '/bind', { method: 'POST' });
          if (!res.ok || !(await res.json()).ok) {
            toast('绑定失败，请重试');
            return;
          }
        }
        state.filterDevice = did;
        await refreshUserAndDevices();
        setPickerOpen(false);
      })();
    };
  });
}

async function refreshUserAndDevices() {
  const me = await apiFetch('/__ec/api/me');
  if (me.ok) state.user = (await me.json()).user;
  await loadDevices();
  await loadAll();
  renderPicker(); renderList();
}

// ── 记录 ──
// 通用参数清单（来源：某个接入 App 的拦截器实测，已脱敏）
//  · HttpUtils.getBaseRequestParams          业务固定参数：sid / tid / ref_tid
//  · HttpAddParamsSignInterceptor            签名链追加：timestamp / noncestr / sign（签名 key 发出前已移除）
//  · HttpUtils.legacyBaseRequestParams       老接口固定参数：ac / mc / u / vs / vc / hardName / bv / deviceName
// 只用于「业务参数 / 通用参数」分组，不是白名单：未列出的键一律按业务参数展示。
const COMMON_PARAMS = new Set([
  'sid', 'tid', 'ref_tid', 'timestamp', 'noncestr', 'sign', 'appsignkey',
  'ac', 'mc', 'u', 'vs', 'vc', 'hardname', 'bv', 'devicename',
]);
function isCommonParam(k) { return COMMON_PARAMS.has(String(k).toLowerCase()); }

function tryJson(text) {
  const s = String(text || '').trim();
  if (!s || (s[0] !== '{' && s[0] !== '[')) return null;
  try { return JSON.parse(s); } catch (e) { return null; }
}

/** 请求参数 = query + body（JSON / urlencoded），同名以 body 为准，再按业务/通用分组 */
function requestParams(r) {
  const req = r.request || {};
  const map = new Map();
  let q = req.query;
  if (!q || !Object.keys(q).length) {
    q = {};
    try { new URL(req.url).searchParams.forEach((v, k) => { q[k] = v; }); } catch (e) {}
  }
  // query 解密（ADR-039）：密文参数那段已经解成若干项，就把密文那一行换成明文各项，
  // 不再并排显示 —— 否则看起来像「发了两次」。
  const qp = req.queryPlain && typeof req.queryPlain === 'object' ? req.queryPlain : null;
  const cipherField = ((r.crypto || {}).query || {}).field || '';
  Object.keys(q).forEach((k) => {
    if (qp && k === cipherField) return;
    map.set(k, { k, v: String(q[k]), src: 'query' });
  });
  if (qp) Object.keys(qp).forEach((k) => map.set(k, { k, v: String(qp[k]), src: 'dec' }));

  const raw = req.body || '';
  const ct = String((req.headers || {})['content-type'] || '').toLowerCase();
  const json = raw ? tryJson(raw) : null;
  if (json && typeof json === 'object' && !Array.isArray(json)) {
    Object.keys(json).forEach((k) => {
      const v = json[k];
      map.set(k, { k, v: v !== null && typeof v === 'object' ? JSON.stringify(v) : String(v), src: 'body' });
    });
  } else if (raw && /urlencoded/i.test(ct)) {
    try { new URLSearchParams(raw).forEach((v, k) => map.set(k, { k, v, src: 'body' })); } catch (e) {}
  }

  const all = [...map.values()];
  return { biz: all.filter((p) => !isCommonParam(p.k)), common: all.filter((p) => isCommonParam(p.k)) };
}

/** JSON 高亮：先切 token 再逐个转义，避免 esc 破坏引号匹配 */
function jsonHighlight(raw) {
  const re = /("(?:\\u[0-9a-fA-F]{4}|\\[^u]|[^\\"])*")(\s*:)?|\b(true|false|null)\b|(-?\d+(?:\.\d+)?(?:[eE][+\-]?\d+)?)/g;
  let out = '', last = 0, m;
  while ((m = re.exec(raw))) {
    out += esc(raw.slice(last, m.index));
    if (m[1] !== undefined) {
      out += '<span class="' + (m[2] ? 'j-key' : 'j-str') + '">' + esc(m[1]) + '</span>' + esc(m[2] || '');
    } else if (m[3] !== undefined) {
      out += '<span class="j-bool">' + m[3] + '</span>';
    } else {
      out += '<span class="j-num">' + m[4] + '</span>';
    }
    last = m.index + m[0].length;
  }
  return out + esc(raw.slice(last));
}

function bodyBlock(body, encoding, truncated) {
  if (!body) return '<div class="meta">（无 body）</div>';
  const note = truncated ? '（已截断 / 采样）' : '';
  if (encoding === 'base64') {
    return '<div class="meta">二进制内容（base64' + note + '）</div><pre class="body">' + esc(body.slice(0, 4000)) + '</pre>';
  }
  const json = tryJson(body);
  if (json === null) return '<pre class="body">' + esc(body) + '</pre>';
  return '<pre class="body">' + jsonHighlight(JSON.stringify(json, null, 2)) + '</pre>';
}

function bytesLabel(n) {
  if (!n) return '0 B';
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1048576).toFixed(2) + ' MB';
}

function kvTable(map) {
  const keys = Object.keys(map || {});
  if (!keys.length) return '<div class="meta">无</div>';
  return '<table class="kv">' + keys.map((k) =>
    '<tr><td>' + esc(k) + '</td><td>' + esc(map[k]) + '</td></tr>').join('') + '</table>';
}

function paramsTable(list) {
  if (!list.length) return '<div class="meta">（无业务参数）</div>';
  return '<table class="kv">' + list.map((p) =>
    '<tr><td>' + esc(p.k) + '</td><td>' + esc(p.v) +
    (p.src === 'body' ? ' <span class="src">body</span>' : '') +
    (p.src === 'dec' ? ' <span class="src">已解密</span>' : '') + '</td></tr>').join('') + '</table>';
}

function statusClass(st) { return 's' + String(st)[0]; }

/** 列表只显示 path（不含 query）——参数一律去详情页看 */
function shortPath(r) {
  const req = r.request || {};
  if (req.path) return req.path;
  try { return new URL(req.url).pathname; } catch (e) { return req.url || ''; }
}

/** 接口标识：域名 + path（不含 query），用于详情页 */
function ifaceLabel(r) {
  const req = r.request || {};
  const host = String(req.host || '');
  const path = String(req.path || '');
  if (host || path) return host + path;
  try { const u = new URL(req.url); return u.host + u.pathname; } catch (e) { return String(req.url || ''); }
}

function clipText(s, n) { s = String(s); return s.length > n ? s.slice(0, n) + '…' : s; }

/** 一行式参数摘要：k=v · k=v（通用参数不显示；超量折叠成 +N 项） */
function bizParamLine(r, cap, valMax) {
  const n = cap || 8, vm = valMax || 40;
  let ps;
  try { ps = requestParams(r).biz; } catch (e) { return ''; }
  if (!ps.length) return '';
  const parts = ps.slice(0, n).map((p) => p.k + '=' + clipText(p.v, vm));
  if (ps.length > n) parts.push('+' + (ps.length - n) + ' 项');
  return parts.join(' · ');
}

function visible() {
  let out = state.records;
  if (state.filterDevice) out = out.filter((r) => r.deviceId === state.filterDevice);
  if (state.query) {
    const q = state.query.toLowerCase();
    out = out.filter((r) => (r.request.url || '').toLowerCase().includes(q) || String(r.response.status).includes(q));
  }
  return out;
}

function renderList() {
  const el = $('list');
  const rows = visible().slice(0, 500);
  $('btn-clear').disabled = rows.length === 0;
  if (!rows.length) {
    const selectedDevice = state.devices.find((d) => d.deviceId === state.filterDevice);
    const needsBinding = (selectedDevice && selectedDevice.owner !== myPhone())
      || !state.devices.some((d) => d.owner === myPhone());
    const hint = needsBinding
      ? '未绑定设备的请求不会显示；需要浏览时请先绑定一台设备'
      : '让 App 走一遍代理，记录会实时出现在这里';
    el.innerHTML = '<div class="empty">暂无请求<div class="hint" style="margin-top:6px">' +
      esc(hint) + '</div></div>';
    return;
  }
  el.innerHTML = rows.map((r) =>
    '<div class="row' + (state.selected === r.id ? ' active' : '') + '" data-id="' + esc(r.id) + '"' +
      ' title="' + esc(r.request.method + ' ' + (r.request.url || '')) + '">' +
      '<span class="m">' + esc(r.request.method) + '</span>' +
      '<span class="st ' + statusClass(r.response.status) + '">' + r.response.status + '</span>' +
      '<span class="p">' + esc(shortPath(r)) + '</span>' +
      (r.flags.mocked ? '<span class="tag">mock</span>' : '') +
      (r.flags.decrypted ? '<span class="tag crypto">解密</span>' : '') +
      (r.flags.streamed ? '<span class="tag stream">流式</span>' : '') +
      '<span class="ms">' + r.durationMs + 'ms</span></div>'
  ).join('');
  // 行内不放操作按钮：动作统一收在右侧详情里（列表保持纯浏览）
  el.querySelectorAll('.row').forEach((n) => { n.onclick = () => select(n.dataset.id); });
}

/** 找到该记录的接口（method + host + path）已存在的 mock 规则；没有则 null。
 *  浏览页据此把「Mock 此接口」置灰：接口已 mock 就不再重复 mock（去 Mock 模式改现有规则）。
 *  ⚠️ 用**全量私有规则**而不是当前项目那几条：按项目切片之后只看本项目，
 *  同一个接口在另一个私有项目里已有规则却显示成「没 mock 过」，用户就会建出第二条
 *  （两条同接口的规则同时启用时，命中只按 priority 选一条，另一条是纯噪音）。 */
function findRuleForRecord(rec) {
  const req = isPlainObject(rec && rec.request) ? rec.request : {};
  const method = String(req.method || '').toUpperCase();
  const host = String(req.host || '');
  const path = String(req.path || '');
  const rules = Array.isArray(state.allRules) ? state.allRules : [];
  return rules.find((r) => {
    const m = isPlainObject(r && r.match) ? r.match : {};
    return String(m.method || '').toUpperCase() === method
      && String(m.host || '') === host
      && String(m.path || '') === path;
  }) || null;
}

/**
 * 返回值当前看的是明文还是密文（ADR-039）。
 * 详情区每次重绘都会重建 DOM，所以这个状态要在 renderDetail 里重置；
 * 「放大查看」读它，避免用户切到密文后弹框又变回明文。
 */
let respShowRaw = false;

function renderDetail() {
  const r = state.records.find((x) => x.id === state.selected);
  if (!r) {
    $('detail').innerHTML = '<div class="empty">选择左侧任意一条请求查看详情' +
      '<div class="hint" style="margin-top:6px">选中后，这里会出现「分享快照」——生成免登录只读链接</div></div>';
    return;
  }
  respShowRaw = false;

  const status = r.response.status;
  const flags = r.flags || {};
  const mockedRule = findRuleForRecord(r);   // 该接口已有 mock 规则 → 「Mock 此接口」置灰
  const params = requestParams(r);
  const reqHeaders = r.request.headers || {};
  const resHeaders = r.response.headers || {};

  const commonFold = params.common.length
    ? '<details class="fold"><summary>通用参数 (' + params.common.length + ')</summary>' +
      '<div class="fold-inner">' + paramsTable(params.common) +
      '<div class="meta" style="margin:8px 0 0">接入 App 的拦截器注入的固定参数与签名链，业务无关</div>' +
      '</div></details>'
    : '';

  // ── 加解密（ADR-039）──
  // body 已经是**明文**（服务端解密后写入），rawBody 是密文原文。
  // 展示顺序按用户的实际需要排：先给能读的明文，密文收在折叠区里备用。
  const reqRaw = typeof r.request.rawBody === 'string' ? r.request.rawBody : '';
  const respRaw = typeof r.response.rawBody === 'string' ? r.response.rawBody : '';
  const reqCryptoErr = (r.crypto && r.crypto.request && r.crypto.request.error) || '';
  const respCryptoErr = (r.crypto && r.crypto.response && r.crypto.response.error) || '';
  const reqQueryErr = (r.crypto && r.crypto.query && r.crypto.query.error) || '';

  const rawReqFold = reqRaw
    ? '<details class="fold" open><summary>请求 Body（解密后）</summary>' +
      '<div class="fold-inner">' + bodyBlock(r.request.body, r.request.bodyEncoding, r.request.bodyTruncated) + '</div></details>' +
      '<details class="fold"><summary>密文原文</summary>' +
      '<div class="fold-inner">' + bodyBlock(reqRaw, 'utf8', false) + '</div></details>'
    : r.request.body
      ? '<details class="fold"><summary>原始 Body' + (r.request.bodyTruncated ? '（已截断）' : '') + '</summary>' +
        '<div class="fold-inner">' + bodyBlock(r.request.body, r.request.bodyEncoding, false) + '</div></details>'
      : '';

  const respHint = (r.response.bodyEncoding === 'base64' ? 'base64' : 'JSON / text') +
    ' · ' + bytesLabel(r.response.bodySize) + (respRaw ? '（密文大小）' : '');

  // 顶部摘要用：一行式业务传参（返回值不放进摘要——下方「返回值」卡片紧接着就是全文）
  const bizLine = bizParamLine(r);

  $('detail').innerHTML =
    // ① 顶部摘要：一眼看清「哪个接口 / 传了什么」——返回值不放这儿，下面紧跟全文
    //    下面 ②③ 是完整版，上下内容重复是有意的
    '<div class="card">' +
      '<div class="status-line">' +
        '<span class="st code ' + statusClass(status) + '">' + status + '</span>' +
        '<span class="pill">' + r.durationMs + ' ms</span>' +
        '<span class="pill">上游 ' + r.upstream.ms + ' ms</span>' +
        (flags.mocked ? '<span class="tag">mock</span>' : '') +
        (flags.streamed ? '<span class="tag stream">流式</span>' : '') +
        (flags.decrypted ? '<span class="tag crypto">已解密</span>' : '') +
        (flags.redirected ? '<span class="tag other">重定向</span>' : '') +
        (r.upstream.error ? '<span class="tag other">' + esc(r.upstream.error) + '</span>' : '') +
      '</div>' +
      '<div class="acts">' +
        '<button class="primary" data-mock="1"' +
          (mockedRule ? ' disabled title="该接口已 mock，去 Mock 模式修改"' : '') +
          '>Mock 此接口</button>' +
        '<button data-snap="1">分享快照</button>' +
        '<span class="hint">' + (mockedRule
          ? '该接口已 mock，去 Mock 模式修改；分享快照：生成免登录只读链接'
          : 'Mock：立即建一条启用的规则并保存，进去可改返回值；分享快照：生成免登录只读链接') + '</span>' +
      '</div>' +
      '<div class="snap-result" style="display:none"></div>' +
      '<div class="summary">' +
        '<div class="srow"><div class="k">接口</div>' +
          '<div class="v mono" title="' + esc(r.request.url) + '">' +
            esc(r.request.method) + ' ' + esc(ifaceLabel(r)) + '</div></div>' +
        '<div class="srow"><div class="k">传参</div>' +
          '<div class="v mono">' + (bizLine ? esc(bizLine) : '<span class="hint">（无业务参数）</span>') + '</div></div>' +
      '</div>' +
    '</div>' +
    // ② 详细版：返回值（完整）
    '<div class="card">' +
      '<h2>返回值' + (respRaw ? ' <span class="pill">已解密</span>' : '') + '</h2>' +
      (respCryptoErr ? '<div class="crypto-note">解密未成功，下面是接口原始返回：' + esc(respCryptoErr) + '</div>' : '') +
      '<div class="sec-head" style="margin-bottom:6px"><span class="n">' + respHint + '</span>' +
        (r.response.body
          ? '<span class="sh-acts">' +
              (respRaw ? '<button data-crypto="resp" title="在解密后的明文与原始密文之间切换">查看密文</button>' : '') +
              '<button data-zoom="1" title="弹框放大查看，可按层级展开/收起">放大查看</button>' +
              '<button data-copy="resp">复制</button>' +
            '</span>'
          : '') +
      '</div>' +
      '<div data-view="plain">' + bodyBlock(r.response.body, r.response.bodyEncoding, r.response.bodyTruncated) + '</div>' +
      (respRaw
        ? '<div data-view="raw" style="display:none">' + bodyBlock(respRaw, 'utf8', false) + '</div>'
        : '') +
    '</div>' +
    // ③ 详细版：请求（完整 URL + 全部业务参数；通用参数与 Body 收进折叠区）
    '<div class="card">' +
      '<h2>请求 <span class="pill">' + esc(r.request.method) + '</span></h2>' +
      (reqCryptoErr ? '<div class="crypto-note">请求体解密未成功，下面显示的是原始内容：' + esc(reqCryptoErr) + '</div>' : '') +
      (reqQueryErr ? '<div class="crypto-note">query 里的密文参数解密未成功（URL 里仍是密文）：' + esc(reqQueryErr) + '</div>' : '') +
      '<div class="url">' + esc(r.request.url) + '</div>' +
      '<div class="sec"><div class="sec-head"><span class="t">业务参数</span>' +
        '<span class="n">' + params.biz.length + ' 项</span>' +
        (r.request.body ? '<button data-copy="req">复制 Body</button>' : '') +
      '</div>' +
      paramsTable(params.biz) + '</div>' +
      commonFold + rawReqFold +
    '</div>' +
    // ④ Headers 与链路信息：不变，垫到最后
    '<div class="card">' +
      '<h2>Headers 与链路</h2>' +
      '<div class="meta">' + esc(r.request.method) + ' · ' + esc(r.request.host) +
        ' · 设备 ' + esc(r.deviceId || '-') + ' · 上游协议 ' + esc(r.upstream.protocol) + '</div>' +
      '<details class="fold"><summary>请求 Headers (' + Object.keys(reqHeaders).length + ')</summary>' +
        '<div class="fold-inner">' + kvTable(reqHeaders) + '</div></details>' +
      '<details class="fold"><summary>响应 Headers (' + Object.keys(resHeaders).length + ')</summary>' +
        '<div class="fold-inner">' + kvTable(resHeaders) + '</div></details>' +
    '</div>';
}

function select(id) { state.selected = id; renderList(); renderDetail(); }

async function loadAll() {
  const res = await apiFetch('/__ec/api/records?limit=300');
  if (!res.ok) return;
  state.records = await res.json();
  renderList(); updateStats();
}

// 清空当前列表：只清「当前空间 ∩ 当前筛选」可见的记录（服务端按 owner + deviceId/q 同口径过滤）
async function clearVisible() {
  const doomed = new Set(visible().map((r) => r.id));
  if (!doomed.size) return;
  const qs = new URLSearchParams();
  if (state.filterDevice) qs.set('deviceId', state.filterDevice);
  if (state.query) qs.set('q', state.query);
  const suffix = qs.toString() ? '?' + qs.toString() : '';
  const res = await apiFetch('/__ec/api/records' + suffix, { method: 'DELETE' });
  if (!res.ok) return;
  // 本地同步移除同批 id；当前不可见的记录保持不动
  state.records = state.records.filter((r) => !doomed.has(r.id));
  if (state.selected && doomed.has(state.selected)) state.selected = null;
  renderList(); renderDetail(); updateStats();
}

async function loadDevices() {
  const res = await apiFetch('/__ec/api/devices');
  if (!res.ok) return;
  state.devices = await res.json();
  renderPicker();
}

async function loadInfo() {
  const res = await apiFetch('/__ec/api/info');
  if (!res.ok) return;
  const info = await res.json();
  state.info = info;
  $('ver').textContent = 'v' + info.serverVersion + ' · 协议 v' + info.protocol;
  const base = 'http://127.0.0.1:' + info.port;
  $('conn').textContent = '控制台 ' + base + (info.lanMode ? ' · LAN' : ' · 仅回环');
}

function updateStats() {
  $('stats').textContent = state.records.length + ' 条 · ' + state.devices.length + ' 台设备';
}

function connectWs() {
  const ws = new WebSocket('ws://' + location.host + '/__ec/ws');
  state.ws = ws;
  ws.onopen = () => {
    $('wsd').className = 'dot on';
    ws.send(JSON.stringify({ v: 2, type: 'subscribe', payload: { session: state.session } }));
  };
  ws.onclose = (ev) => {
    $('wsd').className = 'dot off';
    if (ev.code === 4001) {
      state.session = null; state.user = null;
      localStorage.removeItem('ec_session');
      showLogin();
      return;
    }
    if (state.session) setTimeout(connectWs, 2000);
  };
  ws.onerror = () => { try { ws.close(); } catch (e) {} };
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.type === 'record') {
      state.records.unshift(m.payload);
      if (state.records.length > 2000) state.records.pop();
      renderList();
    } else if (m.type === 'device') {
      const phone = myPhone();
      const before = state.devices.filter((d) => d.owner === phone).map((d) => d.deviceId).sort().join('\0');
      state.devices = Array.isArray(m.payload) ? m.payload : [];
      const after = state.devices.filter((d) => d.owner === phone).map((d) => d.deviceId).sort().join('\0');
      renderPicker();
      if (before !== after) void loadAll();
    }
    updateStats();
  };
}

// ── 模式切换：浏览 / Mock ──
// 「模式」是纯前端视图状态（存 localStorage），不进协议；
// mock 是否生效只由每条规则的 enabled 决定，避免出现第二个真值来源（ADR-016）。
function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 1900);
}

function setMode(mode) {
  state.mode = mode === 'mock' || mode === 'tpl' ? mode : 'browse';
  localStorage.setItem('ec_mode', state.mode);
  document.querySelectorAll('.ms-btn').forEach((b) => b.classList.toggle('active', b.dataset.mode === state.mode));
  $('app-main').style.display = state.mode === 'browse' ? 'flex' : 'none';
  $('mock-main').style.display = state.mode === 'mock' ? 'flex' : 'none';
  $('tpl-main').style.display = state.mode === 'tpl' ? 'flex' : 'none';
  // mock 规则对所有设备生效，Mock 模式下隐藏设备筛选，避免「以为只对某台设备生效」；
  // 模板模式看的是项目归属（按登录空间），也和设备无关，同样隐藏
  $('device-picker').style.display = state.mode === 'browse' ? '' : 'none';
  if (state.mode === 'mock') { renderMockList(); renderMockEditor(); }
  else if (state.mode === 'tpl') { renderTpl(); }
  else { renderList(); renderDetail(); }
}

function copyText(text, done) {
  const ok = () => { if (done) done(); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(ok, () => {});
    return;
  }
  const ta = document.createElement('textarea');
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); ok(); } catch (e) {}
  document.body.removeChild(ta);
}

// ── Mock 模式：规则列表 + 编辑器 ──
function isPlainObject(o) { return !!o && typeof o === 'object' && !Array.isArray(o); }

/**
 * 深拷贝一份「原样」用于保存时打底（无损，ADR-027）。
 * 拷不动就退回空对象——宁可退回空（相当于旧行为），也不能让保存按钮抛异常。
 */
function clonePlain(o) {
  if (!isPlainObject(o)) return {};
  try { return JSON.parse(JSON.stringify(o)); } catch (e) { return {}; }
}

/** 把服务端错误如实翻成人话：EC 码要露出来（它是「为什么被挡」的唯一线索），文案用 message */
function errTextFromBody(d, status) {
  d = d || {};
  const msg = String(d.message || (d.error && !isEcCode(d.error) ? d.error : '') || ('HTTP ' + status));
  return isEcCode(d.error) ? d.error + '：' + msg : msg;
}
async function apiErrText(res) {
  return errTextFromBody(await res.json().catch(() => ({})), res.status);
}
function isEcCode(x) { return typeof x === 'string' && /^EC_[A-Z_]+$/.test(x); }

/**
 * 拉**全部私有规则**（跨项目那一份，GET /rules 在 C14 后就是这个口径）。
 * 保留全量不是为了省一次请求：浏览模式的「这条接口有没有规则」必须跨项目判断
 * （`findRuleForRecord`），只看当前项目会让人在另一个项目里再建一条重复规则。
 */
async function loadRules() {
  const res = await apiFetch('/__ec/api/rules');
  if (!res.ok) return false;
  const data = await res.json();
  state.allRules = Array.isArray(data) ? data : [];
  syncScopedRules();
  renderMockList();
  renderDetail();   // 规则变化会改变「Mock 此接口」是否可用，详情区同步刷新
  return true;
}

/** 列表视图 = 全量私有规则按当前项目切片（不另发请求，避免两处真值） */
function syncScopedRules() {
  state.rules = rulesOfProject(state.allRules, state.projectId);
}

/** 项目表：private 只回自己的、shared 回全部（含归档），服务端已经过滤过 */
async function loadProjects() {
  const res = await apiFetch('/__ec/api/groups');
  if (!res.ok) { toast('项目列表加载失败：' + (await apiErrText(res))); return false; }
  const data = await res.json();
  state.projects = (Array.isArray(data) ? data : []).filter((p) => p && typeof p === 'object');
  // 选中项可能被另一个窗口删了：落回真实存在的项目，别让下一次保存打在虚空上
  let saved = state.projectId;
  if (!saved) { try { saved = localStorage.getItem('ec_project') || ''; } catch (e) { saved = ''; } }
  state.projectId = resolveProjectSelection(state.projects, saved);
  try { localStorage.setItem('ec_project', state.projectId || ''); } catch (e) {}
  if (state.sharedId && !projectById(state.projects, state.sharedId)) {
    state.sharedId = null; state.versions = []; state.versionDetail = null;
  }
  syncScopedRules();
  renderMockList(); renderMockEditor();
  renderTpl();   // 模板模式列表与项目数据同源，新建/改名/分享/删除都经这里刷新
  return true;
}

/** 选哪个项目当工作项目：先保上次选的，再退第一个私有项目，一个都没有就是「全部」（空视图） */
function resolveProjectSelection(projects, savedId) {
  const mine = privateProjects(projects).map((p) => p.id);
  if (savedId === ALL_PROJECTS) return ALL_PROJECTS;
  if (savedId && mine.indexOf(savedId) >= 0) return savedId;
  return mine.length ? mine[0] : ALL_PROJECTS;
}

/** 当前可写项目 id（没有私有项目 → null，调用方负责提示「先新建」） */
function writableProjectId() {
  const cur = projectById(state.projects, state.projectId);
  if (isWritableProject(cur)) return cur.id;
  const mine = privateProjects(state.projects);
  return mine.length ? mine[0].id : null;
}

async function refreshMockData() {
  await loadProjects();
  await loadRules();
}

// ── 项目写操作（全部走管理面单条接口；控制台不再碰「整表 PUT」）──

async function createProject(name) {
  const trimmed = String(name || '').trim();
  if (!trimmed) { toast('项目名不能为空'); return null; }
  const res = await apiFetch('/__ec/api/groups', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ group: { name: trimmed, enabled: true } }),
  });
  if (!res.ok) { toast('新建项目失败：' + (await apiErrText(res))); return null; }
  const data = await res.json();
  state.projectId = data.group && data.group.id ? data.group.id : state.projectId;
  await refreshMockData();
  toast('已新建项目「' + trimmed + '」');
  return data.group;
}

/**
 * 没有任何私有项目时自动补一个「默认项目」；已有项目就沿用之前的分组，什么都不建。
 * Mock 是纯私有工作台，不该让用户先去模板模式建项目才能保存第一条规则。
 * 返回可用项目 id（建不出来返回 null，调用方提示手动新建）。
 */
async function ensureDefaultProject() {
  const existing = writableProjectId();
  if (existing) return existing;
  const g = await createProject('默认项目');
  return (g && g.id) || writableProjectId();
}

async function renameProject(id, name) {
  const p = projectById(state.projects, id);
  if (!p) return;
  const trimmed = String(name || '').trim();
  if (!trimmed) { toast('项目名不能为空'); return; }
  // 只提交 name / enabled：scope、ownerPhone、createdBy、lineage… 是服务端字段，
  // 带上去是 400 EC_SCOPE_MISMATCH（协议 §4.7），不是「会被忽略」
  const res = await apiFetch('/__ec/api/groups/' + encodeURIComponent(id), {
    method: 'PUT', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ group: { name: trimmed, enabled: p.enabled !== false } }),
  });
  if (!res.ok) { toast('改名失败：' + (await apiErrText(res))); return; }
  await refreshMockData();
  toast('项目已改名');
}

async function toggleProject(id) {
  const p = projectById(state.projects, id);
  if (!p) return;
  const next = p.enabled === false;
  const res = await apiFetch('/__ec/api/groups/' + encodeURIComponent(id) + '/enabled', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ enabled: next }),
  });
  if (!res.ok) { toast('切换失败：' + (await apiErrText(res))); return; }
  const data = await res.json().catch(() => ({}));
  await refreshMockData();
  toast((next ? '已启用项目' : '已停用项目') +
    (Number.isFinite(data.affected) ? '，影响 ' + data.affected + ' 条规则' : ''));
}

/* ── 二次确认弹框（项目开关 / 删除共用）─────────────────────────────
 * 所有项目级的「会改变命中或不可逆」的动作都从这里走，不再各写一套两段式：
 * 弹框只负责问，真正的请求仍在 toggleProject / deleteProject / deleteSharedProject 里。
 * 好处是文案、防连点、Esc/点遮罩关闭只有一份实现。
 */
let confirmState = null;

function uiConfirm(opts) {
  if (!opts) return;
  confirmState = opts;
  $('ec-modal-title').textContent = opts.title || '确认操作';
  $('ec-modal-body').innerHTML = opts.bodyHTML || '';
  const ok = $('ec-modal-ok');
  ok.textContent = opts.okText || '确认';
  ok.className = opts.danger ? 'danger' : 'primary';
  ok.disabled = false;
  $('ec-modal').classList.remove('hidden');
  // 焦点给「取消」还是「确认」？危险操作默认落在取消上，回车不会误删
  (opts.danger ? $('ec-modal-cancel') : ok).focus();
}

function closeConfirm() {
  confirmState = null;
  const box = $('ec-modal');
  if (box) box.classList.add('hidden');
}

async function acceptConfirm() {
  const s = confirmState;
  if (!s) return;
  const ok = $('ec-modal-ok');
  if (ok.disabled) return;          // 防连点：删除 / 停用都不可重复发
  ok.disabled = true;
  try { await s.onOk(); } catch (e) { /* 回调内部已经 toast，这里只保证弹框能关掉 */ }
  closeConfirm();
}

function bindConfirmModal() {
  $('ec-modal-cancel').onclick = closeConfirm;
  $('ec-modal-ok').onclick = () => { void acceptConfirm(); };
  $('ec-modal').onclick = (ev) => { if (ev.target === $('ec-modal')) closeConfirm(); };
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape' && confirmState) closeConfirm();
  });
}

/**
 * 「开启/停用整组」的二次确认。
 * 停用只关**命中**，不改规则自己的 enabled（ADR-030）——这一点必须在弹框里说清楚，
 * 否则用户会以为点一下就把这组规则删了/关了，不敢点。
 */
function askToggleProject(id) {
  const p = projectById(state.projects, id);
  if (!p) return;
  const n = rulesOfProject(state.allRules, id).length;
  const off = p.enabled === false;
  uiConfirm({
    title: (off ? '启用' : '停用') + '项目「' + p.name + '」？',
    bodyHTML: off
      ? '<p>启用后，项目内 <b>' + n + '</b> 条规则恢复按各自的开关命中。</p>'
      : '<p>停用只影响<b>是否命中</b>：项目内 <b>' + n + '</b> 条规则一条都不会返回 mock。</p>' +
        '<p>规则本身、以及每条规则自己的开关都不改，重新启用即恢复原状。</p>',
    okText: off ? '启用' : '停用',
    danger: !off,
    onOk: () => toggleProject(id),
  });
}

/**
 * 「删除项目」的二次确认（ADR-037）。
 * - 私有：**立刻**级联删除（无归属的规则永不命中，所以不是「脱组保留」），没有回收站；
 * - 共享：软删除，进待删除倒计时，期间可恢复；到期才真删。
 * 倒计时的天数不在前端写死：服务端 `purgeAt` 才是唯一口径，删完由 toast / 列表「剩 N 天」显示。
 */
function askDeleteProject(scope, id) {
  const p = projectById(state.projects, id);
  if (!p) return;
  if (scope === 'shared') {
    const n = Number(p.ruleCount) || 0;
    uiConfirm({
      title: '删除共享项目「' + p.name + '」？',
      bodyHTML: '<p>确认后进入<b>待删除</b>状态：<b>' + n + '</b> 条规则与全部历史版本原样保留，' +
        '期间任何人都能「恢复」。</p>' +
        '<p>倒计时结束仍无人恢复才真正删除（项目 + 规则 + 历史快照），不会当场消失。</p>',
      okText: '删除',
      danger: true,
      onOk: () => deleteSharedProject(id),
    });
    return;
  }
  const inside = rulesOfProject(state.allRules, id).length;
  uiConfirm({
    title: '删除项目「' + p.name + '」？',
    bodyHTML: '<p>会<b>立刻</b>连带删除该项目里的 <b>' + inside + '</b> 条 mock 规则' +
      '（无归属的规则永不命中，所以不是「脱组保留」）。共享项目里的内容不受影响。</p>' +
      '<p class="danger">私有项目没有回收站：确认后项目与规则一起消失，无法恢复。</p>',
    okText: '删除',
    danger: true,
    onOk: () => deleteProject(id),
  });
}

/** 待删除还剩几天（向上取整，最小 0）。TTL 由服务端的 purgeAt 决定，前端不自造天数 */
function daysLeft(purgeAt) {
  const t = Number(purgeAt);
  if (!Number.isFinite(t)) return 0;
  return Math.max(0, Math.ceil((t - Date.now()) / 86400000));
}

/** 删除私有项目 = **立刻**级联删除里面所有规则（ADR-033 决策 6），所以确认框必须先报条数 */
async function deleteProject(id) {
  const p = projectById(state.projects, id);
  if (!p) return;
  const inside = rulesOfProject(state.allRules, id).length;
  const res = await apiFetch('/__ec/api/groups/' + encodeURIComponent(id), { method: 'DELETE' });
  if (!res.ok) { toast('删除失败：' + (await apiErrText(res))); return; }
  const data = await res.json().catch(() => ({}));
  if (state.projectId === id) state.projectId = null;
  if (state.mockDraft && state.mockDraft.projectId === id) state.mockDraft = null;
  await refreshMockData();
  toast('已删除项目，连带删除 ' + (data.removedRules == null ? inside : data.removedRules) + ' 条规则');
}

/**
 * 删除共享项目 = **软删除**（ADR-037）：服务端只打 `pendingDeleteAt` / `purgeAt`，
 * 规则与历史版本一条不动，倒计时内可以「恢复」；到期仍无人恢复才真删。
 * 所以这里的文案不能说「已删除」，否则用户会以为内容当场没了、转头去重建一份。
 */
async function deleteSharedProject(id) {
  const p = projectById(state.projects, id);
  if (!p) return;
  const inside = Number(p.ruleCount) || 0;
  const res = await apiFetch('/__ec/api/groups/' + encodeURIComponent(id), { method: 'DELETE' });
  if (!res.ok) { toast('删除失败：' + (await apiErrText(res))); return; }
  const data = await res.json().catch(() => ({}));
  await refreshMockData();
  toast('已标记为待删除：' + (p.name || id) + ' · ' +
    daysLeft(data.purgeAt == null ? null : data.purgeAt) + ' 天后真删' +
    (inside ? '，期间 ' + inside + ' 条规则原样保留，可恢复' : '，期间可恢复'));
}

/** 取消待删除：内容从未被改过，恢复即恢复原状 */
async function restoreSharedProject(id) {
  const name = projectNameOf(state.projects, id);
  const res = await apiFetch('/__ec/api/groups/' + encodeURIComponent(id) + '/restore', { method: 'POST' });
  if (!res.ok) { toast('恢复失败：' + (await apiErrText(res))); return; }
  await refreshMockData();
  toast('已恢复共享项目：' + name);
}

/**
 * copy：共享项目 → 我的私有项目（内容全部由服务端读，客户端只给 operationId）。
 * 复制得到的项目名带「（副本）」是服务端起的（协议 §6.2），控制台不另起名字，
 * 免得两边对不上；要改名随后用「重命名」。
 */
async function copyShared(id) {
  const p = projectById(state.projects, id);
  if (!p) return;
  await runProjectOp('copy:' + id, async (operationId) => {
    const res = await apiFetch('/__ec/api/groups/' + encodeURIComponent(id) + '/copy', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ operationId: operationId }),
    });
    if (!res.ok) { toast('复制失败：' + (await apiErrText(res))); return false; }
    const data = await res.json();
    const g = data.group || {};
    state.projectId = g.id || null;
    state.sharedId = null; state.versions = []; state.versionDetail = null;
    await refreshMockData();
    toast('已复制到「我的项目」：' + (g.name || '副本') + ' · ' +
      (Array.isArray(data.rules) ? data.rules.length : '?') + ' 条规则' +
      (data.replayed ? '（这是那次超时请求的重放，没有重复创建）' : ''));
    return true;
  });
}

/** share：把我的私有项目**整项目覆盖**到来源共享项目（首发 = 新建一份共享） */
async function sharePrivate(id) {
  const priv = projectById(state.projects, id);
  if (!priv) return;
  const origin = priv.originSharedProjectId ? projectById(state.projects, priv.originSharedProjectId) : null;
  const mine = rulesOfProject(state.allRules, id);
  let diff;
  if (origin) {
    // 预览用的「原共享内容」要如实拉一次：拿不到就别硬算（宁可少说，不能说错）
    const r = await apiFetch('/__ec/api/groups/' + encodeURIComponent(origin.id) + '/rules');
    if (!r.ok) { toast('读取共享项目当前内容失败：' + (await apiErrText(r))); return; }
    const cur = await r.json();
    diff = shareDiff(mine, priv.lineage, Array.isArray(cur) ? cur : []);
  } else {
    diff = { added: mine.length, removed: 0, kept: 0, willTotal: mine.length, hadTotal: 0 };
  }
  const head = origin
    ? ('覆盖共享项目「' + origin.name + '」？\n\n这次提交会把它整项目替换成我这份私有项目：\n' +
       '· 新增 ' + diff.added + ' 条\n· 删除 ' + diff.removed + ' 条\n· 保留 ' + diff.kept + ' 条\n' +
       '共享项目现在 ' + diff.hadTotal + ' 条 → 提交后 ' + diff.willTotal + ' 条' +
       // 「整项目覆盖」连名字一起覆盖（服务端 share 就是按私有项目重建共享项目）。
       // 共享项目的名字是**所有人**看到的，改名会跟着这次提交一起生效，必须事先说
       (origin.name !== priv.name ? '\n· 名称：「' + origin.name + '」→「' + priv.name + '」（所有人看到的都会跟着变）' : ''))
    : ('发布为新的共享项目「' + priv.name + '」？\n\n共享 ' + mine.length +
       ' 条规则给本实例所有登录用户复制。');
  if (!confirm(head + '\n\n' + SHARE_SELF_CHECK)) return;
  await runProjectOp('share:' + id, async (operationId) => {
    const res = await apiFetch('/__ec/api/groups/' + encodeURIComponent(id) + '/share', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ operationId: operationId }),
    });
    if (!res.ok) { toast('分享失败：' + (await apiErrText(res))); return false; }
    const data = await res.json();
    await refreshMockData();
    // 版本号 / 时间 / 操作人一律用服务端回传的那一份（协议 §7 第 11 条：客户端不得自造）
    toast('已分享 → ' + ((data.sharedProject && data.sharedProject.name) || '共享项目') +
      ' · 版本 ' + ((data.version && data.version.id) || '?') +
      ' · ' + fmtTime(data.createdAt) + ' · ' + (data.actor || '?') +
      (data.replayed ? '（重放：之前那次超时已经成功过）' : ''));
    return true;
  });
}

/**
 * 发布前的自查提示（计划 §11「敏感数据」）：共享项目和它的**全部历史**对本实例每个
 * 登录用户可见，旧版本还会保留后来删掉的返回 body。这句话必须由界面说，
 * 不能只在文档里写 —— 用户看不到就等于没提醒。
 */
const SHARE_SELF_CHECK =
  '⚠️ 分享前自查：返回值里不要带 token / cookie / 个人数据。\n' +
  '共享后，本实例**所有登录用户**都能读到这些内容**和全部历史版本**——\n' +
  '历史会长期保留后来被删掉的返回 body，回退也拿得回来。';

/** 历史面板：列表 → 预览某版 → 回退（回退是**追加一条**，旧版本一条不删） */
async function openSharedPanel(id) {
  state.sharedId = id;
  state.versions = [];
  state.sharedRules = [];
  state.versionDetail = null;
  renderTpl();
  const [vr, rr] = await Promise.all([
    apiFetch('/__ec/api/groups/' + encodeURIComponent(id) + '/versions'),
    apiFetch('/__ec/api/groups/' + encodeURIComponent(id) + '/rules'),
  ]);
  if (state.sharedId !== id) return;      // 期间切走了：不要把旧响应画到别的项目上
  if (!vr.ok) { toast('历史加载失败：' + (await apiErrText(vr))); }
  else { const data = await vr.json(); state.versions = Array.isArray(data) ? data : []; }
  if (!rr.ok) { toast('规则加载失败：' + (await apiErrText(rr))); }
  else { const data = await rr.json(); state.sharedRules = Array.isArray(data) ? data : []; }
  renderTpl();
}

async function previewVersion(id, versionId) {
  const res = await apiFetch('/__ec/api/groups/' + encodeURIComponent(id) +
    '/versions/' + encodeURIComponent(versionId));
  if (!res.ok) { toast('版本预览失败：' + (await apiErrText(res))); return; }
  const data = await res.json();
  if (state.sharedId !== id) return;
  state.versionDetail = data && data.version ? data : null;
  renderTpl();
}

async function rollbackTo(id, versionId) {
  const v = (state.versions || []).find((x) => x && x.id === versionId) || null;
  const label = v ? (fmtTime(v.createdAt) + ' · ' + (v.actorPhone || '?') + ' · ' + v.ruleCount + ' 条') : versionId;
  if (!confirm('回退共享项目到这个历史版本？\n\n' + label +
    '\n\n回退**不是撤销**：它会把共享项目的当前内容整批替换成这一版快照，\n' +
    '并**追加**一条 rollback 历史（旧记录一条不删）。\n所有已经复制过这个共享项目的私有副本都不会自动变化。')) return;
  await runProjectOp('rollback:' + id + ':' + versionId, async (operationId) => {
    const res = await apiFetch('/__ec/api/groups/' + encodeURIComponent(id) + '/rollback', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ versionId: versionId, operationId: operationId }),
    });
    if (!res.ok) { toast('回退失败：' + (await apiErrText(res))); return false; }
    const data = await res.json();
    state.versionDetail = null;
    await refreshMockData();
    if (state.sharedId === id) await openSharedPanel(id);
    toast('已回退 → 新版本 ' + ((data.version && data.version.id) || '?') +
      ' · ' + fmtTime(data.createdAt) + ' · ' + (data.actor || '?'));
    return true;
  });
}

async function toggleArchive(id) {
  const p = projectById(state.projects, id);
  if (!p) return;
  const next = !p.archived;
  const res = await apiFetch('/__ec/api/groups/' + encodeURIComponent(id) + '/archive', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ archived: next }),
  });
  if (!res.ok) { toast((next ? '归档' : '取消归档') + '失败：' + (await apiErrText(res))); return; }
  await refreshMockData();
  toast(next ? '已归档（快照与历史一条不动，仍可回退）' : '已取消归档');
}

/**
 * 项目级写操作（copy / share / rollback）共用的幂等外壳：
 * **一次用户动作 = 一个 operationId**，失败后原地重试复用同一个（超时重发只生成一次版本，
 * 协议 §5.5）。成功或换了动作就丢掉那条记录，否则下一次「我真的再分享一遍」会被
 * 服务端当成重放而不生效。
 */
const opIds = {};
async function runProjectOp(key, fn) {
  if (state.busy) { toast('上一条项目操作还没结束，请先等它完成'); return; }
  state.busy = true;
  const operationId = reuseOperationId(opIds, key, key.split(':')[0]);
  try {
    const ok = await fn(operationId);
    if (ok !== false) delete opIds[key];
  } catch (e) {
